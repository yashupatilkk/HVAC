/* ---------- sheet edited by a human -> stamp time so the app pulls it ---------- */
function onEditHandler(e) {
  try {
    if (!e || !e.range) return;
    var name = e.range.getSheet().getName();
    if (name === META || name === SUMMARY) return;
    setMeta_(name, new Date(), 'edited in Google Sheet');
  } catch (err) {}
}

/* ---------- APP  ->  GET data (JSONP, no CORS problems) ---------- */
function doGet(e) {
  var p = (e && e.parameter) || {};
  if (p.action === 'ping') {
    var s0 = SpreadsheetApp.getActiveSpreadsheet();
    return jsonp_(e, {ok: true, version: VERSION, tabs: s0.getSheets().length, hasSummary: !!s0.getSheetByName(SUMMARY), sheetUrl: s0.getUrl(), time: new Date().toISOString()});
  }
  if (p.action === 'buildSummary') {            /* v5.4: build the Summary tab NOW, readable reply */
    var ssB = SpreadsheetApp.getActiveSpreadsheet();
    var sumErr = '';
    try { buildSummaryCore_(); } catch (eB) { sumErr = String(eB && eB.message ? eB.message : eB); }
    return jsonp_(e, {ok: true, version: VERSION, tabs: ssB.getSheets().length,
      hasSummary: !!ssB.getSheetByName(SUMMARY), summaryError: sumErr,
      sheetUrl: ssB.getUrl(), time: new Date().toISOString()});
  }
  if (p.action === 'setPerm' && p.site) {       /* v5.5: admin sets a site edit / view-only */
    setPerm_(String(p.site), String(p.perm || ''));
    return jsonp_(e, {ok: true, version: VERSION, site: String(p.site), perm: String(p.perm || ''), time: new Date().toISOString()});
  }
  if (p.action === 'requestEdit' && p.site) {   /* v5.24: a site login asks the admin for edit permission */
    requestEdit_(String(p.site));
    return jsonp_(e, {ok: true, version: VERSION, site: String(p.site), requested: true, time: new Date().toISOString()});
  }
  if (p.action === 'clearReq' && p.site) {      /* v5.24: admin removes an edit request (keep view-only) */
    clearReq_(String(p.site));
    return jsonp_(e, {ok: true, version: VERSION, site: String(p.site), time: new Date().toISOString()});
  }
  if (p.action === 'users') {                   /* v5.9: passwords only (small + fast) */
    return jsonp_(e, {ok: true, version: VERSION, users: readUsers_(), time: new Date().toISOString()});
  }
  if (p.action === 'site' && p.name) {          /* getSite: one site only */
    var sh1 = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(String(p.name));
    var one = {};
    one[String(p.name)] = sh1 ? parseTab_(sh1) : {};
    var mm = {}; mm[String(p.name)] = getMeta_(String(p.name));
    return jsonp_(e, {sites: one, meta: mm, sheetUrl: SpreadsheetApp.getActiveSpreadsheet().getUrl(), time: new Date().toISOString()});
  }
  /* v5.5: LIVE PHONE VIEW - the QR in the app points here. Google itself serves
     a small read-only page for one site, so the QR works on ANY phone with
     zero hosting. Link:  /exec?view=SiteName&t=token  (+ optional &y=YEAR) */
  if (p.view) {
    return viewPage_(String(p.view), String(p.t || ''), p.y ? parseInt(p.y, 10) : null, String(p.a || ''));
  }
  /* v5.16 WEB LINK EDITION - no parameters = serve the WHOLE APP as a web page.
     The Web app URL itself becomes the app: open it in Chrome on any phone/PC. */
  if (!p.action && !p.view && !p.callback) {
    var self0 = '';
    try { self0 = ScriptApp.getService().getUrl(); } catch (eS) { self0 = ''; }
    var html0 = String(APP_HTML || '');
    if (!html0) {
      return HtmlService.createHtmlOutput('<html><body style="font-family:sans-serif;padding:30px"><h2>&#10052; App not embedded yet</h2><p style="color:#64748b">This sheet is running older code. Open the app file &rarr; &#9881; Sheets Setup &rarr; <b>Copy Apps Script code</b> &rarr; paste it here &rarr; Save &rarr; then <b>Deploy &rarr; Manage deployments &rarr; Edit &rarr; New version &rarr; Deploy</b>.</p></body></html>').setTitle('HVAC Manager');
    }
    if (self0) html0 = html0.replace('<head>', '<head><script>window.__HVAC_SELF_URL=' + JSON.stringify(self0) + '<\/script>');   /* v5.16: the served page learns its own URL -> sync auto-links */
    return HtmlService.createHtmlOutput(html0).setTitle('HVAC Manager v' + VERSION);
  }
  return jsonp_(e, getAll_());                   /* getAll: every site */
}

/* ---------- APP  ->  POST saved data (saveSite / saveAll) ---------- */
function doPost(e) {
  var body = {};
  try { body = JSON.parse(e.postData.contents); } catch (err) {}
  if (body.action === 'save' && body.site) {     /* saveSite: one site */
    writeSite_(String(body.site), body.data || {}, body.ts, body.by);
    return jsonp_(e, {ok: true, saved: 1, site: body.site, time: new Date().toISOString()});
  }
  if (body.action === 'saveAll' && body.sites) { /* saveAll: the app pushes in SMALL BATCHES (GAS has a 30s limit) */
    var n = 0, failed = [];
    for (var s in body.sites) {
      try { writeSite_(String(s), body.sites[s] || {}, body.ts, body.by, true); n++; }
      catch (err1) { failed.push(String(s)); try { Logger.log('saveAll ' + s + ' FAILED: ' + err1); } catch (e1) {} }
    }
    var sumErr = '';                                              /* last batch also rebuilds the Summary tab */
    if (body.final) { try { buildSummaryCore_(); } catch (e2) { sumErr = String(e2 && e2.message ? e2.message : e2); } }

  }

  }
  if (body.action === 'saveUsers' && body.users) {        /* v5.9: "push all passwords" button */
    var nU = 0;
    for (var uk in body.users) {
      try { saveUser_(uk, body.users[uk].pass, body.users[uk].site, body.by); nU++; }
      catch (errU) { try { Logger.log('saveUsers ' + uk + ' FAILED: ' + errU); } catch (eL) {} }
    }
    return jsonp_(e, {ok: true, savedUsers: nU, time: new Date().toISOString()});

}

/* ---------- read every site tab ---------- */
function getAll_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheets = ss.getSheets();
  var sites = {}, meta = {};
  for (var i = 0; i < sheets.length; i++) {
    var name = sheets[i].getName();
    if (!isSiteTab_(name)) continue;   /* v5.5: never treat Users/Sites/Entries/Log/Sheet1 as a site */
    var d = parseTab_(sheets[i]);
    if (d) sites[name] = d;
  }
  var m = ss.getSheetByName(META);
  var perms = {};                                /* v5.5: sites set to view-only by the admin */
  var reqs = {};                                 /* v5.24: sites asking the admin for edit permission */
  if (m && m.getLastRow() > 1) {
    var rows = m.getRange(2, 1, m.getLastRow() - 1, 5).getValues();
    for (var r = 0; r < rows.length; r++) {
      if (rows[r][0]) {
        meta[String(rows[r][0])] = {
          ts: rows[r][1] ? new Date(rows[r][1]).toISOString() : '',
          by: String(rows[r][2] || '')
        };
        if (String(rows[r][3]) === 'view') perms[String(rows[r][0])] = 'view';
        if (String(rows[r][4]) === 'requested') reqs[String(rows[r][0])] = true;   /* v5.24 */
      }
    }
  }
  return {sites: sites, meta: meta, perms: perms, reqs: reqs, users: readUsers_(),   /* v5.9: passwords ride along on every pull */
    hasSummary: !!ss.getSheetByName(SUMMARY), sheetUrl: ss.getUrl(), time: new Date().toISOString(), version: VERSION};
}

/* ---------- parse one site tab (Metric | Year | Jan..Dec) ---------- */
function parseTab_(sh) {
  var data = {};
  var last = sh.getLastRow();
  if (last < 2) return null;
  var values = sh.getRange(1, 1, last, 14).getValues();
  for (var r = 0; r < values.length; r++) {
    var label = String(values[r][0] || '').trim();
    var year = parseInt(values[r][1], 10);
    if (!label || !(year >= 2015 && year <= 2040)) continue;
    var mk = labelToMetric_(label);
    if (!mk) continue;
    var arr = [];
    for (var m = 0; m < 12; m++) {
      var v = values[r][2 + m];
      arr.push((v === '' || v === null || isNaN(Number(v))) ? null : Number(v));
    }
    if (!data[year]) data[year] = {};
    data[year][mk] = arr;
  }
  for (var y in data) {
    var yy = data[y];
    if (yy.ebdg && allNull_(yy.ebdg)) delete yy.ebdg;
    if (yy.kwtr && allNull_(yy.kwtr)) delete yy.kwtr;
    if (!yy.ebdg && (yy.eb || yy.dg)) {
      yy.ebdg = [];
      for (var i = 0; i < 12; i++) {
        var eb = yy.eb ? yy.eb[i] : null, dg = yy.dg ? yy.dg[i] : null;
        yy.ebdg.push((eb == null && dg == null) ? null : Number(eb || 0) + Number(dg || 0));
      }
    }
    if (!yy.kwtr && yy.ebdg && yy.btu) {
      yy.kwtr = [];
      for (var j = 0; j < 12; j++) {
        var b = yy.btu[j], e2 = yy.ebdg[j];
        yy.kwtr.push((b && e2 != null) ? Math.round(e2 / b * 100) / 100 : null);
      }
    }
  }
  var has = false;
  for (var k in data) { has = true; break; }
  return has ? data : null;
}

function allNull_(a) {
  for (var i = 0; i < a.length; i++) { if (a[i] !== null && a[i] !== '') return false; }
  return true;
}

function labelToMetric_(s) {
  s = String(s).toLowerCase();
  if (s.indexOf('kw') > -1 && s.indexOf('tr') > -1 && (s.indexOf('/') > -1 || s.indexOf('per') > -1)) return 'kwtr';
  if (s.indexOf('eb+dg') > -1 || s.indexOf('ebdg') > -1 || (s.indexOf('eb') > -1 && s.indexOf('dg') > -1 && s.indexOf('+') > -1)) return 'ebdg';
  if (s.indexOf('dg') > -1) return 'dg';
  if (s.indexOf('btu') > -1) return 'btu';
  if (s.indexOf('bill') > -1) return 'billed';
  if (s.indexOf('eb') > -1) return 'eb';
  return null;
}

/* ---------- write one site tab (used when the app pushes) ----------
 * Layout (row 1 banner, row 2 header, data from row 3):
 *   row 1:  site name band (merged, dark blue)
 *   row 2:  Metric | Year | Jan..Dec | Year Total
 *   6 rows per year: BTU / Billed / EB / DG / EB+DG (formula) / kW/TR (formula)
 * The "Year Total" column adds a clear total for every row.
 * designSite_ is called EVERY time, so the tab is always clean.
 */
var COLS = ['C','D','E','F','G','H','I','J','K','L','M','N'];
function v_(arr, i) {
  return (arr && arr[i] != null && !isNaN(Number(arr[i]))) ? Number(arr[i]) : '';
}
function sumFormula_(r) {
  return '=IF(COUNT(C' + r + ':N' + r + ')=0,"",SUM(C' + r + ':N' + r + '))';
}
function writeSite_(site, data, ts, by, skipSummary) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(site);
  if (!sh) sh = ss.insertSheet(site);
  sh.clearContents();
  /* v5.18: unfreeze BEFORE the whole-sheet unmerge - Google refuses unmerge
     calls that span frozen + non-frozen columns (see designSite_). */
  try { sh.setFrozenColumns(0); } catch (eU) {}
  /* v5.5: drop ALL stale merges (whole sheet). Old bounded sweeps missed
     merges below the data - they crashed the next design run. */
  sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).breakApart();
  sh.getRange(1, 1).setValue('HVAC  |  ' + site + '  -  consumption log');
  sh.getRange(2, 1, 1, 15).setValues([['Metric', 'Year'].concat(MONTHS, ['Year Total'])]);
  var years = Object.keys(data).map(Number).sort(function (a, b) { return a - b; });
  var rows = [];
  years.forEach(function (y, yi) {
    var yy = data[y] || {};
    var R = { btu: 3 + yi * 6, billed: 4 + yi * 6, eb: 5 + yi * 6, dg: 6 + yi * 6, ebdg: 7 + yi * 6, kwtr: 8 + yi * 6 };
    var rowB = [], rowA = [], rowE = [], rowG = [], rowX = [], rowK = [];
    for (var i = 0; i < 12; i++) {
      var col = COLS[i];
      var b = v_(yy.btu, i), a = v_(yy.billed, i), eb = v_(yy.eb, i), dg = v_(yy.dg, i);
      rowB.push(b); rowA.push(a); rowE.push(eb); rowG.push(dg);
      var hasEG = (eb !== '' || dg !== '');
      var xStored = v_(yy.ebdg, i);
      rowX.push(hasEG
        ? '=IF(COUNT(' + col + R.eb + ',' + col + R.dg + ')=0,"",SUM(' + col + R.eb + ':' + col + R.dg + '))'
        : xStored);
      var xEff = hasEG ? Number(eb || 0) + Number(dg || 0) : (xStored === '' ? null : xStored);
      var kStored = v_(yy.kwtr, i);
      rowK.push((b !== '' && xEff != null)
        ? '=IF(OR(' + col + R.btu + '="",' + col + R.btu + '=0,' + col + R.ebdg + '=""),"",ROUND(' + col + R.ebdg + '/' + col + R.btu + ',4))'
        : kStored);
    }
    rows.push([METRIC_LABELS.btu, y].concat(rowB, [sumFormula_(R.btu)]));
    rows.push([METRIC_LABELS.billed, y].concat(rowA, [sumFormula_(R.billed)]));
    rows.push([METRIC_LABELS.eb, y].concat(rowE, [sumFormula_(R.eb)]));
    rows.push([METRIC_LABELS.dg, y].concat(rowG, [sumFormula_(R.dg)]));
    rows.push([METRIC_LABELS.ebdg, y].concat(rowX, [sumFormula_(R.ebdg)]));
    rows.push([METRIC_LABELS.kwtr, y].concat(rowK,
      ['=IF(OR(O' + R.btu + '="",O' + R.ebdg + '=""),"",ROUND(O' + R.ebdg + '/O' + R.btu + ',4))']));
  });
  if (rows.length) sh.getRange(3, 1, rows.length, 15).setValues(rows);
  sh.setFrozenRows(2);
  setMeta_(site, ts ? new Date(ts) : new Date(), by || 'app');
  designSite_(sh, site);
  if (!skipSummary) { try { refreshSummary_(); } catch (eS) {} }
}

/* =================================================================
 *  DESIGN  -  ONE CLEAN COLOR FOR EVERY TAB
 * ================================================================= */

/* Write a text into row "row", merged across "width" columns.
 * Safe pattern: setValue first (single cell), merge afterwards.
 * NEVER use setValues() on a merged range (that crashes GAS).
 * v5.5: the merge itself is guarded - if Google refuses the merge the
 * text still lands in the first cell and the row is still painted.
 * v5.18: optional "col" start column - Google refuses merges that SPAN the
 * frozen boundary, so every merge must stay inside one zone (frozen or not).
 * Default col=1 keeps the old behaviour for callers that never freeze. */
function mergedText_(sh, row, width, text, col) {
  if (!col) col = 1;
  sh.getRange(row, col).setValue(text);
  var rg = sh.getRange(row, col, 1, width);
  try { rg.merge(); } catch (eM) { try { Logger.log('mergedText_ row ' + row + ': ' + eM); } catch (e2) {} }
  return rg;
}

/* Design one site tab. Returns 1 if designed, 0 if skipped.
 * Detects the tab layout first:
 *   - old layout (header in row 1)  -> inserts a banner row, then designs
 *   - new layout (banner 1, header 2) -> designs directly
 *   - anything else -> left untouched (never breaks unknown tabs) */
function designSite_(sh, name) {
  try {
    /* v5.18: Google refuses merge AND unmerge calls that touch frozen and
       non-frozen columns together ("You can't merge frozen and non-frozen
       columns"). Unfreeze FIRST - clean + design on a free sheet - the
       columns are frozen again a few lines below, before any merge. */
    try { sh.setFrozenColumns(0); } catch (eU) {}
    var v1 = '', v2 = '';
    try { v1 = String(sh.getRange(1, 1).getValue() || ''); } catch (e0) {}
    if (v1.indexOf('Metric') === 0) { sh.insertRowBefore(1); v1 = ''; }   /* upgrade old layout */
    try { v2 = String(sh.getRange(2, 1).getValue() || ''); } catch (e0b) {}
    if (v2.indexOf('Metric') !== 0) return 0;                             /* unknown layout: skip */

    var last = Math.max(sh.getLastRow(), 2);
    if (sh.getMaxColumns() < 15) sh.insertColumnsAfter(sh.getMaxColumns(), 15 - sh.getMaxColumns() + 1);
    /* v5.5: sweep the WHOLE sheet for stale merges. The old bounded sweep
       (last+8 rows) missed merges below the data or wider than 15 columns -
       they made every later freeze/merge call die with
       "can't freeze columns which contain only part of a merged cell". */
    sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).breakApart();
    sh.setConditionalFormatRules([]);
    sh.clearFormats();

    /* v5.18: FREEZE FIRST (sheet is clean here), then merge ONLY inside one
       zone. A,B stay frozen; the title band lives in the scroll area C1:O1
       and the frozen A1:B1 gets a small 'HVAC' label - same look, and Google
       accepts every merge because none of them crosses the freeze line. */
    sh.setFrozenRows(2);
    sh.setFrozenColumns(2);

    /* row 1 - title band */
    sh.getRange(1, 1).setValue('HVAC');
    sh.getRange(1, 1, 1, 2).setBackground(C.deep).setFontColor('#ffffff')
      .setFontWeight('bold').setFontSize(11).setVerticalAlignment('middle');
    mergedText_(sh, 1, 13, 'HVAC  |  ' + name + '  -  consumption log', 3)
      .setBackground(C.deep).setFontColor('#ffffff').setFontWeight('bold')
      .setFontSize(11).setVerticalAlignment('middle').setHorizontalAlignment('left');
    sh.setRowHeight(1, 30);

    /* row 2 - header */
    sh.getRange(2, 1, 1, 15).setBackground(C.head).setFontColor(C.navy)
      .setFontWeight('bold').setFontSize(10).setHorizontalAlignment('center');
    sh.setRowHeight(2, 22);

    if (last >= 3) {
      /* month + total numbers */
      sh.getRange(3, 3, last - 2, 13).setNumberFormat('#,##0.00');
      sh.getRange(3, 3, last - 2, 13).setHorizontalAlignment('right');
      var area = sh.getRange(3, 1, last - 2, 15);
      area.setBorder(true, true, true, true, true, true, C.line, SpreadsheetApp.BorderStyle.SOLID);
      area.setFontSize(10);
      /* Metric + Year columns */
      sh.getRange(3, 1, last - 2, 2).setBackground(C.label).setFontColor(C.navy).setFontWeight('bold');
      sh.getRange(3, 2, last - 2, 1).setHorizontalAlignment('center');
      /* Year Total column */
      sh.getRange(3, 15, last - 2, 1).setBackground(C.label).setFontColor(C.navy).setFontWeight('bold');
      /* per year block: calculated rows gray, kW/TR format, blue year separator */
      var grayL = [], kwL = [], seps = [];
      for (var r = 3; r + 5 <= last; r += 6) {
        grayL.push('A' + (r + 4) + ':O' + (r + 5));
        kwL.push('C' + (r + 5) + ':O' + (r + 5));
        seps.push(r);
      }
      if (grayL.length) {   /* RangeList: 2 calls instead of 2 per year block (keeps each batch fast) */
        sh.getRangeList(grayL).setBackground(C.soft).setFontColor('#475569');
        sh.getRangeList(kwL).setNumberFormat('0.0000');
      }
      for (var i2 = 0; i2 < seps.length; i2++) {
        sh.getRange(seps[i2], 1, 1, 15).setBorder(true, null, null, null, null, null, C.deep, SpreadsheetApp.BorderStyle.SOLID_MEDIUM);
      }
      mergedText_(sh, last + 1, 13, 'White cells: type your monthly numbers  -  Gray rows: calculated for you (EB+DG, kW/TR)  -  Blue column: Year Total  -  code v' + VERSION, 3)
        .setFontColor(C.gray).setFontStyle('italic').setFontSize(9);
    }

    sh.setColumnWidth(1, 168);
    sh.setColumnWidth(2, 56);
    sh.setColumnWidths(3, 13, 92);
    sh.setHiddenGridlines(true);
    return 1;
  } catch (err) {
    try { Logger.log('designSite_ ' + name + ': ' + err); } catch (e2) {}
    return 0;
  }
}

/* Design EVERY site tab, one by one; a broken tab never stops the others. */
function designAll_() {
  var sheets = SpreadsheetApp.getActiveSpreadsheet().getSheets();
  var done = 0, skipped = [], failed = [];
  for (var i = 0; i < sheets.length; i++) {
    var nm = sheets[i].getName();
    if (!isSiteTab_(nm)) continue;     /* v5.5: system tabs are never designed or listed */
    try {
      if (designSite_(sheets[i], nm)) done++; else skipped.push(nm);
    } catch (e) {
      failed.push(nm);
      try { Logger.log('designAll_ failed: ' + nm + ' - ' + e); } catch (e2) {}
    }
  }
  return {done: done, skipped: skipped, failed: failed};
}

/* =================================================================
 *  SUMMARY TAB - THE SAME LAYOUT AS THE USER'S EXCEL SUMMARY
 *  Left table (A..L):  SL.No | Site Name | Units | 2023 | 2024 |
 *                      "2025-2026" (Q1..Q4) | SAVINGS (Units kwh, AMOUNT) | Remark
 *  Right table (R..V): "HVAC Chiller plant room Kw/TR":
 *                      Sites | 2023 | 2024 | 2025 | Remarks
 *  kW/TR = (EB+DG kWh) / BTU TR, weighted. The "2025-2026" column is the
 *  fiscal year Apr-Mar: Q1=Apr-Jun, Q2=Jul-Sep, Q3=Oct-Dec, Q4=Jan-Mar.
 *  SAVINGS + Remark: whatever a human types in the tab is KEPT on refresh.
 * ================================================================= */
var FY_START = 2025;                       /* the "2025-2026" column = Apr 2025 - Mar 2026 */
var SYS_TABS = {Users:1, Sites:1, Entries:1, Log:1, Sheet1:1, Sheet2:1, Sheet3:1};
var SUMMARY_ORDER = ['PMS','PTS','PSN','Atrium','Summit','PTP-VALDEL','PTP-Platina','PTP-JMV','PTP-COSMOS','PTP-Gravity','UB Plaza','FTP','PTC','PTPP-B1','PTPP-B2','Oblisk','Technopolis','Alkareem','Dynasty','Emerald','Sterling Square','Blue Chip','Towers','Alpha','Cosmopolitan','Cyber Tower','Palladium','Metropolitan','Polygone','Cyber Green','TMS Square','Alphatech','Sky Tech'];
var SUMMARY_SEED = {                       /* savings + remarks from the original Excel */
  'PTS':         {kwh: 750612, inr: 4503671},
  'PSN':         {kwh: 591592, inr: 3549550, note: 'New cooling tower and direct drive motor'},
  'Summit':      {kwh: 55474,  inr: 332844},
  'PTP-VALDEL':  {kwh: 419056, inr: 2514335, note: 'Direct drive & descaling. New ACC coil'},
  'PTP-Platina': {kwh: 12109,  inr: 72653,   note: 'Rectified water cooled chiller'},
  'PTP-JMV':     {kwh: 544950, inr: 3269699, note: 'New Chiller'},
  'PTP-Gravity': {note: 'CPM logic changed'},
  'PTC':         {note: 'Building got low load'}
};
function isSiteTab_(n) { return n !== META && n !== SUMMARY && !SYS_TABS[n]; }
function qKw_(d, y, m0, m1) {
  var yy = d[y]; if (!yy) return null;
  var b = 0, x = 0, had = false;
  for (var m = m0; m <= m1; m++) {
    var bv = (yy.btu && yy.btu[m] != null) ? Number(yy.btu[m]) : null;
    var xv = (yy.ebdg && yy.ebdg[m] != null) ? Number(yy.ebdg[m]) : null;
    if (bv != null && !isNaN(bv) && xv != null && !isNaN(xv)) { b += bv; x += xv; had = true; }
  }
  return (had && b > 0) ? Math.round(x / b * 1000) / 1000 : null;

function yrKw_(d, y) { return qKw_(d, y, 0, 11); }
function nz_(v) { return (v === null || v === undefined) ? '' : v; }
function fmtSafe_(rg, f) { try { rg.setNumberFormat(f); } catch (eF) { try { rg.setNumberFormat('0.00'); } catch (e2) {} } }

function buildSummaryCore_() {
  /* THROWS on any error - callers decide how to report it.
     refreshSummary_() below is the silent wrapper for saves/menu. */
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(SUMMARY) || ss.insertSheet(SUMMARY);

  /* 1) remember what a human typed into SAVINGS / Remark - kept across refreshes */
  var keep = {};
  try {
    var lr0 = sh.getLastRow();
    if (lr0 > 3 && sh.getLastColumn() > 1) {
      var old = sh.getRange(1, 1, Math.min(lr0, 80), Math.min(sh.getLastColumn(), 22)).getValues();
      for (var kr = 0; kr < old.length; kr++) {
        var sn = String(old[kr][1] || '').trim() || String(old[kr][0] || '').trim();
        if (sn && sn.indexOf('HVAC') !== 0 && sn.indexOf('Chiller') !== 0 &&
            sn.indexOf('ALL SITES') !== 0 && sn !== 'Site Name' && !keep[sn]) {
          keep[sn] = {j: old[kr][9], k: old[kr][10], l: old[kr][11], v: old[kr][21]};
        }
      }
    }
  } catch (eK) {}

  /* 2) clean slate: content, formats and ALL stale merges gone
        (the user's v5.1 log died here with "You must select all cells in a
        merged range" - the whole-sheet sweep fixes exactly that) */
  /* v5.18: unfreeze first - if a human froze columns on Summary, Google would
     refuse the unmerge below and Setup would die here. */
  try { sh.setFrozenColumns(0); } catch (eS2) {}
  sh.clearContents();
  sh.clearFormats();
  sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).breakApart();
  if (sh.getMaxColumns() < 22) sh.insertColumnsAfter(sh.getMaxColumns(), 22 - sh.getMaxColumns() + 1);

  /* 3) collect the sites - same order as the Excel Summary */
  var sheets = ss.getSheets(), dataByName = {};
  for (var i = 0; i < sheets.length; i++) {
    var nm = sheets[i].getName();
    if (!isSiteTab_(nm)) continue;
    try { var d = parseTab_(sheets[i]); if (d) dataByName[nm] = d; } catch (eP) {}
  }
  var sites = [];
  SUMMARY_ORDER.forEach(function (n) { if (dataByName[n]) sites.push(n); });
  Object.keys(dataByName).sort(function (a, b) { return a < b ? -1 : 1; })
    .forEach(function (n) { if (sites.indexOf(n) === -1) sites.push(n); });
  var N = sites.length;

  /* 4) FREEZE FIRST, MERGE AFTER - a merged title band would block the freeze
        (the user's v5.1 log: "can't freeze columns which contain only part
        of a merged cell" - freezing the clean sheet always works) */
  sh.setFrozenRows(3);

  /* 5) values first (plain), merges later - never setValues on a merged range */
  sh.getRange(1, 1).setValue('Chiller plant room consumption');
  sh.getRange(2, 1, 1, 12).setValues([['SL.No', 'Site Name', '', '2023', '2024', '2025-2026', '', '', '', 'SAVINGS', '', 'Remark']]);
  sh.getRange(3, 1, 1, 12).setValues([['', '', 'Units', '', '', 'Q1', 'Q2', 'Q3', 'Q4', 'Units kwh', 'AMOUNT', '']]);
  sh.getRange(2, 18).setValue('HVAC Chiller plant room Kw/TR');
  sh.getRange(3, 18, 1, 5).setValues([['Sites', '2023', '2024', '2025', 'Remarks']]);

  if (N) {
    var rows = [], rrows = [];
    for (var s = 0; s < N; s++) {
      var name = sites[s], d2 = dataByName[name];
      var k23 = yrKw_(d2, '2023'), k24 = yrKw_(d2, '2024'), k25 = yrKw_(d2, '2025');
      var q1 = qKw_(d2, String(FY_START), 3, 5);
      var q2 = qKw_(d2, String(FY_START), 6, 8);
      var q3 = qKw_(d2, String(FY_START), 9, 11);
      var q4 = qKw_(d2, String(FY_START + 1), 0, 2);
      var sd = SUMMARY_SEED[name] || {};
      var kp = keep[name] || {};
      var jv = (kp.j !== '' && kp.j != null) ? kp.j : (sd.kwh != null ? sd.kwh : '');
      var kv = (kp.k !== '' && kp.k != null) ? kp.k : (sd.inr != null ? sd.inr : '');
      var lv = (kp.l !== '' && kp.l != null) ? kp.l : (sd.note || '');
      var vv = (kp.v !== '' && kp.v != null) ? kp.v : '';
      rows.push([s + 1, name, 'Kw/TR', nz_(k23), nz_(k24), nz_(q1), nz_(q2), nz_(q3), nz_(q4), nz_(jv), nz_(kv), nz_(lv)]);
      rrows.push([name, nz_(k23), nz_(k24), nz_(k25), nz_(vv)]);
    }
    sh.getRange(4, 1, N, 12).setValues(rows);
    sh.getRange(4, 18, N, 5).setValues(rrows);
  }

  try { sh.getRange(2, 2, 1, 2).merge(); } catch (e2) {}      /* Site Name B2:C2   */
  try { sh.getRange(2, 6, 1, 4).merge(); } catch (e3) {}      /* 2025-2026 F2:I2   */
  try { sh.getRange(2, 10, 1, 2).merge(); } catch (e4) {}     /* SAVINGS J2:K2     */
  try { sh.getRange(2, 1, 2, 1).merge(); } catch (e5) {}      /* SL.No  A2:A3      */
  try { sh.getRange(2, 4, 2, 1).merge(); } catch (e6) {}      /* 2023   D2:D3      */
  try { sh.getRange(2, 5, 2, 1).merge(); } catch (e7) {}      /* 2024   E2:E3      */
  try { sh.getRange(2, 12, 2, 1).merge(); } catch (e8) {}     /* Remark L2:L3      */
  try { sh.getRange(2, 18, 1, 4).merge(); } catch (e9) {}     /* right title R2:U2 */

  /* 7) one-color design (the same blue family as every tab) */
  sh.getRange(1, 1, 1, 12).setBackground(C.deep).setFontColor('#ffffff')
    .setFontWeight('bold').setFontSize(12).setVerticalAlignment('middle');
  sh.setRowHeight(1, 30);
  sh.getRange(2, 1, 2, 12).setBackground(C.head).setFontColor(C.navy)
    .setFontWeight('bold').setFontSize(10).setHorizontalAlignment('center')
    .setVerticalAlignment('middle').setWrap(true);
  sh.getRange(2, 18, 2, 5).setBackground(C.head).setFontColor(C.navy)
    .setFontWeight('bold').setFontSize(10).setHorizontalAlignment('center').setWrap(true);
  sh.getRange(2, 18, 1, 4).setBackground(C.deep).setFontColor('#ffffff');
  sh.setRowHeight(2, 20);
  sh.setRowHeight(3, 20);
  if (N) {
    sh.getRange(2, 1, 2, 12).setBorder(true, true, true, true, true, true, C.line, SpreadsheetApp.BorderStyle.SOLID);
    sh.getRange(2, 18, 2, 5).setBorder(true, true, true, true, true, true, C.line, SpreadsheetApp.BorderStyle.SOLID);
    sh.getRange(4, 1, N, 12).setBorder(true, true, true, true, true, true, C.line, SpreadsheetApp.BorderStyle.SOLID);
    sh.getRange(4, 18, N, 5).setBorder(true, true, true, true, true, true, C.line, SpreadsheetApp.BorderStyle.SOLID);
    sh.getRange(4, 1, N, 2).setFontWeight('bold').setFontColor(C.navy);
    sh.getRange(4, 3, N, 1).setFontColor(C.gray).setHorizontalAlignment('center').setFontSize(9);
    fmtSafe_(sh.getRange(4, 4, N, 6), '0.00#');
    sh.getRange(4, 4, N, 6).setHorizontalAlignment('right');
    fmtSafe_(sh.getRange(4, 10, N, 2), '#,##0');
    sh.getRange(4, 10, N, 2).setHorizontalAlignment('right');
    sh.getRange(4, 18, N, 1).setFontWeight('bold').setFontColor(C.navy);
    fmtSafe_(sh.getRange(4, 19, N, 3), '0.00#');
    sh.getRange(4, 19, N, 3).setHorizontalAlignment('right');
  }
  var noteRow = (N ? 4 + N + 1 : 6);
  if (!N) {
    mergedText_(sh, 4, 12, 'No site data yet. In the app: Sheets Setup -> "Push all data to Google Sheet".')
      .setFontColor(C.gray).setFontSize(10);
  }
  mergedText_(sh, noteRow, 12, 'Q1 = Apr-Jun, Q2 = Jul-Sep, Q3 = Oct-Dec, Q4 = Jan-Mar of ' + FY_START + '-' + (FY_START + 1) +
    '  -  kW/TR = (EB+DG kWh) / BTU TR  -  SAVINGS + Remark: type here, your text is kept when the tab refreshes  -  code v' + VERSION)
    .setFontColor(C.gray).setFontStyle('italic').setFontSize(9);
  sh.setHiddenGridlines(true);
  sh.setColumnWidth(1, 50);
  sh.setColumnWidth(2, 150);
  sh.setColumnWidth(3, 60);
  sh.setColumnWidths(4, 6, 66);
  sh.setColumnWidth(10, 95);
  sh.setColumnWidth(11, 110);
  sh.setColumnWidth(12, 230);
  sh.setColumnWidths(13, 5, 24);
  sh.setColumnWidth(18, 150);
  sh.setColumnWidths(19, 3, 66);
  sh.setColumnWidth(22, 230);
}

/* silent wrapper: used by writeSite_ / setup / menu - a Summary problem
   must never break a save, but the error still lands in the log */
function refreshSummary_() {
  try { buildSummaryCore_(); }
  catch (err) { try { Logger.log('refreshSummary_: ' + err); } catch (e2) {} }
}

function readMetaAll_() {
  var out = {};
  try {
    var m = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(META);
    if (m && m.getLastRow() > 1) {
      var rows = m.getRange(2, 1, m.getLastRow() - 1, 3).getValues();
      for (var i = 0; i < rows.length; i++) {
        if (rows[i][0]) out[String(rows[i][0])] = {
          ts: rows[i][1] ? new Date(rows[i][1]).toISOString() : '',
          by: String(rows[i][2] || '')
        };
      }
    }
  } catch (e) {}
  return out;
}

function setPerm_(site, perm) {
  /* v5.5: META column 4 - "view" = site login is read-only, empty = can edit */
  /* v5.24: META column 5 - "requested" = the site login asked for edit permission */
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(META);
  if (!sh) { sh = ss.insertSheet(META); sh.getRange(1, 1, 1, 5).setValues([['Site', 'LastUpdated', 'UpdatedBy', 'Perm', 'EditRequest']]); }
  if (String(sh.getRange(1, 4).getValue()) !== 'Perm') sh.getRange(1, 4).setValue('Perm');
  if (String(sh.getRange(1, 5).getValue()) !== 'EditRequest') sh.getRange(1, 5).setValue('EditRequest');
  var val = (String(perm) === 'view') ? 'view' : '';
  var last = sh.getLastRow();
  var rows = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues() : [];
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i][0]) === site) {
      sh.getRange(i + 2, 4).setValue(val);
      sh.getRange(i + 2, 5).setValue('');   /* v5.24: an admin decision settles the edit request */
      return;
    }
  }
  sh.appendRow([site, '', '', val, '']);
}

/* ---------- v5.24: EDIT REQUESTS - a site login asks, the admin decides ----------
 * META column 5 "EditRequest": 'requested' = waiting for the admin.
 * The request rides to every device inside getAll_(); the admin app shows a
 * popup at the next admin login: "Allow edit" / "Keep view-only". */
function requestEdit_(site) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(META);
  if (!sh) { sh = ss.insertSheet(META); sh.getRange(1, 1, 1, 5).setValues([['Site', 'LastUpdated', 'UpdatedBy', 'Perm', 'EditRequest']]); }
  if (String(sh.getRange(1, 5).getValue()) !== 'EditRequest') sh.getRange(1, 5).setValue('EditRequest');
  var last = sh.getLastRow();
  var rows = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues() : [];
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i][0]) === site) { sh.getRange(i + 2, 5).setValue('requested'); return; }
  }
  sh.appendRow([site, '', '', 'view', 'requested']);
}
function clearReq_(site) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(META);
  if (!sh) return;
  var last = sh.getLastRow();
  var rows = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues() : [];
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i][0]) === site) { sh.getRange(i + 2, 5).setValue(''); return; }
  }
}

/* ---------- v5.5: LIVE PHONE VIEW (the app's QR opens this) ----------
 * Google serves a small READ-ONLY page for one site, built from the sheet.
 * Token = the SAME deterministic hash the app uses:
 *   'tk' + hsh('share|SITE|hvac2026').slice(1,9)   (djb2, hex)
 * so the QR printed last year still opens, and no hosting is needed. */
function hshGAS_(s) {
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = (((h << 5) + h) + s.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(16);
}
function genToken_(s) { return 'tk' + hshGAS_('share|' + s + '|hvac2026').slice(1, 9); }
function escH_(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtN_(v) {
  if (v === null || v === undefined || v === '' || isNaN(Number(v))) return '';
  return Number(v).toLocaleString('en-IN', { maximumFractionDigits: 2 });
}
function viewStyle_() {
  return '<meta name="viewport" content="width=device-width,initial-scale=1"><style>' +
    'body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f8fafc;color:#0f172a}' +
    '.band{background:#1d4ed8;color:#fff;padding:14px 16px;font-weight:bold;font-size:18px}' +
    '.band small{display:block;font-weight:normal;opacity:.85;font-size:11px;margin-top:3px}' +
    '.wrap{padding:12px;overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}' +
    'th,td{border:1px solid #c9d6ea;padding:6px 8px;text-align:right;white-space:nowrap}' +
    'th{background:#dbeafe;color:#1e3a8a}td:first-child,th:first-child{text-align:left;background:#eff6ff;font-weight:bold;color:#1e3a8a}' +
    'td.tot{background:#eff6ff;font-weight:bold}.yrs{padding:10px 14px 0;font-size:14px}' +
    '.yrs a{color:#1d4ed8;margin-right:10px;text-decoration:none;font-weight:bold}' +
    '.yrs a.on{color:#0f172a;text-decoration:underline}' +
    '.mut{color:#64748b;font-size:12px;padding:8px 14px;line-height:1.5}' +
    '.ysec{scroll-margin-top:8px}.yhead{padding:12px 14px 4px;font-weight:bold;color:#1e3a8a;font-size:16px}' +
    '.editrow{padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}' +
    '.editbtn{background:#1d4ed8;color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:bold}' +
    '.ehint{color:#64748b;font-size:12px;max-width:420px}' +
    '.chipvo{background:#fef3c7;color:#92400e;padding:8px 14px;border-radius:8px;font-weight:bold;font-size:13px}' +
    '.chipok{background:#dcfce7;color:#166534;padding:8px 14px;border-radius:8px;font-weight:bold;font-size:13px}' +
    '.bad{padding:40px 20px;text-align:center;color:#b91c1c;font-weight:bold;font-size:16px}</style>';
}
function viewPage_(name, tok, ySel, appBase) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (tok !== genToken_(name)) {
    return HtmlService.createHtmlOutput('<html><head>' + viewStyle_() + '</head><body>' +
      '<div class="bad">&#128274; Link not valid<br><span style="font-size:13px;color:#64748b;font-weight:normal">Ask the admin for the newest QR / link.</span></div></body></html>')
      .setTitle('HVAC - link not valid');
  }
  var sh = ss.getSheetByName(name);
  var d = sh ? parseTab_(sh) : null;
  if (!d) {
    return HtmlService.createHtmlOutput('<html><head>' + viewStyle_() + '</head><body>' +
      '<div class="band">&#10052; ' + escH_(name) + '<small>HVAC consumption - live view</small></div>' +
      '<div class="bad" style="color:#64748b">No data yet for this site.</div></body></html>')
      .setTitle('HVAC - ' + name);
  }
  /* v5.21: the admin's EDIT / VIEW decision for THIS site (META col 4) decides
     whether the page shows the Edit button or the view-only chip */
  var canEdit = true;
  try {
    var msh = ss.getSheetByName(META);
    if (msh && msh.getLastRow() > 1) {
      var mrows = msh.getRange(2, 1, msh.getLastRow() - 1, 4).getValues();
      for (var mi = 0; mi < mrows.length; mi++) {
        if (String(mrows[mi][0]) === name) { canEdit = String(mrows[mi][3]) !== 'view'; break; }
      }
    }
  } catch (eP) {}
  /* v5.21: app base for the Edit link - the QR link carries &a=<app url>;
     fallback = this web app's own URL (it serves the whole app too) */
  var self = '';
  try { self = ScriptApp.getService().getUrl(); } catch (eU) { self = ''; }
  var appBase = (appBase && /^https?:/i.test(appBase)) ? appBase : self;
  /* v5.21: ALL years on ONE page, newest first - previous years are always
     visible (the old year links reloaded the whole page and often did not open) */
  var ys = Object.keys(d).map(Number).sort(function (a, b) { return a - b; }).reverse();
  var mMeta = getMeta_(name);
  var when = '';
  try { when = mMeta.ts ? Utilities.formatDate(new Date(mMeta.ts), Session.getScriptTimeZone(), 'dd MMM yyyy, HH:mm') : ''; } catch (eF) { when = mMeta.ts || ''; }
  var chips = ys.map(function (yy2) { return '<a href="#y' + yy2 + '">' + yy2 + '</a>'; }).join('');
  var sections = ys.map(function (yy2) {
    var yy = d[yy2] || {};
    var rowsHtml = '';
    METRIC_ORDER.forEach(function (mk) {
      var arr = yy[mk] || [];
      var tot = 0, had = false;
      for (var i = 0; i < 12; i++) { var v = Number(arr[i]); if (arr[i] != null && !isNaN(v)) { tot += v; had = true; } }
      rowsHtml += '<tr><td>' + escH_(METRIC_LABELS[mk]) + (mk === 'billed' ? ' (\u20B9)' : '') + '</td>';
      for (var m = 0; m < 12; m++) rowsHtml += '<td>' + escH_(fmtN_(arr[m])) + '</td>';
      rowsHtml += '<td class="tot">' + (had ? escH_(fmtN_(tot)) : '-') + '</td></tr>';
    });
    return '<div class="ysec" id="y' + yy2 + '"><div class="yhead">' + yy2 + '</div>' +
      '<div class="wrap"><table><tr><th>Metric</th>' + MONTHS.map(function (mo) { return '<th>' + mo + '</th>'; }).join('') + '<th>Total</th></tr>' +
      rowsHtml + '</table></div></div>';
  }).join('');
  /* v5.21: CLEAR edit / view row - the admin decides, the site login stays separate */
  var editRow;
  if (canEdit && appBase) {
    editRow = '<div class="editrow"><a class="editbtn" href="' + appBase + '#/site/' + encodeURIComponent(name) + '">&#9998; Edit this site</a>' +
      '<span class="ehint">opens the app &ndash; login with the site ID + password &ndash; sees only THIS site, can type only if the admin allowed edit</span></div>';
  } else if (canEdit) {
    editRow = '<div class="editrow"><span class="chipok">&#9998; Edit allowed &ndash; open the APP link and login with the site ID + password to type numbers</span></div>';
  } else {
    editRow = '<div class="editrow"><span class="chipvo">&#128065; View-only &ndash; editing is OFF for this site (set by admin)</span></div>';
  }
  var html = '<html><head>' + viewStyle_() + '</head><body>' +
    '<div class="band">&#10052; ' + escH_(name) + '<small>HVAC consumption - live from Google Sheets</small></div>' +
    (ys.length > 1 ? '<div class="yrs">Jump to year: ' + chips + '</div>' : '') +
    editRow + sections +
    '<div class="mut">Last update: ' + escH_(when || '-') + (mMeta.by ? ' \u2022 ' + escH_(mMeta.by) : '') +
    ' \u2022 EB+DG and kW/TR are calculated automatically.</div></body></html>';
  return HtmlService.createHtmlOutput(html).setTitle('HVAC - ' + name);
}

function setMeta_(site, d, by) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(META);
  if (!sh) { sh = ss.insertSheet(META); sh.getRange(1, 1, 1, 4).setValues([['Site', 'LastUpdated', 'UpdatedBy', 'Perm']]); }
  var last = sh.getLastRow();
  var rows = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues() : [];
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i][0]) === site) { sh.getRange(i + 2, 2, 1, 2).setValues([[d, by]]); return; }
  }
  sh.appendRow([site, d, by]);
}

function getMeta_(site) {
  var all = readMetaAll_();
  return all[site] || {ts: '', by: ''};
}

/* ---------- v5.9: USERS TAB - passwords in the SHEET, two-way ----------
 * One row per login:  Username | Site | Password | Updated
 * - The app pushes after every password change (saveUser / saveUsers).
 * - readUsers_() is part of getAll_(), so every pull adopts sheet changes.
 * - Tab is created automatically; a missing/empty tab is never an error. */
var USERS_TAB = 'Users';
function ensureUsers_(ss) {
  var sh = ss.getSheetByName(USERS_TAB);
  if (!sh) sh = ss.insertSheet(USERS_TAB);
  if (String(sh.getRange(1, 1).getValue()) !== 'Username') {
    sh.getRange(1, 1, 1, 4).setValues([['Username', 'Site', 'Password', 'Updated']]);
    try {
      sh.getRange(1, 1, 1, 4).setBackground(C.deep).setFontColor('#ffffff')
        .setFontWeight('bold').setFontSize(10).setVerticalAlignment('middle');
      sh.setFrozenRows(1);
      sh.setColumnWidth(1, 140);
      sh.setColumnWidth(2, 160);
      sh.setColumnWidth(3, 140);
      sh.setColumnWidth(4, 160);
      sh.getRange(2, 1, sh.getMaxRows() - 1, 4).setFontSize(10);
    } catch (eD) {}
  }
  return sh;
}
function readUsers_() {
  var out = {};
  try {
    var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(USERS_TAB);
    if (sh && sh.getLastRow() > 1) {
      var rows = sh.getRange(2, 1, sh.getLastRow() - 1, 3).getValues();
      for (var i = 0; i < rows.length; i++) {
        var un = String(rows[i][0] || '').trim();
        if (un) out[un] = {site: String(rows[i][1] || ''), pass: String(rows[i][2] || '')};
      }
    }
  } catch (eR) {}
  return out;
}
function saveUser_(un, pass, site, by) {
  un = String(un || '').trim();
  if (!un) return;
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ensureUsers_(ss);
  var last = sh.getLastRow();
  var rows = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues() : [];
  var when = new Date();
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i][0]).trim() === un) {
      sh.getRange(i + 2, 2, 1, 3).setValues([[String(site || ''), String(pass == null ? '' : pass), when]]);
      return;
    }
  }
  sh.appendRow([un, String(site || ''), String(pass == null ? '' : pass), when]);
  /* NOTE: META is deliberately NOT stamped here - a password change must never
     make a site tab look "newer" than the data (that would re-pull old data). */
}

function jsonp_(e, obj) {
  var cb = (e && e.parameter && e.parameter.callback) || 'cb';
  return ContentService.createTextOutput(cb + '(' + JSON.stringify(obj) + ')')
    .setMimeType(ContentService.MimeType.JAVASCRIPT);
}
</script>

function initials(s){ const p=String(s).split(/[\s\-–_]+/).filter(Boolean); return (p.length?p.map(w=>w[0]).join(''):String(s)).slice(0,3).toUpperCase()||'?'; }
function persistData(){ saveLS(LS.data, DATA); saveLS(LS.meta, META); }
function persistUsers(){ saveLS(LS.users, USERS); }

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function hsh(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'h'+h.toString(16); }
function num(v){ const n=parseFloat(v); return isNaN(n)?null:n; }
function fmt(n, dec){ if(n==null||n==='') return '–'; if(!isFinite(n)) return '–'; const d=(dec==null?2:dec); return Number(n).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0}); }
function fmtTS(ts){ if(!ts) return '–'; const d=new Date(ts); if(isNaN(d)) return '–'; return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function isoNow(){ return new Date(Math.floor(Date.now()/1000)*1000).toISOString(); }
function curYear(){ return new Date().getFullYear(); }
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function derive(yd){
  if(!yd) return;
  /* recompute EB+DG / kW/TR but PRESERVE stored values when the base metric
     is absent (some Excel months record only EB+DG, or kW/TR without BTU) */
  const oldE=(yd.ebdg||[]).slice(), oldK=(yd.kwtr||[]).slice();
  yd.ebdg=[]; yd.kwtr=[];
  for(let i=0;i<12;i++){
    const eb=yd.eb?yd.eb[i]:null, dg=yd.dg?yd.dg[i]:null;
    yd.ebdg.push((eb!=null||dg!=null)?(Number(eb||0)+Number(dg||0)):(oldE[i]!=null?oldE[i]:null));
  }
  for(let i=0;i<12;i++){
    const b=yd.btu?yd.btu[i]:null, e=yd.ebdg[i];
    if(b&&e!=null) yd.kwtr.push(Math.round(e/b*100)/100);
    else yd.kwtr.push(oldK[i]!=null?oldK[i]:null);
  }
}
function yearTotals(yd){
  if(!yd) return null;
  const t={btu:0,billed:0,eb:0,dg:0,ebdg:0}; let any=false;
  METRICS.filter(m=>!m.derived).forEach(m=>{ (yd[m.k]||[]).forEach(v=>{ if(v!=null){ t[m.k]+=v; any=true; } }); });
  (yd.ebdg||[]).forEach(v=>{ if(v!=null) t.ebdg+=v; });
  t.kwtr = t.btu>0 ? t.ebdg/t.btu : null;
  return any||t.ebdg>0 ? t : null;
}
function monthsFilled(yd){ if(!yd) return 0; let c=0; const used=Object.keys(yd); for(let i=0;i<12;i++){ for(const k of used){ const a=yd[k]; if(a&&a[i]!=null&&a[i]!==''){ c++; break; } } } return c; }
function siteYears(s){ return Object.keys(DATA[s]||{}).map(Number).filter(y=>y>0).sort((a,b)=>a-b); }
function ensureYear(s,y){ if(!DATA[s][y]){ DATA[s][y]=emptyYear(); } derive(DATA[s][y]); }
function lastUpdateOf(s){ return (META[s]&&META[s].ts)?META[s]:null; }
function globalLastUpdate(){ let best=null; for(const s of allSiteNames()){ const m=lastUpdateOf(s); if(m&&(!best||m.ts>best.ts)) best={ts:m.ts,by:m.by,site:s}; } return best; }
function fmtL(n){ if(!n||!isFinite(n)) return '0.00 L'; return (Math.round(n/1e5*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' L'; }
function groupOf(s){ return /^ptp/i.test(s) ? 'PTP' : String(s).split(/[\s\-–]/)[0]; }
const GROUP_COLORS=['#2563eb','#f59e0b','#16a34a','#7c3aed','#0d9488','#e11d48','#0ea5e9','#d97706','#65a30d','#4f46e5','#0891b2','#be185d'];
function groupColor(g){ let h=0; for(let i=0;i<String(g).length;i++) h=(h*31+String(g).charCodeAt(i))>>>0; return GROUP_COLORS[h%GROUP_COLORS.length]; }
/* aggregate all sites of one name family for a year (Groups view) */
function groupsList(y, metric){
  const gs={};
  allSiteNames().forEach(s=>{
    const g=groupOf(s), t=yearTotals(DATA[s]&&DATA[s][y]);
    if(!gs[g]) gs[g]={g:g, sites:[], btu:0, ebdg:0, billed:0, eb:0, dg:0, lu:''};
    const r=gs[g]; r.sites.push(s);
    if(t){ r.btu+=t.btu; r.ebdg+=t.ebdg; r.billed+=t.billed; r.eb+=t.eb; r.dg+=t.dg; }
    const lu=META[s]&&META[s].ts; if(lu&&lu>r.lu) r.lu=lu;
  });
  return Object.keys(gs).map(k=>{ const r=gs[k]; r.kwtr=r.btu>0?r.ebdg/r.btu:null; r.v=metric?r[metric]:r.btu; return r; });
}
/* month-by-month totals for one name family (group modal charts) */
function groupMonthAgg(g, y){
  const keys=['btu','eb','dg','ebdg','billed'];
  const sums={}, any={}; keys.forEach(k=>sums[k]=Array(12).fill(0));
  allSiteNames().filter(s=>groupOf(s)===g).forEach(s=>{
    const yd=DATA[s]&&DATA[s][y]; if(!yd) return;
    keys.forEach(k=>{ (yd[k]||[]).forEach((v,i)=>{ if(v!=null){ sums[k][i]+=v; any[k]=1; } }); });
  });
  const out={}; keys.forEach(k=>out[k]=any[k]?sums[k].map(v=>v>0?v:null):Array(12).fill(null));
  return out;
}
function gcardHTML(r,i,y,m,maxV,tot){
  const isL=m==='billed';
  const c=groupColor(r.g);
  const unit=isL?'':(m==='btu'?' TR':(m==='kwtr'?'':' kWh'));
  const f=v=>isL?('₹ '+fmtL(v)):(fmt(v,v>=1000?0:2)+unit);
  const share=tot>0?(Math.round(r.v/tot*1000)/10):0;
  return '<div class="gcard" style="border-top-color:'+c+'" onclick="groupModal(\''+esc(r.g)+'\','+y+')">'+
    '<div class="gc-top"><span class="gc-rank" style="background:'+c+'">'+(i+1)+'</span>'+
    '<span class="gc-name">'+esc(r.g)+'</span>'+
    '<span class="gc-n">'+r.sites.length+' site'+(r.sites.length!==1?'s':'')+'</span></div>'+
    '<div class="gc-val">'+f(r.v)+'</div>'+
    '<div class="gc-bar"><span style="width:'+(r.v>0?Math.max(4,r.v/maxV*100):0)+'%;background:'+c+'"></span></div>'+
    '<div class="gc-metrics">'+
      '<span><b>'+fmt(r.btu,0)+'</b>BTU TR</span>'+
      '<span><b>'+shortNum(r.ebdg)+'</b>EB+DG kWh</span>'+
      '<span><b>₹ '+fmtL(r.billed)+'</b>Billed</span>'+
      '<span><b>'+(r.kwtr!=null?r.kwtr.toFixed(2):'–')+'</b>kW/TR</span>'+
    '</div>'+
    '<div class="gc-lu">share '+share+'% • last update '+(r.lu?fmtTS(r.lu):'–')+' • tap for readings ▸</div>'+
  '</div>'; 
}
function vdonut(items, centerTop, centerSub, y){
  const total=items.reduce((a,r)=>a+r.value,0);
  if(!total||!items.length) return '<div class="topempty">No data yet for this year.</div>';
  const R=62,CX=90,CY=90,SW=28,C=2*Math.PI*R;
  let off=0,g='';
  items.forEach(r=>{
    const len=r.value/total*C, seg=Math.max(len-2,0.6);
    g+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+r.color+'" stroke-width="'+SW+'" stroke-dasharray="'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+CX+' '+CY+')"><title>'+esc(r.name)+': '+esc(r.label)+' ('+(Math.round(r.value/total*1000)/10)+'%)</title></circle>';
    off+=len;
  });
  g+='<text x="'+CX+'" y="'+(CY)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">'+centerTop+'</text>';
  g+='<text x="'+CX+'" y="'+(CY+17)+'" text-anchor="middle" font-size="10" fill="#64748b">'+centerSub+'</text>';
  return '<div class="donutwrap"><svg viewBox="0 0 180 180" style="width:180px;max-width:45%;flex:none" role="img">'+g+'</svg><div class="dleg">'+
    items.map(r=>'<a href="javascript:void(0)"'+(r.g?' onclick="groupModal(\''+esc(r.g)+'\','+y+')"':'')+'><span class="sw" style="background:'+r.color+'"></span><span class="dn">'+esc(r.name)+'</span><span class="dv">'+esc(r.label)+' • '+(Math.round(r.value/total*1000)/10)+'%</span></a>').join('')+
    '</div></div>'; 
}

/* ---------- aggregation across sites (dashboard cards & graphs) ---------- */
function monthAgg(y, m){
  const agg={btu:0,billed:0,eb:0,dg:0,ebdg:0};
  allSiteNames().forEach(s=>{
    const yd=DATA[s]&&DATA[s][y]; if(!yd) return;
    METRICS.forEach(x=>{ const v=yd[x.k]?yd[x.k][m]:null; if(v!=null) agg[x.k]+=Number(v)||0; });
  });
  return agg;
}
function sitesWithData(y, m){
  return allSiteNames().filter(s=>{
    const yd=DATA[s]&&DATA[s][y]; if(!yd) return false;
    return METRICS.some(x=>yd[x.k]&&yd[x.k][m]!=null);
  });
}
function latestMonthWithData(y){
  const start=(y===curYear())?new Date().getMonth():11;
  for(let m=start;m>=0;m--){ if(sitesWithData(y,m).length) return m; }
  return -1;
}

/* ---------- CSV / export ---------- */
function csvCell(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function siteCSV(sites){
  const head=['Site','Metric','Year'].concat(MONTHS);
  const rows=[head];
  sites.forEach(s=>{
    siteYears(s).forEach(y=>{
      const yd=DATA[s][y];
      METRICS.forEach(m=>{ rows.push([s, m.label, y].concat((yd[m.k]||[]).map(v=>v==null?'':v))); });
    });
  });
  return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
function download(name, text){
  const b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
/* v5.13: backup file save / load - works even when browser storage is blocked */
function backupDownload(){
  try{
    download('HVAC-backup-'+new Date().toISOString().slice(0,10)+'.json',
      JSON.stringify({v:APP_VERSION, data:DATA, users:USERS, meta:META, set:SET}));
    toast('\u2705 Backup file saved \u2013 keep it safe (Downloads folder).');
  }catch(e){ toast('Backup failed: '+String((e&&e.message)||e)); }
}
function backupLoad(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const j=JSON.parse(r.result);
        if(!j.data||typeof j.data!=='object') throw new Error('not a HVAC backup file');
        DATA=(()=>{ const o={}; for(const k in j.data) o[k]=normalizeSite(j.data[k]); return o; })();
        USERS=j.users||USERS; META=j.meta||META; SET=Object.assign({gasUrl:'',tokens:{},lastPull:null,sheetUrl:'',perms:{},hostBase:''}, j.set||{});
        if(!SET.perms) SET.perms={};
        if(!SET.reqs) SET.reqs={}; if(!SET.pendingReqs) SET.pendingReqs={}; if(!SET.reqsSeen) SET.reqsSeen={};   /* v5.24 */
        if(!SET.pendingPush) SET.pendingPush={};   /* v5.26 */
        persistData(); persistUsers(); saveLS(LS.set, SET);
        render(); toast('\u2705 Backup loaded \u2013 all sites and users are back.');
      }catch(e){ toast('\u26a0 Could not load backup: '+String((e&&e.message)||e)); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- SVG charts (self-contained, no external library) ---------- */
function shortNum(v){
  if(v==null||!isFinite(v)) return '–';
  const a=Math.abs(v);
  if(a>=1e7) return (Math.round(v/1e7*100)/100)+'Cr';
  if(a>=1e5) return (Math.round(v/1e5*100)/100)+'L';
  if(a>=1e3) return (Math.round(v/1e3*10)/10)+'k';
  return String(Math.round(v*100)/100);
}
function chartCard(title, sub, legend, inner){
  return '<div class="card chartcard"><h3>'+title+'</h3><div class="csub">'+sub+'</div>'+
    (legend?'<div class="leg">'+legend+'</div>':'')+inner+'</div>';
}
function vbars(values, labels, color, unit){
  const W=620,H=200,P={l:52,r:10,t:12,b:24};
  const has=values.some(v=>v!=null);
  if(!has) return '<div class="topempty">No data yet for this year.</div>';
  const max=Math.max.apply(null,values.map(v=>v||0).concat([1e-9]));
  const n=values.length, bw=(W-P.l-P.r)/n, ph=H-P.t-P.b;
  let g='';
  for(let i=0;i<=4;i++){
    const y=P.t+ph*i/4, val=max*(1-i/4);
    g+='<line x1="'+P.l+'" y1="'+y+'" x2="'+(W-P.r)+'" y2="'+y+'" stroke="#e2e8f0" stroke-width="1"/>';
    g+='<text x="'+(P.l-6)+'" y="'+(y+4)+'" font-size="10" fill="#64748b" text-anchor="end">'+shortNum(val)+'</text>';
  }
  values.forEach((v,i)=>{
    const h=v?ph*v/max:0, x=P.l+i*bw+bw*0.18, w=bw*0.64, y=H-P.b-Math.max(h,0);
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,0.5).toFixed(1)+'" rx="3" fill="'+(v?color:'#e2e8f0')+'">'+
       '<title>'+labels[i]+': '+(v==null?'–':fmt(v)+' '+unit)+'</title></rect>';
    g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="#64748b" text-anchor="middle">'+labels[i]+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
function vlines(seriesArr, labels){
  const W=620,H=200,P={l:52,r:12,t:12,b:24};
  const has=seriesArr.some(sr=>sr.values.some(v=>v!=null));
  if(!has) return '<div class="topempty">No data yet for this year.</div>';
  let mx=1e-9;
  seriesArr.forEach(sr=>sr.values.forEach(v=>{ if(v!=null&&v>mx) mx=v; }));
  const ph=H-P.t-P.b, n=labels.length, step=(W-P.l-P.r)/(n-1||1);
  let g='';
  for(let i=0;i<=4;i++){
    const y=P.t+ph*i/4;
    g+='<line x1="'+P.l+'" y1="'+y+'" x2="'+(W-P.r)+'" y2="'+y+'" stroke="#e2e8f0" stroke-width="1"/>';
    g+='<text x="'+(P.l-6)+'" y="'+(y+4)+'" font-size="10" fill="#64748b" text-anchor="end">'+shortNum(mx*(1-i/4))+'</text>';
  }
  labels.forEach((lb,i)=>{
    const x=P.l+i*step;
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="#64748b" text-anchor="middle">'+lb+'</text>';
  });
  seriesArr.forEach(sr=>{
    let d='', open=false;
    sr.values.forEach((v,i)=>{
      if(v==null){ open=false; return; }
      const x=P.l+i*step, y=P.t+ph*(1-v/mx);
      d+=(open?' L':' M')+x.toFixed(1)+' '+y.toFixed(1); open=true;
    });
    if(d) g+='<path d="'+d+'" fill="none" stroke="'+sr.color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    sr.values.forEach((v,i)=>{
      if(v==null) return;
      const x=P.l+i*step, y=P.t+ph*(1-v/mx);
      g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="'+sr.color+'"><title>'+labels[i]+' • '+sr.name+': '+fmt(v)+'</title></circle>';
    });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
function chartsHTML(s, y){
  const yd=DATA[s]&&DATA[s][y]; if(!yd) return '';
  const C1='#2563eb', C2='#f59e0b', C3='#16a34a';
  const btuCard=chartCard('📊 Monthly BTU Cons. in TR – '+y, esc(s)+' • cooling load month by month','',
    vbars(yd.btu, MONTHS, C1, 'TR'));
  const ebdgCard=chartCard('⚡ EB vs DG (kWh) – '+y, 'grid (EB) vs generator (DG) units','<span><i style="background:'+C1+'"></i>EB (kWh)</span><span><i style="background:'+C2+'"></i>DG (kWh)</span>',
    vlines([{name:'EB',color:C1,values:yd.eb},{name:'DG',color:C2,values:yd.dg}], MONTHS));
  const kwCard=chartCard('📈 kW/TR – '+y, 'plant efficiency (lower is better)','<span><i style="background:'+C3+'"></i>kW/TR</span>',
    vlines([{name:'kW/TR',color:C3,values:yd.kwtr}], MONTHS));
  const years=siteYears(s);
  let yrCard='';
  if(years.length>1){
    const yvals=years.map(yy=>{ const t=yearTotals(DATA[s][yy]); return t?t.btu:0; });
    yrCard=chartCard('🗓 Year-wise BTU TR total', 'all years on record: '+years.join(', '),'',
      vbars(yvals, years.map(String), '#7c3aed', 'TR'));
  }
  const billedCard=chartCard('💰 Billed Amount (₹) – '+y, 'monthly HVAC billing','',
    vbars(yd.billed, MONTHS, '#0d9488', '₹'));
  return '<div class="chartgrid">'+btuCard+ebdgCard+kwCard+billedCard+yrCard+'</div>';
}

/* ---------- auth ---------- */
/* v5.19: the login is kept on the device TWO ways - localStorage (normal) AND
   a cookie fallback (survives on the https web link even when "site data" is
   blocked). Plus one-click links (#/key/USER/TOKEN) below that log in with NO
   storage at all - the real fix for "password asked every time". */
function sesCookieWrite(){ try{ document.cookie='hvac_ses='+encodeURIComponent(JSON.stringify(SES))+';max-age='+(60*60*24*90)+';path=/'; }catch(e){} }
function sesCookieClear(){ try{ document.cookie='hvac_ses=;max-age=0;path=/'; }catch(e){} }
function sesCookieRead(){ try{ const m=document.cookie.match(/(?:^|;\s*)hvac_ses=([^;]+)/); return m?JSON.parse(decodeURIComponent(m[1])):null; }catch(e){ return null; } }
function login(u,p){
  const rec=USERS[u];
  if(!rec||rec.pass!==hsh(p)) return null;
  SES={name:u, role:rec.role, site:rec.site||null, at:isoNow()};
  saveLS(LS.ses, SES);
  sesCookieWrite();
  return SES;
}

/* ---------- Google Sheets sync (JSONP + no-cors POST) ---------- */
let SYNC={busy:false};
function gasUrlNow(){ return VIEW_URL||SET.gasUrl||''; }
function jsonp(params, cb){
  const cbn='cb'+Date.now()+Math.floor(Math.random()*1e4);
  const s=document.createElement('script');
  const base=gasUrlNow();
  const url=base+(base.indexOf('?')>-1?'&':'?')+'callback='+cbn+'&'+params;
  let done=false;
  const to=setTimeout(()=>{ if(!done){ done=true; cb(null,new Error('timeout')); cleanup(); } },20000);
  function cleanup(){ clearTimeout(to); try{delete window[cbn];}catch(e){} s.remove(); }
  window[cbn]=function(data){ if(!done){ done=true; cb(data,null); cleanup(); } };
  s.onerror=()=>{ if(!done){ done=true; cb(null,new Error('network')); cleanup(); } };
  s.src=url; document.body.appendChild(s);
}
function pushSite(s){
  const gu=gasUrlNow();                      /* v5.20: a shared EDIT link (VIEW_URL) can push too */
  if(!gu){ rememberPendingPush(s); return; }   /* v5.26: not linked yet - queue it, pushed automatically after connecting */
  const m=META[s]||{ts:isoNow(),by:'app'};
  const body={action:'save', site:s, data:DATA[s], ts:m.ts, by:m.by||'app'};
  try{
    fetch(gu,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})
      .then(()=>{ setTimeout(pull, 4000); })
      .catch(()=>{ syncStatus(); });
  }catch(e){ syncStatus(); }
}
function pull(silent, cb){
  if(!gasUrlNow()||SYNC.busy){ syncStatus(); if(cb)cb(false); return; }
  SYNC.busy=true; syncStatus('syncing');
  jsonp('action=get', function(data,err){
    SYNC.busy=false;
    if(err||!data||!data.sites){ if(!silent) toast('Sync failed – check Web App URL / internet'); syncStatus('error'); if(cb)cb(false); return; }
    let pulled=[], pushed=[], added=[];
    for(const s in data.sites){
      const sv=data.meta&&data.meta[s]?data.meta[s].ts:'';
      const lv=META[s]&&META[s].ts?META[s].ts:'';
      const serverHas=Object.keys(data.sites[s]||{}).length>0;
      if(!lv||(sv&&sv>lv)||(serverHas&&!sv&&!Object.keys(DATA[s]||{}).length)){
        if(serverHas){
          DATA[s]=normalizeSite(data.sites[s]);
          META[s]={ts:sv||isoNow(), by:(data.meta&&data.meta[s]&&data.meta[s].by)||'Google Sheet'};
          pulled.push(s);
        }
        if(!USERS[userKey(s)]){ USERS[userKey(s)]={pass:hsh(userKey(s)+'123'), plain:userKey(s)+'123', role:'site', site:s}; added.push(s); }
      } else if(lv&&sv&&lv>sv){ pushSite(s); pushed.push(s); }
    }
    if(data.sheetUrl) SET.sheetUrl=data.sheetUrl;
    if(data.perms&&typeof data.perms==='object'){          /* v5.5: per-site edit/view permissions from the sheet */
      const pv=JSON.stringify(SET.perms||{});
      SET.perms=data.perms;
      /* v5.23: an OFFLINE admin decision wins over the old Sheet value until the auto-retry confirms it */
      if(SET.pendingPerms){ for(const ps in SET.pendingPerms){ if(SET.pendingPerms[ps]==='view') SET.perms[ps]='view'; else delete SET.perms[ps]; } }
      if(JSON.stringify(SET.perms)!==pv&&SES&&SES.role==='site'&&location.hash.indexOf('#/site/')===0){ route(); }
    }
    if(data.reqs&&typeof data.reqs==='object'){            /* v5.24: sites asking the admin for edit permission */
      SET.reqs=data.reqs;
      if(SET.pendingReqs){ for(const pr in SET.pendingReqs){ SET.reqs[pr]=true; } }   /* an OFFLINE request stays visible until the Sheet confirms */
      if(SES&&SES.role==='admin'&&Object.keys(SET.reqs).some(s2=>SET.reqs[s2]&&!(SET.reqsSeen&&SET.reqsSeen[s2]))){ setTimeout(editReqPopup, 300); }
    }
    if(data.users&&typeof data.users==='object'){        /* v5.9: two-way passwords - the sheet "Users" tab wins on pull */
      const pwChanged=[];
      for(const uk in data.users){
        const sp=String(data.users[uk].pass||''); if(!sp) continue;
        const cur=USERS[uk];
        if(!cur){ USERS[uk]={pass:hsh(sp), plain:sp, role:'site', site:data.users[uk].site||''}; pwChanged.push(uk); }
        else if(cur.plain!==sp){ cur.pass=hsh(sp); cur.plain=sp; pwChanged.push(uk); }
      }
      if(pwChanged.length){ persistUsers(); if(!silent) toast('🔑 Passwords updated from Google Sheet: '+pwChanged.join(', ')); }
    }
    SET.gasVer = data.version ? String(data.version) : 'old';   /* Apps Script code version; 'old' = pre-5.1 code */
    SET.lastPull=isoNow();
    persistData(); if(added.length) persistUsers(); saveLS(LS.set, SET);
    flushPendingPerms();                                  /* v5.23: retry permission sets that failed offline */
    flushPendingReqs();                                   /* v5.24: retry edit requests that failed offline */
    flushPendingPush();                                   /* v5.26: push the saves that waited for a connection */
    syncStatus(); if(cb)cb(true);
    if(pulled.length||added.length){ toast('Updated from Google Sheets: '+pulled.concat(added).join(', ')); route(); }
    else if(!silent&&pushed.length) toast('Local changes pushed to Google Sheets');
    else if(!silent) toast('Already up to date ✓');
  });
}
function pushAll(){
  if(!SET.gasUrl){ toast('Save the Web App URL first'); return; }
  const names=allSiteNames();
  names.forEach(s=>{ if(!META[s]||!META[s].ts) META[s]={ts:isoNow(),by:'first import'}; });
  persistData();
  /* Google Apps Script kills any run longer than ~30s, so pushing all 33 sites in ONE
     request times out (= only 1-2 tabs designed, no Summary). Small batches never hit it. */
  const B=4, total=Math.max(1,Math.ceil(names.length/B));
  let i=0;
  toast('Pushing '+names.length+' sites in '+total+' small batches…');
  function next(){
    if(i>=total){
      /* v5.4: after the last batch, ORDER the sheet to build the Summary tab via JSONP
         (readable reply!) - this no longer depends on the final POST succeeding blind. */
      toast('All '+total+' batches pushed ✓ – building Summary tab…');
      setTimeout(function(){
        buildSummaryNow(function(built){
          pull(false, function(okc){
            if(SET.gasVer && SET.gasVer!==APP_VERSION){ toast('⚠ Your sheet runs OLD code – opening the fix wizard'); fixModal(); }
            else if(built){ toast('✓ Verified: site data + Summary tab are NOW in your Google Sheet'); }
            else if(okc){ toast('Data pushed, but Summary failed – press the orange chip on top'); }
          });
        });
      },2500);
      return;
    }
    const batch={}; names.slice(i*B,(i+1)*B).forEach(s=>{ batch[s]=DATA[s]; });
    i++;
    syncStatus('syncing');
    try{
      fetch(SET.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'saveAll', sites:batch, ts:isoNow(), by:SES?SES.name:'admin', final:(i===total)})})
        .then(()=>{ toast('Pushed batch '+i+'/'+total+' ✓'); setTimeout(next,1200); })
        .catch(()=>{ toast('Push failed at batch '+i+' – check internet / URL'); syncStatus('error'); });
    }catch(e){ toast('Push failed – check internet / URL'); syncStatus('error'); }
  }
  next();
}

/* Token is deterministic (same on every device) so QR links work anywhere.
   If Google Sheets is linked, the share link also carries the Web App URL
   (?u=...) so ANY phone scanning the QR pulls the LIVE sheet data. */
function genToken(s){ return 'tk'+hsh('share|'+s+'|hvac2026').slice(1,9); }
let SHARE_SITE='';
function shareBase(){
  /* a QR scanned by a PHONE needs an internet address - a local file path never works */
  const cur=location.href.split('#')[0];
  if(/^https?:/i.test(cur)) return cur;
  return (SET.hostBase||'').replace(/\/+$/,'');
}
function shareLink(s,purpose){
  const base=shareBase();
  if(!base) return '';

  return base+'#/view/'+encodeURIComponent(s)+'?t='+tok+(purpose==='edit'?'&p=edit':'')+u;   /* v5.20: p=edit = link opens ready for typing */

  return SET.gasUrl + (SET.gasUrl.indexOf('?')>-1?'&':'?') + 'view=' + encodeURIComponent(s) + '&t=' + genToken(s) + (/^https?:/i.test(a)?('&a='+encodeURIComponent(a)):'');

/* ---------- modal / toast ---------- */
function openModal(html){
  closeModal();
  const w=document.createElement('div'); w.className='modalbg'; w.id='modalbg';
  w.innerHTML='<div class="modal"><button class="close" onclick="closeModal()">✕</button>'+html+'</div>';
  w.addEventListener('click',e=>{ if(e.target===w) closeModal(); });
  document.body.appendChild(w);
}
function closeModal(){ const m=$('#modalbg'); if(m) m.remove(); }
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('Copied ✓'),()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copied ✓'); }catch(e){ toast('Copy failed'); }
  ta.remove();
}

/* ---------- views ---------- */
function fixSticky(){
  const hd=document.querySelector('header');
  if(hd) document.documentElement.style.setProperty('--hh', hd.offsetHeight+'px');
  const g=document.querySelector('#tablebox thead tr.grp');
  if(g) document.documentElement.style.setProperty('--hh2', g.offsetHeight+'px');
  /* sticky page-level headers only work when the table needs no horizontal scroll;
     wide tables get their own capped scroll area with in-container sticky headers */
  const hh=(hd?hd.offsetHeight:48);
  document.querySelectorAll('main .tblwrap').forEach(w=>{
    const t=w.querySelector('table'); if(!t) return;
    w.classList.remove('fit','tall'); w.style.maxHeight='';
    if(t.scrollWidth<=w.clientWidth+2){ w.classList.add('fit'); return; }
    const maxH=Math.max(260, window.innerHeight-hh-60);
    if(t.offsetHeight>maxH){ w.classList.add('tall'); w.style.maxHeight=maxH+'px'; }
  });
}
function render(){
  try{ renderInner(); }
  catch(err){ renderError(err); }
  requestAnimationFrame(fixSticky);
}

  if(!confirm('Clean start?\n\nThis clears the data saved in THIS browser only. Your Google Sheet keeps everything.\nAfter the clean start: log in again → press ⟳ Sync now.')) return;

function renderInner(){
  closeModal();
  const app=$('#app');
  const h=location.hash||'#/home';
  /* v5.19: one-click login link (#/key/USER/TOKEN) - logs in with no password
     and no storage (works even when browser storage is blocked / private mode) */
  const km=h.match(/^#\/key\/([^/]+)\/(h[0-9a-f]+)$/);
  if(km){
    const ku=decodeURIComponent(km[1]);
    if(USERS[ku]&&quickKey(ku)===km[2]){
      SES={name:ku, role:USERS[ku].role, site:USERS[ku].site||null, at:isoNow()};
      saveLS(LS.ses, SES);
      sesCookieWrite();
      toast('\u2705 Logged in as '+ku+' - no password needed');
      location.hash = SES.role==='admin' ? '#/admin' : '#/site/'+encodeURIComponent(SES.site);
      render();
      if(SES.role==='admin') setTimeout(editReqPopup, 800);   /* v5.24: show edit requests at admin login */
      return;
    }
  }
  const vm=h.match(/^#\/view\/([^?]+)(?:\?(.*))?$/);
  if(vm){
    const q={}; (vm[2]||'').split('&').forEach(kv=>{ const i=kv.indexOf('='); if(i>0){ try{ q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); }catch(e){} } });
    return renderView(decodeURIComponent(vm[1]), q.t||'', q.u||'', q.p||'');   /* v5.20: p=edit */
  }
  if(!SES){ return renderLogin(); }
  const sm=h.match(/^#\/site\/(.+)$/);
  if(sm&&canSeeSite(decodeURIComponent(sm[1]))){ return renderSite(decodeURIComponent(sm[1])); }
  if(h==='#/summary'&&SES){ return renderSummary(); }   /* v5.5: the Summary sheet page */
  if(h==='#/analysis'&&isAdmin()){ return renderAnalysis(); }   /* v5.9: full analysis dashboard (graphs page) */

  if(isAdmin()){ return renderAdmin(); }
  return renderSite(SES.site||'');
}

    .sort((a,b)=>{ const ta=yearTotals(DATA[a.s]&&DATA[a.s][y]), tb=yearTotals(DATA[b.s]&&DATA[b.s][y]);
      return (tb?tb.btu:0)-(ta?ta.btu:0); }).slice(0,6);
  const siteC=chartCard('🏭 Top '+top6.length+' sites – BTU TR by month – '+y,
    'one line per site • the biggest consumers of '+y,
    '<span>'+top6.map((r,i)=>'<i style="background:'+PAL[i]+'"></i>'+esc(shortNm(r.s))+'</span>').join('')+'</span>',
    vlines(top6.map((r,i)=>({name:shortNm(r.s),color:PAL[i],values:(r.v||[]).map(x=>x>0?x:null)})),MONTHS));

function kwtrModal(){

/* v5.5/v5.8: admin sets one site between EDIT and VIEW-ONLY (saved to the Google Sheet).
   setPermTo(site,'edit'|'view') = explicit – used by the Site Control Center buttons.
   setPerm(site) = old one-click toggle – used on the dashboard site cards. */
function setPermTo(s,mode){
  if(!isAdmin()){ toast('Only the admin can change this'); return; }
  const wantView=(mode!=='edit');
  const wasView=siteViewOnly(s);
  if(wasView===wantView){ toast(wantView?(s+' is already VIEW-ONLY'):(s+': editing is already allowed')); return; }
  if(wantView) SET.perms[s]='view'; else delete SET.perms[s];
  saveLS(LS.set,SET); drawCards();
  toast(wantView ? s+': VIEW-ONLY set – this site login can look but not edit' : s+': editing ENABLED ✓');
  if(SES&&location.hash==='#/site/'+encodeURIComponent(s)) render();   /* v5.8: an open site page repaints with the new permission */
  if(SET.gasUrl){
    jsonp('action=setPerm&site='+encodeURIComponent(s)+'&perm='+(wantView?'view':'edit'), function(d,err){
      if(err||!d||!d.ok){ rememberPendingPerm(s,wantView?'view':'edit'); toast('⚠ Saved on this device - the Google Sheet gets it when the internet is back (auto-retry is ON)'); return; }
      if(SET.pendingPerms){ delete SET.pendingPerms[s]; saveLS(LS.set,SET); }   /* v5.23: confirmed - drop the retry */
      SET.gasVer=String(d.version||SET.gasVer||''); saveLS(LS.set,SET); syncStatus();
      toast('Permission saved to Google Sheet ✓ – every device gets it');
    });
  }
}
function setPerm(s){ setPermTo(s, siteViewOnly(s)?'edit':'view'); }
/* v5.23: an admin permission set while OFFLINE must never get lost and must
   never be overwritten by an old Sheet value. It is kept in SET.pendingPerms,
   re-applied after every pull, and re-sent to the Google Sheet automatically
   until the Sheet confirms it. */
function rememberPendingPerm(s,mode){
  if(!SET.pendingPerms) SET.pendingPerms={};
  SET.pendingPerms[s]=mode; saveLS(LS.set,SET);
}
function flushPendingPerms(){
  if(!SET.pendingPerms) return;
  Object.keys(SET.pendingPerms).forEach(site=>{
    const perm=SET.pendingPerms[site];
    jsonp('action=setPerm&site='+encodeURIComponent(site)+'&perm='+perm, function(d){
      if(d&&d.ok&&SET.pendingPerms){ delete SET.pendingPerms[site]; saveLS(LS.set,SET); }
    });
  });
}
function flushPendingReqs(){
  if(!SET.pendingReqs) return;
  Object.keys(SET.pendingReqs).forEach(site=>{
    jsonp('action=requestEdit&site='+encodeURIComponent(site), function(d){
      if(d&&d.ok&&SET.pendingReqs){ delete SET.pendingReqs[site]; saveLS(LS.set,SET); }
    });
  });
}

/* ---------- v5.5: 📋 SUMMARY PAGE — the Summary sheet INSIDE the app.
   Click "📋 Summary" in the top bar -> you see the Excel Summary
   ("Chiller plant room consumption"): SL.No | Site Name | Units | 2023 | 2024 |
   2025-2026 (Q1..Q4) | SAVINGS (Units kwh / AMOUNT) | Remark + the Kw/TR table.
   Same math as the Google-Sheet Summary tab: kW/TR = (EB+DG) ÷ BTU, TR-weighted;
   Q1=Apr-Jun, Q2=Jul-Sep, Q3=Oct-Dec, Q4=Jan-Mar of FY_START..FY_START+1.
   SAVINGS + Remark come from the Excel import (admin can read them; the same
   numbers are written to the sheet's Summary tab). Site logins see ONLY their
   own row — the admin sees all sites. ---------- */
const SUMMARY_ORDER=['PMS','PTS','PSN','Atrium','Summit','PTP-VALDEL','PTP-Platina','PTP-JMV','PTP-COSMOS','PTP-Gravity','UB Plaza','FTP','PTC','PTPP-B1','PTPP-B2','Oblisk','Technopolis','Alkareem','Dynasty','Emerald','Sterling Square','Blue Chip','Towers','Alpha','Cosmopolitan','Cyber Tower','Palladium','Metropolitan','Polygone','Cyber Green','TMS Square','Alphatech','Sky Tech'];
const FY_START=2025;   /* the "2025-2026" column = Apr 2025 - Mar 2026 */
function qKwW(s,y,m0,m1){   /* TR-weighted kW/TR for months m0..m1 of year y */
  const yd=DATA[s]&&(DATA[s][y]||DATA[s][String(y)]); if(!yd) return null;
  let b=0,x=0,had=false;
  for(let m=m0;m<=m1;m++){
    const bv=(yd.btu&&yd.btu[m]!=null)?Number(yd.btu[m]):null;
    const hasE=(yd.eb&&yd.eb[m]!=null)||(yd.dg&&yd.dg[m]!=null);
    const xv=hasE?((yd.eb&&yd.eb[m]!=null?Number(yd.eb[m]):0)+(yd.dg&&yd.dg[m]!=null?Number(yd.dg[m]):0))
                 :((yd.ebdg&&yd.ebdg[m]!=null)?Number(yd.ebdg[m]):null);
    if(bv!=null&&xv!=null){ b+=bv; x+=xv; had=true; }
  }
  return (had&&b>0)?Math.round(x/b*1000)/1000:null;
}
function summaryRows(){
  const own=(!isAdmin()&&SES&&SES.role==='site')?SES.site:null;
  let names=SUMMARY_ORDER.filter(n=>DATA[n]);
  allSiteNames().forEach(n=>{ if(names.indexOf(n)===-1) names.push(n); });
  if(own) names=names.filter(n=>n===own);
  return names.map((n,i)=>{
    const inf=SITE_INFO[n]||{};
    return {n:n, i:i+1,
      k23:qKwW(n,2023,0,11), k24:qKwW(n,2024,0,11), k25:qKwW(n,2025,0,11),
      q1:qKwW(n,FY_START,3,5),   q2:qKwW(n,FY_START,6,8),
      q3:qKwW(n,FY_START,9,11),  q4:qKwW(n,FY_START+1,0,2),
      kwh:(inf.savKwh!=null?inf.savKwh:''), inr:(inf.savInr!=null?inf.savInr:''), note:(inf.note||'')};
  });
}
function renderSummary(){
  const rows=summaryRows();
  const ck=v=>(v==null||v==='')?'–':fmt(v,3);
  const cn=v=>(v===''||v==null)?'–':fmt(v,0);
  const left=rows.map(r=>'<tr>'+
    '<td style="text-align:center">'+r.i+'</td>'+
    '<td class="ml"><a href="#/site/'+encodeURIComponent(r.n)+'">'+esc(r.n)+'</a></td>'+
    '<td style="text-align:center;color:#64748b;font-size:12px">Kw/TR</td>'+
    '<td style="text-align:right">'+ck(r.k23)+'</td><td style="text-align:right">'+ck(r.k24)+'</td>'+

function removeYear(){
  const s=UI.site;
  const ys=siteYears(s);
  if(!ys.length){ toast('No year to remove'); return; }
  const y=UI.year;
  if(ys.indexOf(y)===-1){ toast('Pick a year that has data first'); return; }
  if(!confirm('Remove year '+y+' from '+s+'?\nIts monthly numbers for this year will be deleted.')) return;
  delete DATA[s][y];
  const left=siteYears(s);
  UI.year=left.length?left[left.length-1]:curYear();
  ensureYear(s,UI.year);
  persistData(); commitSite(false);
  const sel=$('#ysel');
  if(sel){ const opt=sel.querySelector('option[value="'+y+'"]'); if(opt) opt.remove(); sel.value=UI.year; }

function editReqModal(s){

    (asked
      ?'<div class="oknote">📨 <b>Request already sent.</b> The admin sees it at the next admin login and can allow editing with one click.</div>'
