\u003c/div>'+\n      '<div id=\"dashcharts\">\u003c/div>'+\n    '\u003c/div>'+\n    '<div class=\"grid\" id=\"cards\">\u003c/div>'+\n  '\u003c/main>';\n  fillYearSel('ty'); fillYearSel('gy');\n  drawTop(); drawDashCharts(); drawCards(); syncStatus(); if(SET.gasUrl) pull(true);\n}\nfunction fillYearSel(id){\n  const el=$('#'+id); if(!el) return;\n  const ys=topYears();\n  el.innerHTML=ys.map(y=>'<option '+(y===curYear()?'selected':'')+'>'+y+'\u003c/option>').join('')||('<option>'+curYear()+'\u003c/option>');\n  if(ys.indexOf(curYear())===-1&&ys.length) el.value=String(ys[0]);\n}\nfunction topYears(){\n  const ys={};\n  allSiteNames().forEach(s=>siteYears(s).forEach(y=>ys[y]=1));\n  return Object.keys(ys).map(Number).sort((a,b)=>b-a);\n}\nfunction hrowLine(i,label,val,max,lu,href,fmtVal,oc){\n  const name='<span class=\"hr-name\">'+esc(label)+'\u003c/span>';\n  return '<div class=\"hrow\">'+(i!=null?'<span class=\"hr-rank\">'+(i+1)+'\u003c/span>':'')+\n    (href?'<a href=\"'+href+'\" onclick=\"closeModal()\">'+name+'\u003c/a>':(oc?'<a href=\"javascript:void(0)\" onclick=\"'+oc+'\">'+name+'\u003c/a>':name))+\n    '<span class=\"hr-track\"><span class=\"hr-fill\" style=\"width:'+(val>0?Math.max(2,val/max*100):0)+'%\">\u003c/span>\u003c/span>'+\n    '<span class=\"hr-val\">'+fmtVal+'\u003c/span>'+\n    (lu?'<span class=\"hr-lu\">'+esc(lu)+'\u003c/span>':'')+'\u003c/div>';\n}\nfunction drawTop(){\n try{\n  const list=$('#toplist'); if(!list) return;\n  const m=$('#tm').value;\n  const ys=topYears();\n  const tsel=$('#ty');\n  if(!tsel.options.length||Number(tsel.value)!==Number(tsel.value)||ys.indexOf(Number(tsel.value))===-1){\n    tsel.innerHTML=ys.map(y=>'<option '+(y===curYear()?'selected':'')+'>'+y+'\u003c/option>').join('')||'<option>'+curYear()+'\u003c/option>';\n    if(ys.indexOf(curYear())===-1&&ys.length) tsel.value=String(ys[0]);\n  }\n  const y=Number(tsel.value||curYear());\n  const view=$('#tview')?$('#tview').value:'top';\n  const isL=m==='billed';\n  const fmtV=v=>isL?('₹ '+fmtL(v)):(fmt(v, v>=1000?0:2)+(m==='btu'?' TR':' kWh'));\n  if(view==='groups'){\n    const gs=groupsList(y,m).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);\n    const tot=gs.reduce((a,r)=>a+r.v,0);\n    const multi=gs.filter(r=>r.sites.length>1).length;\n    $('#tnote').textContent=gs.length?(gs.length+' name families • '+multi+' with multiple sites • '+y):'no data yet';\n    list.innerHTML=gs.length?'<div class=\"gcards\">'+gs.map((r,i)=>gcardHTML(r,i,y,m,gs[0].v,tot)).join('')+'\u003c/div>'\n      :'<div class=\"topempty\">No readings recorded for '+y+' yet – pick another year.\u003c/div>';\n    return;\n  }\n  let rows=allSiteNames().map(s=>{\n    const t=yearTotals(DATA[s]&&DATA[s][y]);\n    const v=t?t[m]:0;\n    return {s:s, v:v||0, lu:(META[s]&&META[s].ts)?fmtTS(META[s].ts):'–'};\n  }).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);\n  $('#tnote').textContent=rows.length?('based on '+y+' totals • '+(isL?'₹ Lakh':(m==='btu'?'TR':'kWh'))):'no data yet';\n  if(view==='top') rows=rows.slice(0,10);\n  list.innerHTML=rows.length?rows.map((r,i)=>\n    hrowLine(i,r.s,r.v,rows[0].v,r.lu,'#/site/'+encodeURIComponent(r.s),fmtV(r.v))\n  ).join(''):'<div class=\"topempty\">No readings recorded for '+y+' yet – pick another year.\u003c/div>';\n }catch(err){ const l=document.getElementById('toplist'); if(l) l.innerHTML='<div class=\"note\">Rankings failed: '+esc(String((err&&err.message)||err))+'<br>Fix: ⚙ Sheets Setup → 🧹 Clean start.\u003c/div>'; }\n}\nfunction groupModal(g, yOpt){\n  const y=yOpt||($('#ty')?Number($('#ty').value):curYear());\n  const members=allSiteNames().filter(s=>groupOf(s)===g);\n  const rows=members.map(s=>{\n    const t=yearTotals(DATA[s]&&DATA[s][y]);\n    return {s:s, btu:t?t.btu:0, ebdg:t?t.ebdg:0, billed:t?t.billed:0, kwtr:(t&&t.btu>0)?t.ebdg/t.btu:null,\n      lu:(META[s]&&META[s].ts)?fmtTS(META[s].ts):'–'};\n  }).sort((a,b)=>b.btu-a.btu);\n  const tot=rows.reduce((a,r)=>{a.btu+=r.btu;a.ebdg+=r.ebdg;a.billed+=r.billed;return a;},{btu:0,ebdg:0,billed:0});\n  tot.kwtr=tot.btu>0?tot.ebdg/tot.btu:null;\n  const c=groupColor(g);\n  const ma=groupMonthAgg(g,y);\n  const chips='<div class=\"gchips\">'+\n    '<span class=\"gchip\"><b>'+fmt(tot.btu,0)+'\u003c/b>BTU TR '+y+'\u003c/span>'+\n    '<span class=\"gchip\"><b>'+shortNum(tot.ebdg)+'\u003c/b>EB+DG kWh\u003c/span>'+\n    '<span class=\"gchip\"><b>₹ '+fmtL(tot.billed)+'\u003c/b>Billed\u003c/span>'+\n    '<span class=\"gchip\"><b>'+(tot.kwtr!=null?tot.kwtr.toFixed(2):'–')+'\u003c/b>kW/TR (TR-weighted)\u003c/span>'+\n    '<span class=\"gchip\"><b>'+members.length+'\u003c/b>sites in family\u003c/span>\u003c/div>';\n  const tbl='<div class=\"tblwrap\" style=\"max-height:240px;overflow:auto\"><table><thead><tr><th class=\"ml\" style=\"position:static\">Site\u003c/th><th>BTU TR\u003c/th><th>EB+DG kWh\u003c/th><th>Billed ₹\u003c/th><th>kW/TR\u003c/th><th>Last update\u003c/th>\u003c/tr>\u003c/thead><tbody>'+\n    rows.map(r=>'<tr><td class=\"ml\" style=\"position:static\"><a href=\"#/site/'+encodeURIComponent(r.s)+'\" onclick=\"closeModal()\">'+esc(r.s)+'\u003c/a>\u003c/td>'+\n      '<td>'+fmt(r.btu)+'\u003c/td><td>'+fmt(r.ebdg,0)+'\u003c/td><td>'+fmt(r.billed,0)+'\u003c/td><td><b>'+(r.kwtr!=null?r.kwtr.toFixed(2):'–')+'\u003c/b>\u003c/td><td class=\"mut\" style=\"white-space:normal\">'+r.lu+'\u003c/td>\u003c/tr>').join('')+\n    '<tr class=\"tot\"><td class=\"ml\" style=\"position:static\"><b>'+esc(g)+' total\u003c/b>\u003c/td><td><b>'+fmt(tot.btu)+'\u003c/b>\u003c/td><td><b>'+fmt(tot.ebdg,0)+'\u003c/b>\u003c/td><td><b>'+fmt(tot.billed,0)+'\u003c/b>\u003c/td><td><b>'+(tot.kwtr!=null?tot.kwtr.toFixed(2):'–')+'\u003c/b>\u003c/td><td>\u003c/td>\u003c/tr>'+\n    '\u003c/tbody>\u003c/table>\u003c/div>';\n  openModal('<h3><span class=\"gc-dot\" style=\"background:'+c+'\">\u003c/span>👥 Group '+esc(g)+' – readings '+y+'\u003c/h3>'+\n  '<div class=\"oknote\">Name family: '+members.length+' site(s) – <b>'+esc(members.join(', '))+'\u003c/b>\u003c/div>'+chips+\n  '<div class=\"chartgrid\" style=\"margin-top:6px\">'+\n    chartCard('📊 '+esc(g)+' BTU TR by month – '+y,'all family sites summed','',vbars(ma.btu,MONTHS,c,'TR'))+\n    chartCard('⚡ '+esc(g)+' EB vs DG – '+y,'family totals month by month','<span><i style=\"background:#2563eb\">\u003c/i>EB\u003c/span><span><i style=\"background:#f59e0b\">\u003c/i>DG\u003c/span>',\n      vlines([{name:'EB',color:'#2563eb',values:ma.eb},{name:'DG',color:'#f59e0b',values:ma.dg}],MONTHS))+\n  '\u003c/div>'+\n  '<p class=\"mut\" style=\"margin:14px 0 4px\"><b>Member sites – full readings '+y+'\u003c/b> • click a site to open it\u003c/p>'+tbl);\n}\nfunction drawDashCharts(){\n try{\n  const box=$('#dashcharts'); if(!box) return;\n  const y=Number($('#gy').value||curYear());\n  const nz=v=>v>0?v:null;\n  const aggM=MONTHS.map((_,m)=>monthAgg(y,m));\n  const btuC=chartCard('📊 All-sites BTU TR by month – '+y,'sum of all sites with data','',\n    vbars(aggM.map(a=>nz(a.btu)),MONTHS,'#2563eb','TR'));\n  const egC=chartCard('⚡ All-sites EB vs DG by month – '+y,'grid (EB) vs generator (DG) totals','<span><i style=\"background:#2563eb\">\u003c/i>EB\u003c/span><span><i style=\"background:#f59e0b\">\u003c/i>DG\u003c/span>',\n    vlines([{name:'EB',color:'#2563eb',values:aggM.map(a=>nz(a.eb))},{name:'DG',color:'#f59e0b',values:aggM.map(a=>nz(a.dg))}],MONTHS));\n  const bilC=chartCard('💰 All-sites Billed (₹ Lakh) by month – '+y,'monthly billing totals','',\n    vbars(aggM.map(a=>nz(a.billed/1e5)),MONTHS,'#0d9488','L'));\n  const ys=topYears().slice().sort((a,b)=>a-b);\n  const yrC=chartCard('🗓 All-sites BTU TR – year by year','totals across every site','',\n    vbars(ys.map(yy=>{ let t=0; allSiteNames().forEach(s=>{ const yt=yearTotals(DATA[s]&&DATA[s][yy]); if(yt) t+=yt.btu; }); return nz(t); }),ys.map(String),'#7c3aed','TR'));\n  const gl=groupsList(y,'btu').filter(r=>r.btu>0).sort((a,b)=>b.btu-a.btu);\n  let donutItems=[], others=0;\n  gl.forEach((r,i)=>{ if(i<7) donutItems.push({name:r.g,value:r.btu,color:groupColor(r.g),label:shortNum(r.btu)+' TR',g:r.g}); else others+=r.btu; });\n  if(others>0) donutItems.push({name:'Others ('+(gl.length-7)+' families)',value:others,color:'#cbd5e1',label:shortNum(others)+' TR'});\n  const donC=chartCard('🥧 Share by group – BTU TR '+y,'each slice = one name family • click to open a group','',\n    vdonut(donutItems, shortNum(gl.reduce((a,r)=>a+r.btu,0)), 'BTU TR '+y, y));\n  /* v5.10: three MORE graphs - top sites comparison, EB/DG share, sites reporting */\n  const PAL=['#2563eb','#f59e0b','#16a34a','#7c3aed','#0ea5e9','#e11d48'];\n  const shortNm=n=>n.length>20?n.slice(0,19)+'..':n;\n  const top6=allSiteNames().map(s=>{ const yd=DATA[s]&&DATA[s][y]; const v=yd&&yd.btu?yd.btu:null;\n    return {s:s,v:v,has:!!(v&&v.some(x=>x!=null&&x>0))}; }).filter(r=>r.has)\n    .sort((a,b)=>{ const ta=yearTotals(DATA[a.s]&&DATA[a.s][y]), tb=yearTotals(DATA[b.s]&&DATA[b.s][y]);\n      return (tb?tb.btu:0)-(ta?ta.btu:0); }).slice(0,6);\n  const siteC=chartCard('🏭 Top '+top6.length+' sites – BTU TR by month – '+y,\n    'one line per site • the biggest consumers of '+y,\n    '<span>'+top6.map((r,i)=>'<i style=\"background:'+PAL[i]+'\">\u003c/i>'+esc(shortNm(r.s))+'\u003c/span>').join('')+'\u003c/span>',\n    vlines(top6.map((r,i)=>({name:shortNm(r.s),color:PAL[i],values:(r.v||[]).map(x=>x>0?x:null)})),MONTHS));\n  const ebT=aggM.reduce((a,x)=>a+(x.eb||0),0), dgT=aggM.reduce((a,x)=>a+(x.dg||0),0);\n  const srcC=chartCard('⚡ Energy source share '+y+' – EB vs DG','grid units vs generator units, full year',\n    '<span><i style=\"background:#2563eb\">\u003c/i>EB grid\u003c/span><span><i style=\"background:#f59e0b\">\u003c/i>DG generator\u003c/span>',\n    vdonut([{name:'EB (grid)',value:ebT,color:'#2563eb',label:shortNum(ebT)+' kWh'},\n            {name:'DG (generator)',value:dgT,color:'#f59e0b',label:shortNum(dgT)+' kWh'}], shortNum(ebT+dgT), 'kWh total '+y, y));\n  const repC=chartCard('📃 Sites reporting per month – '+y,'how many sites sent numbers each month','',\n    vbars(MONTHS.map((_,m)=>sitesWithData(y,m).length),MONTHS,'#0ea5e9','sites'));\n  /* v5.22: ONE MORE GRAPH - the top 10 sites by kW/TR (TR-weighted, lower = better) */\n  const nm12=n=>n.length>12?n.slice(0,11)+'..':n;\n  const kw10=allSiteNames().map(s=>{ const t=yearTotals(DATA[s]&&DATA[s][y]);\n    return {s:s, k:(t&&t.btu>0&&t.ebdg>0)?(t.ebdg/t.btu):null}; })\n    .filter(r=>r.k!=null).sort((a,b)=>b.k-a.k).slice(0,10);\n  const kwC=chartCard('🏆 Top '+kw10.length+' sites – kW/TR – '+y,\n    'TR-weighted: EB+DG ÷ BTU • lower kW/TR = better efficiency • hover a bar for the exact value','',\n    vbars(kw10.map(r=>r.k), kw10.map(r=>nm12(r.s)), '#e11d48', 'kW/TR'));\n  const hasAny=aggM.some(a=>a.btu>0||a.eb>0||a.dg>0||a.billed>0)||\n    ys.some(yy=>allSiteNames().some(s=>{ const t=yearTotals(DATA[s]&&DATA[s][yy]); return t&&t.btu>0; }));\n  const banner=hasAny?'':'<div class=\"note\" style=\"border-left:4px solid #f59e0b;margin-bottom:8px\">📊 <b>Graphs are empty because no numbers are loaded for '+y+'.\u003c/b> Fix: ① press <b>⟳ Sync now\u003c/b> (top right) – graphs fill in by themselves. ② If Sync shows an error: your Google Sheet still runs OLD code → press the orange chip on top → follow the wizard (2 min). ③ No readings yet? Open a site → type the monthly numbers → Save.\u003c/div>';\n  box.innerHTML=banner+'<div class=\"chartgrid\">'+btuC+egC+bilC+yrC+donC+siteC+srcC+repC+kwC+'\u003c/div>';\n }catch(err){ const b=document.getElementById('dashcharts'); if(b) b.innerHTML='<div class=\"note\">📊 Graphs failed to draw: '+esc(String((err&&err.message)||err))+'<br>This is old saved browser data – fix: <b>⚙ Sheets Setup → 🧹 Clean start\u003c/b> (bottom button), then log in again.\u003c/div>'; }\n}\n\n/* ---------- v5.9: 📊 ANALYSIS DASHBOARD - the separate graphs page ----------\n * One page with EVERYTHING the sample dashboard picture shows:\n * big number cards (sites / entries / kW/TR / BTU TR / EB+DG / billed),\n * 🏆 site rankings with bars, and all combined charts:\n * BTU by month • EB vs DG • billed by month • year-by-year • share by group.\n * It re-uses the dashboard's drawTop() / drawDashCharts() (same element ids),\n * so the numbers are always exactly the same on both pages. */\nfunction renderAnalysis(){\n try{\n  const y=curYear();\n  const cm=new Date().getMonth();\n  const entered=sitesWithData(y,cm);\n  let tBtu=0,tEbdg=0,tBilled=0;\n  allSiteNames().forEach(s=>{ const t=yearTotals(DATA[s]&&DATA[s][y]); if(t){ tBtu+=t.btu; tEbdg+=t.ebdg; tBilled+=t.billed; } });\n  const lm=latestMonthWithData(y);\n  let avg='–';\n  if(lm>=0){ const a=monthAgg(y,lm); if(a.btu>0) avg=(a.ebdg/a.btu).toFixed(2); }\n  const extra='<a href=\"#/admin\"><button class=\"ghost\">🏠 Dashboard\u003c/button>\u003c/a>'+\n    '<button class=\"ghost\" onclick=\"location.hash=\\'#/summary\\'\">📋 Summary\u003c/button>';\n  $('#app').innerHTML=headerHTML('📊 Analysis – '+y,'#/admin',extra)+\n  '<main>'+\n    '<div class=\"hero\"><div><h2>📊 Analysis dashboard\u003c/h2>'+\n    '<div class=\"hsub\">'+allSiteNames().length+' sites • year '+y+' • '+entered.length+'/'+allSiteNames().length+' entered this month • every number is live from your entries\u003c/div>\u003c/div>'+\n    '<div class=\"hbtns\"><button class=\"solid\" onclick=\"pull()\">⟳ Sync now\u003c/button>\u003c/div>\u003c/div>'+\n    '<div class=\"stats\">'+\n      statCard(allSiteNames().length,'🏭 Sites – active','sitesModal()','click for the list')+\n      statCard(entered.length+' / '+allSiteNames().length,'🗓 Entries – '+MONTHS[cm]+' '+y,'entriesMonthModal()',entered.length<allSiteNames().length?'click to see pending sites':'all sites entered ✓')+\n      statCard(avg,'📈 Avg kW/TR','kwtrModal()',lm>=0?MONTHS[lm]+' '+y+' (TR-weighted)':'no data yet')+\n      statCard(fmt(tBtu),'❄ BTU TR – '+y,\"metricModal('btu')\",'click for site-wise')+\n      statCard(fmt(tEbdg,0),'⚡ EB+DG kWh – '+y,\"metricModal('ebdg')\",'click for site-wise')+\n      statCard('₹ '+fmtL(tBilled),'💰 Billed – '+y,\"metricModal('billed')\",'click for site-wise (Lakh)')+\n    '\u003c/div>'+\n    '<div class=\"topbox\"><h3 style=\"margin-bottom:2px\">🏆 Site rankings – highest consumption\u003c/h3>'+\n      '<div class=\"row\" style=\"margin:6px 0 10px\">'+\n        '<label class=\"mut\">Metric\u003c/label>'+\n        '<select id=\"tm\" onchange=\"drawTop()\">'+\n          '<option value=\"btu\">BTU Cons. in TR\u003c/option>'+\n          '<option value=\"ebdg\">EB+DG (kWh)\u003c/option>'+\n          '<option value=\"billed\">Billed Amount (₹)\u003c/option>'+\n          '<option value=\"eb\">EB (kWh)\u003c/option>'+\n          '<option value=\"dg\">DG (kWh)\u003c/option>'+\n        '\u003c/select>'+\n        '<label class=\"mut\">Year\u003c/label>'+\n        '<select id=\"ty\" onchange=\"drawTop()\">\u003c/select>'+\n        '<label class=\"mut\">View\u003c/label>'+\n        '<select id=\"tview\" onchange=\"drawTop()\"><option value=\"top\">Top 10 sites\u003c/option><option value=\"all\">All sites\u003c/option><option value=\"groups\">Groups – name families\u003c/option>\u003c/select>'+\n        '<span class=\"mut\" id=\"tnote\">\u003c/span>'+\n      '\u003c/div>'+\n      '<div id=\"toplist\">\u003c/div>'+\n    '\u003c/div>'+\n    '<div class=\"topbox\"><h3 style=\"margin-bottom:2px\">📈 All graphs – every site combined\u003c/h3>'+\n      '<div class=\"row\" style=\"margin:6px 0 4px\">'+\n        '<label class=\"mut\">Year\u003c/label>'+\n        '<select id=\"gy\" onchange=\"drawDashCharts()\">\u003c/select>'+\n        '<span class=\"mut\">BTU by month • EB vs DG • billed by month • year-by-year • share by group • top 10 kW/TR\u003c/span>'+\n      '\u003c/div>'+\n      '<div id=\"dashcharts\">\u003c/div>'+\n    '\u003c/div>'+\n  '\u003c/main>';\n  fillYearSel('ty'); fillYearSel('gy');\n  drawTop(); drawDashCharts(); syncStatus(); if(SET.gasUrl) pull(true);\n }catch(err){ renderError(err); }\n}\n\n/* ---------- dashboard drill-down modals (click a stat card) ---------- */\nfunction sitesModal(){\n  const y=curYear();\n  const max=Math.max.apply(null,allSiteNames().map(x=>{const tt=yearTotals(DATA[x]&&DATA[x][y]);return tt?tt.btu:0;}).concat([1]));\n  const rows=allSiteNames().map(s=>{\n    const m=lastUpdateOf(s);\n    const t=yearTotals(DATA[s]&&DATA[s][y]);\n    return hrowLine(null,s,t?t.btu:0,max,m?fmtTS(m.ts):'–','#/site/'+encodeURIComponent(s),fmt(t?t.btu:null));\n  }).join('');\n  openModal('<h3>🏢 Sites – '+allSiteNames().length+' active locations\u003c/h3>'+\n  '<div class=\"oknote\">BTU TR = '+y+' total • click a site to open it\u003c/div>'+\n  '<div style=\"max-height:340px;overflow:auto\">'+rows+'\u003c/div>');\n}\nfunction entriesMonthModal(){\n  const y=curYear(), cm=new Date().getMonth();\n  const ent=sitesWithData(y,cm);\n  const pend=allSiteNames().filter(s=>ent.indexOf(s)<0);\n  const mx=Math.max.apply(null,allSiteNames().map(x=>{const t=yearTotals(DATA[x]&&DATA[x][y]);return t?t.btu:0;}).concat([1]));\n  const line=s=>{ const m=lastUpdateOf(s); const t=yearTotals(DATA[s]&&DATA[s][y]); return hrowLine(null,s,t?t.btu:0,mx,m?fmtTS(m.ts):'no data','#/site/'+encodeURIComponent(s),fmt(t?t.btu:null)); };\n  openModal('<h3>🗓 Entries – '+MONTHS[cm]+' '+y+'\u003c/h3>'+\n  '<div class=\"oknote\">'+ent.length+' of '+allSiteNames().length+' sites entered • '+pend.length+' pending\u003c/div>'+\n  (ent.length?'<p class=\"mut\" style=\"margin:10px 0 4px\"><b>✓ Entered ('+ent.length+')\u003c/b>\u003c/p><div style=\"max-height:220px;overflow:auto\">'+ent.map(line).join('')+'\u003c/div>':'')+\n  '<p class=\"mut\" style=\"margin:12px 0 4px\"><b>⏳ Pending ('+pend.length+')\u003c/b> – waiting for this month\\'s reading\u003c/p>'+\n  (pend.length?'<div style=\"max-height:220px;overflow:auto\">'+pend.map(line).join('')+'\u003c/div>':'<p class=\"mut\">All sites entered ✓\u003c/p>'));\n}\nfunction kwtrModal(){\n  const y=curYear();\n  const lm=latestMonthWithData(y);\n  if(lm<0){ openModal('<h3>Avg kW/TR\u003c/h3><p class=\"mut\">No data for '+y+' yet.\u003c/p>'); return; }\n  const rows=[]; let tB=0,tX=0;\n  allSiteNames().forEach(s=>{\n    const yd=DATA[s]&&DATA[s][y]; if(!yd) return;\n    const b=yd.btu?yd.btu[lm]:null, x=yd.ebdg?yd.ebdg[lm]:null;\n    if(b&&x!=null){ rows.push({s:s,k:Math.round(x/b*100)/100,b:b,x:x}); tB+=b; tX+=x; }\n  });\n  rows.sort((a,b)=>b.k-a.k);\n  const avg=tB>0?(tX/tB).toFixed(2):'–';\n  openModal('<h3>📈 kW/TR – '+MONTHS[lm]+' '+y+'\u003c/h3>'+\n  '<div class=\"oknote\">Average: <b>'+avg+'\u003c/b> kW/TR (TR-weighted = total EB+DG ÷ total BTU) • '+rows.length+' site(s) with data in '+MONTHS[lm]+'\u003c/div>'+\n  '<div class=\"tblwrap\" style=\"max-height:320px;overflow:auto\"><table><thead><tr><th class=\"ml\" style=\"position:static\">Site\u003c/th><th>BTU TR\u003c/th><th>EB+DG kWh\u003c/th><th>kW/TR\u003c/th>\u003c/tr>\u003c/thead><tbody>'+\n  rows.map(r=>'<tr><td class=\"ml\" style=\"position:static\"><a href=\"#/site/'+encodeURIComponent(r.s)+'\" onclick=\"closeModal()\">'+esc(r.s)+'\u003c/a>\u003c/td><td>'+fmt(r.b)+'\u003c/td><td>'+fmt(r.x,0)+'\u003c/td><td><b>'+r.k+'\u003c/b>\u003c/td>\u003c/tr>').join('')+\n  '<tr class=\"tot\"><td class=\"ml\" style=\"position:static\"><b>All sites\u003c/b>\u003c/td><td><b>'+fmt(tB)+'\u003c/b>\u003c/td><td><b>'+fmt(tX,0)+'\u003c/b>\u003c/td><td><b>'+avg+'\u003c/b>\u003c/td>\u003c/tr>'+\n  '\u003c/tbody>\u003c/table>\u003c/div>');\n}\nfunction metricModal(mk){\n  const y=$('#ty')?Number($('#ty').value):curYear();\n  const yy=(topYears().indexOf(y)>-1)?y:curYear();\n  const mt=METRICS.filter(x=>x.k===mk)[0];\n  const rows=allSiteNames().map(s=>{const t=yearTotals(DATA[s]&&DATA[s][yy]);return {s:s,v:t?(t[mk]||0):0};}).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);\n  const total=rows.reduce((a,r)=>a+r.v,0);\n  const isL=mk==='billed';\n  const fmtV=v=>isL?('₹ '+fmtL(v)):(fmt(v,v>=1000?0:2)+(mk==='btu'?' TR':' kWh'));\n  openModal('<h3>'+mt.label+(mk==='billed'?' (₹)':'')+' – '+yy+'\u003c/h3>'+\n  '<div class=\"oknote\">Total: <b>'+fmtV(total)+'\u003c/b> • '+rows.length+' site(s) with data • click a site to open\u003c/div>'+\n  (rows.length?'<div style=\"max-height:320px;overflow:auto\">'+rows.map((r,i)=>hrowLine(i,r.s,r.v,rows[0].v,(META[r.s]&&META[r.s].ts)?fmtTS(META[r.s].ts):'–','#/site/'+encodeURIComponent(r.s),fmtV(r.v))).join('')+'\u003c/div>':'<p class=\"mut\">No data.\u003c/p>'));\n}\n/* v5.11: one click on the site box opens the site page with ALL its data */\nfunction goSite(s){ location.hash='#/site/'+encodeURIComponent(s); }\nfunction drawCards(){\n try{\n  const box=$('#cards'); if(!box) return;\n  const q=(($('#q')&&$('#q').value)||'').toLowerCase();\n  const y=curYear();\n  box.innerHTML=allSiteNames().filter(s=>s.toLowerCase().indexOf(q)>-1).map(s=>{\n    const m=lastUpdateOf(s);\n    const t=yearTotals(DATA[s]&&DATA[s][y]);\n    const mf=monthsFilled(DATA[s]&&DATA[s][y]);\n    const vo=siteViewOnly(s);\n    const gc=groupColor(groupOf(s));\n    return '<div class=\"card click\" style=\"border-top:3px solid '+gc+'\" onclick=\"goSite(\\''+esc(s)+'\\')\">'+\n      '<div class=\"chd\"><span class=\"avat\" style=\"background:linear-gradient(135deg,'+gc+',#0ea5e9)\">'+esc(initials(s))+'\u003c/span>'+\n      '<div style=\"min-width:0\"><h3>'+esc(s)+(vo?' <span class=\"chip orange\" style=\"font-size:10px;vertical-align:middle\">🔒 view-only\u003c/span>':'')+(SET.reqs&&SET.reqs[s]?' <span class=\"chip orange\" style=\"font-size:10px;vertical-align:middle\">📨 edit requested\u003c/span>':'')+'\u003c/h3>'+\n      '<div class=\"lu\">Last update: '+(m?fmtTS(m.ts)+' • '+esc(m.by||''):'no data yet')+'\u003c/div>\u003c/div>\u003c/div>'+\n      '<div class=\"nums\"><span><b>'+fmt(t?t.btu:null)+'\u003c/b>BTU TR '+y+'\u003c/span>'+\n      '<span><b>'+fmt(t?t.ebdg:null,0)+'\u003c/b>EB+DG kWh\u003c/span>'+\n      '<span><b>'+fmt(t?t.kwtr:null)+'\u003c/b>kW/TR\u003c/span>'+\n      '<span><b>'+mf+'/12\u003c/b>months\u003c/span>\u003c/div>'+\n      '<div class=\"btns\"><a href=\"#/site/'+encodeURIComponent(s)+'\"><button class=\"small\">📊 Open\u003c/button>\u003c/a>'+\n      '<button class=\"small ghost\" onclick=\"event.stopPropagation();monitorModal(\\''+esc(s)+'\\')\">🖥 Monitor\u003c/button>'+\n      '<button class=\"small ghost\" onclick=\"event.stopPropagation();shareModal(\\''+esc(s)+'\\')\">🔗 QR\u003c/button>'+\n      '<button class=\"small '+(vo?'':'ghost')+'\" title=\"Admin control: can this site login edit, or only view?\" onclick=\"event.stopPropagation();setPerm(\\''+esc(s)+'\\')\">'+(vo?'✏ Allow edit':'🔒 View-only')+'\u003c/button>'+\n      '<button class=\"small ghost\" onclick=\"event.stopPropagation();download(\\'HVAC_'+userKey(s)+'_'+y+'.csv\\', siteCSV([\\''+esc(s)+'\\']))\">⬇ CSV\u003c/button>'+\n      '<button class=\"small danger\" title=\"Delete this site\" onclick=\"event.stopPropagation();delSite(\\''+esc(s)+'\\')\">🗑\u003c/button>\u003c/div>\u003c/div>';\n  }).join('')||'<p class=\"mut\">No sites match.\u003c/p>';\n }catch(err){ const b=document.getElementById('cards'); if(b) b.innerHTML='<div class=\"note\">Site cards failed: '+esc(String((err&&err.message)||err))+'<br>Fix: ⚙ Sheets Setup → 🧹 Clean start.\u003c/div>';\n }\n}\n/* v5.5/v5.8: admin sets one site between EDIT and VIEW-ONLY (saved to the Google Sheet).\n   setPermTo(site,'edit'|'view') = explicit – used by the Site Control Center buttons.\n   setPerm(site) = old one-click toggle – used on the dashboard site cards. */\nfunction setPermTo(s,mode){\n  if(!isAdmin()){ toast('Only the admin can change this'); return; }\n  const wantView=(mode!=='edit');\n  const wasView=siteViewOnly(s);\n  if(wasView===wantView){ toast(wantView?(s+' is already VIEW-ONLY'):(s+': editing is already allowed')); return; }\n  if(wantView) SET.perms[s]='view'; else delete SET.perms[s];\n  saveLS(LS.set,SET); drawCards();\n  toast(wantView ? s+': VIEW-ONLY set – this site login can look but not edit' : s+': editing ENABLED ✓');\n  if(SES&&location.hash==='#/site/'+encodeURIComponent(s)) render();   /* v5.8: an open site page repaints with the new permission */\n  if(SET.gasUrl){\n    jsonp('action=setPerm&site='+encodeURIComponent(s)+'&perm='+(wantView?'view':'edit'), function(d,err){\n      if(err||!d||!d.ok){ rememberPendingPerm(s,wantView?'view':'edit'); toast('⚠ Saved on this device - the Google Sheet gets it when the internet is back (auto-retry is ON)'); return; }\n      if(SET.pendingPerms){ delete SET.pendingPerms[s]; saveLS(LS.set,SET); }   /* v5.23: confirmed - drop the retry */\n      SET.gasVer=String(d.version||SET.gasVer||''); saveLS(LS.set,SET); syncStatus();\n      toast('Permission saved to Google Sheet ✓ – every device gets it');\n    });\n  }\n}\nfunction setPerm(s){ setPermTo(s, siteViewOnly(s)?'edit':'view'); }\n/* v5.23: an admin permission set while OFFLINE must never get lost and must\n   never be overwritten by an old Sheet value. It is kept in SET.pendingPerms,\n   re-applied after every pull, and re-sent to the Google Sheet automatically\n   until the Sheet confirms it. */\nfunction rememberPendingPerm(s,mode){\n  if(!SET.pendingPerms) SET.pendingPerms={};\n  SET.pendingPerms[s]=mode; saveLS(LS.set,SET);\n}\nfunction flushPendingPerms(){\n  if(!SET.pendingPerms) return;\n  Object.keys(SET.pendingPerms).forEach(site=>{\n    const perm=SET.pendingPerms[site];\n    jsonp('action=setPerm&site='+encodeURIComponent(site)+'&perm='+perm, function(d){\n      if(d&&d.ok&&SET.pendingPerms){ delete SET.pendingPerms[site]; saveLS(LS.set,SET); }\n    });\n  });\n}\nfunction flushPendingReqs(){\n  if(!SET.pendingReqs) return;\n  Object.keys(SET.pendingReqs).forEach(site=>{\n    jsonp('action=requestEdit&site='+encodeURIComponent(site), function(d){\n      if(d&&d.ok&&SET.pendingReqs){ delete SET.pendingReqs[site]; saveLS(LS.set,SET); }\n    });\n  });\n}\n/* ---------- v5.26: saves typed while the Google Sheet was NOT linked ----------\n   They sit in SET.pendingPush and are pushed automatically right after the\n   device connects (or on the next pull) - nothing typed is ever lost. */\nfunction rememberPendingPush(s){\n  if(!SET.pendingPush) SET.pendingPush={};\n  SET.pendingPush[s]=true; saveLS(LS.set,SET);\n}\nfunction flushPendingPush(){\n  if(!SET.pendingPush||!gasUrlNow()) return;\n  const list=Object.keys(SET.pendingPush);\n  if(!list.length) return;\n  list.forEach(s=>{ pushSite(s); delete SET.pendingPush[s]; });\n  saveLS(LS.set,SET);\n  toast('Connecting… pushing '+list.length+' saved update(s) to the Google Sheet');\n}\nfunction delSite(s){\n  openModal('<h3>Delete '+esc(s)+'?\u003c/h3><p class=\"mut\">This removes the site and its login from the app (browser storage). The tab in the Google Sheet stays – delete it there too if needed.\u003c/p>'+\n  '<div class=\"row\" style=\"margin-top:14px\"><button class=\"danger\" onclick=\"delSite2(\\''+esc(s)+'\\')\">Yes, delete\u003c/button><button class=\"ghost\" onclick=\"closeModal()\">Cancel\u003c/button>\u003c/div>');\n}\nfunction delSite2(s){\n  delete DATA[s]; delete META[s]; delete USERS[userKey(s)];\n  persistData(); persistUsers(); closeModal(); route(); toast('Site deleted');\n}\nfunction siteModal(){\n  openModal('<h3>＋ Add new site\u003c/h3>'+\n  '<label class=\"mut\">Site name\u003c/label><input id=\"ns\" style=\"width:100%;margin:6px 0 14px\" placeholder=\"e.g. PTP Whitefield\">'+\n  '<p class=\"mut\">A site login is created automatically: username = site name without spaces, password = username + <b>123\u003c/b>. Change it in Users.\u003c/p>'+\n  '<div class=\"row\"><button onclick=\"addSite()\">Create site\u003c/button><button class=\"ghost\" onclick=\"closeModal()\">Cancel\u003c/button>\u003c/div>');\n  setTimeout(()=>$('#ns').focus(),50);\n}\nfunction addSite(){\n  const n=$('#ns').value.trim();\n  if(!n){ toast('Enter a site name'); return; }\n  if(DATA[n]){ toast('Site already exists'); return; }\n  DATA[n]={}; META[n]={ts:'',by:''};\n  USERS[userKey(n)]={pass:hsh(userKey(n)+'123'), plain:userKey(n)+'123', role:'site', site:n};\n  persistData(); persistUsers(); closeModal();\n  location.hash='#/site/'+encodeURIComponent(n); render();\n  toast('Site created – login: '+userKey(n)+' / '+userKey(n)+'123');\n}\nfunction usersModal(){\n  const rows=allSiteNames().map(s=>{\n    const k=userKey(s), u=USERS[k];\n    return '<tr><td>'+esc(s)+'\u003c/td><td>'+esc(k)+'\u003c/td><td>'+(u?'<span class=\"pw\">'+esc(u.plain||'•••••')+'\u003c/span>':'<i class=\"mut\">missing\u003c/i>')+'\u003c/td>'+\n    '<td>'+(u?'<button class=\"small ghost\" onclick=\"resetPass(\\''+esc(k)+'\\')\">Reset password\u003c/button>':'')+'\u003c/td>\u003c/tr>';\n  }).join('');\n  openModal('<h3>👥 Logins\u003c/h3>'+\n  '<div class=\"oknote\">See &amp; edit ALL passwords in one page: <a href=\"#/passwords\"><b>🔑 Passwords page\u003c/b>\u003c/a>. Default password = username + 123.\u003c/div>'+\n  '<div class=\"tblwrap\" style=\"max-height:300px;overflow:auto\"><table class=\"users\"><thead><tr><th>Site\u003c/th><th>Username\u003c/th><th>Password\u003c/th><th>\u003c/th>\u003c/tr>\u003c/thead><tbody>'+rows+'\u003c/tbody>\u003c/table>\u003c/div>'+\n  '<div class=\"row\" style=\"margin-top:16px\"><span class=\"mut\">New admin password:\u003c/span><input id=\"np\" type=\"password\" placeholder=\"new password\">'+\n  '<button onclick=\"changeAdminPass()\">Change\u003c/button>\u003c/div>');\n}\nfunction resetPass(k){\n  const u=USERS[k]; if(!u) return;\n  const np=prompt('New password for \"'+k+'\":'); if(!np) return;\n  u.pass=hsh(np); u.plain=np; persistUsers(); pushUser(k); toast('Password updated for '+k+' – syncing to Google Sheet…');\n}\nfunction changeAdminPass(){\n  const np=$('#np').value; if(np.length<4){ toast('Use at least 4 characters'); return; }\n  USERS.admin.pass=hsh(np); USERS.admin.plain=np; persistUsers(); pushUser('admin'); toast('Admin password changed ✓ – syncing to Google Sheet…');\n}\n\n/* ---------- v5.9: PASSWORDS TWO-WAY with the Google Sheet (\"Users\" tab) ----------\n * Every password change is pushed to the sheet, and every pull adopts the\n * sheet's passwords - so the app and the sheet ALWAYS match, on every device. */\nfunction pushUser(k){\n  if(!SET.gasUrl) return;\n  const u=USERS[k]; if(!u) return;\n  try{\n    fetch(SET.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},\n      body:JSON.stringify({action:'saveUser', user:k, pass:u.plain||'', site:u.site||'', by:SES?SES.name:'app'})});\n  }catch(e){}\n}\nfunction pushAllUsers(){\n  if(!SET.gasUrl){ toast('Save the Web App URL first (⚙ Sheets Setup)'); return; }\n  const list={};\n  Object.keys(USERS).forEach(k=>{ list[k]={pass:USERS[k].plain||'', site:USERS[k].site||''}; });\n  try{\n    fetch(SET.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},\n      body:JSON.stringify({action:'saveUsers', users:list, by:SES?SES.name:'admin'})});\n    toast('⬆ Pushing '+Object.keys(list).length+' passwords to the \"Users\" tab…');\n  }catch(e){ toast('Push failed – check internet / URL'); }\n}\n/* v5.9: every user (site logins too) can change their OWN password on their page */\nfunction changePwdModal(){\n  openModal('<h3>🔑 Change my password\u003c/h3>'+\n  '<div class=\"oknote\">The new password also goes to the <b>Google Sheet \"Users\" tab\u003c/b> and comes back to every other phone/PC automatically.\u003c/div>'+\n  '<label class=\"mut\">Current password\u003c/label><input id=\"op\" type=\"password\" autocomplete=\"current-password\">'+\n  '<label class=\"mut\" style=\"margin-top:8px\">New password (min 4 characters)\u003c/label><input id=\"np1\" type=\"password\" autocomplete=\"new-password\">'+\n  '<label class=\"mut\" style=\"margin-top:8px\">Repeat the new password\u003c/label><input id=\"np2\" type=\"password\" autocomplete=\"new-password\">'+\n  '<div class=\"err\" id=\"perr\">\u003c/div>'+\n  '<div class=\"row\" style=\"margin-top:12px\"><button onclick=\"doChangePwd()\">Save new password\u003c/button><button class=\"ghost\" onclick=\"closeModal()\">Cancel\u003c/button>\u003c/div>');\n  setTimeout(()=>{ const el=$('#op'); if(el) el.focus(); },50);\n}\nfunction doChangePwd(){\n  const u=USERS[SES.name]; if(!u){ toast('No account record found'); return; }\n  const op=$('#op').value, n1=$('#np1').value, n2=$('#np2').value;\n  const err=m=>{ const e=$('#perr'); if(e){ e.textContent=m; e.style.display='block'; } };\n  if(hsh(op)!==u.pass){ err('The current password is wrong'); return; }\n  if(n1.length<4){ err('Use at least 4 characters'); return; }\n  if(n1!==n2){ err('The two new passwords are not the same'); return; }\n  u.pass=hsh(n1); u.plain=n1; persistUsers(); pushUser(SES.name);\n  closeModal(); toast('🔑 Password changed ✓ – syncing to Google Sheet…');\n}\n\n/* ---------- passwords page (admin): see & edit every login in one place ---------- */\nfunction renderPasswords(){\n  const a=USERS.admin||{};\n  const rows=allSiteNames().map(s=>{\n    const k=userKey(s), u=USERS[k], m=lastUpdateOf(s);\n    return '<tr><td class=\"ml\" style=\"position:static;min-width:130px\">'+esc(s)+'\u003c/td><td>'+esc(k)+'\u003c/td>'+\n    '<td>'+(u?'<input id=\"pw-'+esc(k)+'\" type=\"text\" value=\"'+esc(u.plain||'')+'\" placeholder=\"set new password\" autocomplete=\"off\">':'<i class=\"mut\">missing\u003c/i>')+'\u003c/td>'+\n    '<td>'+(u?'<button class=\"small\" onclick=\"savePass(\\''+esc(k)+'\\')\">Save\u003c/button>':'<button class=\"small ghost\" onclick=\"createLogin(\\''+esc(s)+'\\')\">Create\u003c/button>')+'\u003c/td>'+\n    '<td class=\"mut\" style=\"white-space:normal\">'+(m?fmtTS(m.ts):'–')+'\u003c/td>\u003c/tr>';\n  }).join('');\n  $('#app').innerHTML=headerHTML('Passwords – Admin','#/admin')+\n  '<main>'+\n    '<div class=\"toolbar\"><h2 style=\"margin:0\">🔑 All logins &amp; passwords\u003c/h2><span class=\"chip\">'+(allSiteNames().length+1)+' accounts\u003c/span>'+\n    '<span class=\"spacer\" style=\"flex:1\">\u003c/span>'+\n    '<button class=\"ghost\" onclick=\"copyLogins()\">📋 Copy all logins\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"download(\\'HVAC_Logins.csv\\', loginsCSV())\">⬇ CSV\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"pushAllUsers()\">⬆ Push all to Sheet\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"pull()\">⟳ Pull from Sheet\u003c/button>\u003c/div>'+\n    '<div class=\"oknote\">Passwords are <b>visible and editable\u003c/b> here (admin only) and they are <b>two-way synced with your Google Sheet\u003c/b>: change here → it lands in the sheet\\'s <b>\"Users\" tab\u003c/b> in seconds; type a password directly in the \"Users\" tab → press ⟳ Pull from Sheet → the app adopts it. After changing a password tell the site user their new one. Default pattern: <b>username + 123\u003c/b> (example pms / pms123).\u003c/div>'+\n    '<div class=\"tblwrap\"><table class=\"users\"><thead><tr><th class=\"ml\">Site\u003c/th><th>Username\u003c/th><th>Password (visible)\u003c/th><th>\u003c/th><th>Site last update\u003c/th>\u003c/tr>\u003c/thead><tbody>'+\n    '<tr style=\"background:#fffbeb\"><td class=\"ml\" style=\"position:static\"><b>★ ADMIN – full access\u003c/b>\u003c/td><td>admin\u003c/td>'+\n    '<td><input id=\"pw-admin\" type=\"text\" value=\"'+esc(a.plain||'')+'\" placeholder=\"set new password\" autocomplete=\"off\">\u003c/td>'+\n    '<td><button class=\"small\" onclick=\"savePass(\\'admin\\')\">Save\u003c/button>\u003c/td><td class=\"mut\">all sites\u003c/td>\u003c/tr>'+\n    rows+\n    '\u003c/tbody>\u003c/table>\u003c/div>\u003c/main>';\n}\nfunction savePass(k){\n  const el=document.getElementById('pw-'+k); if(!el) return;\n  const v=el.value;\n  if(v.length<4){ toast('Use at least 4 characters'); return; }\n  if(!USERS[k]) return;\n  USERS[k].pass=hsh(v); USERS[k].plain=v; persistUsers(); pushUser(k); toast('Password saved for '+k+' ✓ – syncing to Google Sheet…');\n}\nfunction createLogin(s){\n  const k=userKey(s);\n  if(USERS[k]){ toast('Login already exists'); return; }\n  USERS[k]={pass:hsh(k+'123'), plain:k+'123', role:'site', site:s};\n  persistUsers(); pushUser(k); render(); toast('Login created: '+k+' / '+k+'123 – syncing to Google Sheet…');\n}\nfunction loginsCSV(){\n  const rows=[['Site','Username','Password']];\n  rows.push(['ADMIN','admin',USERS.admin?USERS.admin.plain||'':'']);\n  allSiteNames().forEach(s=>{ const u=USERS[userKey(s)]; rows.push([s,userKey(s),u?u.plain||'':'']); });\n  return rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n');\n}\nfunction copyLogins(){ copyText(loginsCSV().replace(/\"/g,'')); }\nfunction setupModal(){\n  const code=document.getElementById('gas-code').textContent.trim();\n  openModal('<h3>⚙ Google Sheets Setup (two-way sync)\u003c/h3>'+\n  '<div class=\"oknote\" style=\"margin-bottom:10px\">✅ <b>ONE file only:\u003c/b> this app is a single file — you never need a second HTML file. The Apps Script code is INSIDE this app (see below) — copy it from here, no other file is needed.\u003c/div>'+\n  '<div class=\"note\" style=\"margin-bottom:10px\"><b>Summary tab missing? Blue design not coming?\u003c/b> Your Google Sheet is running OLD Apps Script code. One-time fix:<br>1. Extensions → Apps Script → delete ALL old code → paste the code from below → Save 💾.<br>2. <b>Deploy → Manage deployments → ✏ Edit → Version: New version → Deploy\u003c/b> — this is the step everyone misses: an old deployment keeps running the old code even after you paste new code!<br>3. Press <b>Test\u003c/b> below → it must say \"code v'+APP_VERSION+' matches\" → then <b>⬆ Push all data to Sheet\u003c/b>.<br><b>New in v5.4:\u003c/b> if everything is green but ONLY the <b>Summary\u003c/b> tab is missing, press <b>Test\u003c/b> → the <b>🔨 Build the Summary tab now\u003c/b> button appears — one click, no re-push needed.\u003c/div>'+\n  '<ol class=\"steps\">'+\n  '<li>Create a new blank <b>Google Sheet\u003c/b> (sheets.google.com → Blank).\u003c/li>'+\n  '<li>Menu <b>Extensions → Apps Script\u003c/b>, delete sample code.\u003c/li>'+\n  '<li>Copy the code below and paste it there. Save (💾).\u003c/li>'+\n  '<li>Run function <b>setup\u003c/b> once from the toolbar → allow permissions. This paints the clean blue design on <b>every tab\u003c/b> and builds the <b>Summary\u003c/b> tab.\u003c/li>'+\n  '<li><b>Deploy → New deployment → Web app\u003c/b> — Execute as: <b>Me\u003c/b>, Who has access: <b>Anyone\u003c/b> → Deploy → copy the Web app URL.\u003c/li>'+\n  '<li>Paste the URL below → <b>Save\u003c/b> → <b>Test\u003c/b> → <b>Push all data to Google Sheet\u003c/b>.\u003c/li>'+\n  '\u003c/ol>'+\n  '<div class=\"oknote\"><b>🌐 NEW in v5.16 \\u2013 ONE LINK for every device:\u003c/b> after you paste this code and <b>update the deployment\u003c/b> (Deploy \\u2192 Manage deployments \\u2192 \\u270f Edit \\u2192 Version: <b>New version\u003c/b> \\u2192 Deploy), your <b>Web app URL\u003c/b> becomes the app itself: open that URL in Chrome on ANY phone or PC \\u2192 the full app opens \\u2013 no file to download, nothing to install. Bookmark it (Ctrl+D).\u003c/div>'+\n  '<div class=\"oknote\">How sync works after setup:<br>• <b>App → Sheet:\u003c/b> every save in the app is pushed to the site tab automatically.<br>• <b>Sheet → App:\u003c/b> type in the sheet → the app pulls it on open, every 2 minutes, or on \"Sync now\". Each site = one tab, same format as the Excel.\u003c/div>'+\n  '<div class=\"note\">Any tab still looking old? In the Google Sheet menu click <b>HVAC Sync → \"Apply design to ALL tabs\"\u003c/b>. It upgrades every site tab to the one-color design (white cells = you type, gray rows = auto-calculated, blue column = Year Total) and refreshes the Summary.\u003c/div>'+\n  '<div id=\"pingres\" style=\"margin:8px 0\">\u003c/div>'+\n  '<div class=\"row\"><input id=\"gasurl\" style=\"flex:1;min-width:250px\" placeholder=\"https://script.google.com/macros/s/…/exec\" value=\"'+esc(SET.gasUrl)+'\">'+\n  '<button onclick=\"saveGas()\">Save URL\u003c/button><button class=\"ghost\" onclick=\"testConn()\">Test\u003c/button>'+\n  '<button class=\"ghost\" onclick=\"copySiteLink()\">📋 Copy link for site users\u003c/button>'+\n  '<button class=\"ghost\" onclick=\"pushAll()\">⬆ Push all data to Sheet\u003c/button>\u003c/div>'+\n  '<p style=\"margin:8px 0\"><a id=\"sheetlink\" href=\"'+esc(SET.sheetUrl||'#')+'\" target=\"_blank\" class=\"mut\" style=\"display:'+(SET.sheetUrl?'inline':'none')+'\">Open the Google Sheet ↗\u003c/a>\u003c/p>'+\n  '<pre class=\"code\" id=\"gcode\">'+esc(code)+'\u003c/pre>'+\n  '<div class=\"row\"><button class=\"ghost\" onclick=\"copyText(document.getElementById(\\'gcode\\').textContent)\">📋 Copy Apps Script code\u003c/button>'+\n  '<button class=\"ghost\" onclick=\"dlGs()\">⬇ Download Code.gs\u003c/button>'+\n  '<button class=\"ghost\" onclick=\"fixModal()\">🔧 Fix my Google Sheet\u003c/button>\u003c/div>'+\n  '<div class=\"row\" style=\"margin-top:8px\"><button class=\"ghost\" onclick=\"resetAppData()\">🧹 Clean start\u003c/button>'+\n  '<span class=\"mut\">Use only if the page draws wrong (no graphs / half dashboard / blank screen) – clears OLD SAVED data in this browser. The Google Sheet keeps everything; press ⟳ Sync now after.\u003c/span>\u003c/div>');\n  if(SET.gasUrl) setTimeout(testConn,150);   /* auto-check the sheet code as soon as the window opens */\n}\nfunction saveGas(){\n  SET.gasUrl=$('#gasurl').value.trim(); saveLS(LS.set,SET);\n  toast('URL saved ✓'); syncStatus(); if(SET.gasUrl){ testConn(); pull(); }\n  const lb=document.getElementById('linkbanner'); if(lb) lb.remove();   /* v5.26: drop the warning banner at once (the connect modal stays open for the test result) */\n}\n/* ---------- v5.26: SITE LOGIN - connect THIS device to the Google Sheet ----------\n   The Web App URL lives per device. The admin links it on the admin PC; a site\n   login pastes the SAME URL here once. Until then entries stay on the device\n   (queued) and push automatically right after connecting. */\nfunction siteLinkModal(){\n  openModal('<h3>🔗 Connect this device to the Google Sheet\u003c/h3>'+\n    '<div class=\"note\"><b>Why your numbers are not in the Google Sheet yet:\u003c/b> this device was never connected. Everything you typed is saved on this device and pushes automatically the moment you connect. One-time fix:<br>'+\n    '<b>1.\u003c/b> Ask the admin for the <b>Web App URL\u003c/b> (admin login → ⚙ Sheets Setup → <b>📋 Copy link for site users\u003c/b>).<br>'+\n    '<b>2.\u003c/b> Paste it below → <b>Save\u003c/b> → wait for the green Connected message. Done – forever.\u003c/div>'+\n    '<div class=\"row\" style=\"margin-top:12px\"><input id=\"gasurl\" style=\"flex:1;min-width:250px\" placeholder=\"https://script.google.com/macros/s/…/exec\" value=\"'+esc(SET.gasUrl)+'\">'+\n    '<button onclick=\"saveGas()\">Save\u003c/button>\u003c/div>'+\n    '<div id=\"pingres\" style=\"margin:8px 0\">\u003c/div>');\n}\nfunction copySiteLink(){\n  if(!SET.gasUrl){ toast('Save the Web App URL first – paste it in the box, press Save URL'); return; }\n  copyText(SET.gasUrl);\n  toast('📋 Link copied – send it to your site users (WhatsApp / email)');\n}\nfunction dlGs(){\n  const code=document.getElementById('gas-code').textContent.trim();\n  const b=new Blob([code],{type:'text/plain'});\n  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='Code.gs'; a.click();\n  setTimeout(()=>URL.revokeObjectURL(a.href),3000);\n}\nfunction syncNow(){ pull(); }\nfunction chipClick(){                    /* one click on the top-bar chip: smart routing */\n  if(!SET.gasUrl){ if(SES&&SES.role==='site'){ siteLinkModal(); } else { setupModal(); } return; }   /* v5.26: site login gets the simple connect box */\n  if(SET.gasVer && SET.gasVer!==APP_VERSION){ fixModal(); return; }\n  if(SET.hasSummary===false){ buildSummaryNow(function(){ pull(true); }); return; }   /* v5.4: one click builds Summary */\n  syncNow();\n}\n/* ---------- 🔧 FIX WIZARD: checks the sheet automatically, shows the exact fix ---------- */\nfunction fixModal(){\n  if(!SET.gasUrl){ setupModal(); return; }\n  const ok=(SET.gasVer===APP_VERSION);\n  const box=(good,html)=>'<div class=\"'+(good?'oknote':'note')+'\" style=\"margin:6px 0\">'+html+'\u003c/div>';\n  const checks=\n    box(ok,'<b>Check 1 – the app file you opened:\u003c/b> v'+APP_VERSION+' '+(ok?'✓':'')+'<br><span class=\"mut\">Top bar must show v'+APP_VERSION+'. If not, you opened an OLD file — use <b>index.html\u003c/b> from the newest chat message and delete the rest.\u003c/span>')+\n    box(ok,'<b>Check 2 – Apps Script code in your Google Sheet:\u003c/b> '+(SET.gasVer?('v'+esc(SET.gasVer)):'not checked yet')+(ok?' ✓ matches the app':' — <b>OLD ❌\u003c/b>'))+\n    box(SET.hasSummary===true,'<b>Check 3 – \"Summary\" tab in your sheet:\u003c/b> '+(SET.hasSummary===true?'exists ✓':(SET.hasSummary===false?'<b>MISSING ❌\u003c/b> → press the 🔨 button below':'unknown — press 🔍 Test below')));\n  const fix = ok\n    ? '<div class=\"oknote\"><b>Your sheet code is correct ✓\u003c/b><br>Press <b>🔨 Build the Summary tab now\u003c/b> below (takes ~10 seconds, data is already in the sheet) — or <b>⬆ Push all data to Sheet\u003c/b> in ⚙ Sheets Setup.\u003c/div>'\n    : '<div class=\"note\"><b>WHY nothing comes: your Google Sheet still runs OLD Apps Script code.\u003c/b> Fix (2 minutes, one time):<br><b>1.\u003c/b> Open your Google Sheet → menu <b>Extensions → Apps Script\u003c/b><br><b>2.\u003c/b> Select ALL old code → DELETE it → paste the new code (📋 button below) → Save 💾<br><b>3.\u003c/b> <span style=\"background:#fef08a;padding:0 4px;border-radius:4px\">Deploy → Manage deployments → ✏ pencil → Version: <b>New version\u003c/b> → Deploy\u003c/span> ← the step everyone misses!<br><b>4.\u003c/b> Back here → press <b>🔍 Test again\u003c/b> until Check 2 turns green, then <b>⬆ Push all data to Sheet\u003c/b>.\u003c/div>';\n  openModal('<h3>🔧 Fix my Google Sheet\u003c/h3>'+checks+fix+\n    '<div class=\"row\"><button onclick=\"buildSummaryNow(function(){fixModal();})\">🔨 Build the Summary tab now\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"copyText(document.getElementById(\\'gfixcode\\').textContent)\">📋 Copy Apps Script code\u003c/button>'+\n    (SET.sheetUrl?'<a class=\"ghost\" style=\"text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:8px\" href=\"'+esc(SET.sheetUrl)+'\" target=\"_blank\">Open my Google Sheet ↗\u003c/a>':'')+\n    '<button onclick=\"fixModal();testConn()\">🔍 Test again\u003c/button>\u003c/div>'+\n    '<p class=\"mut\" style=\"margin:6px 0 0\">The 🔨 button works only when Check 2 is green (code v'+APP_VERSION+' in the sheet). Old code? Do steps 1–3 above first.\u003c/p>'+\n    '<pre class=\"code\" id=\"gfixcode\">'+esc(document.getElementById('gas-code').textContent.trim())+'\u003c/pre>');\n}\n\n/* ---------- v5.5: 📋 SUMMARY PAGE — the Summary sheet INSIDE the app.\n   Click \"📋 Summary\" in the top bar -> you see the Excel Summary\n   (\"Chiller plant room consumption\"): SL.No | Site Name | Units | 2023 | 2024 |\n   2025-2026 (Q1..Q4) | SAVINGS (Units kwh / AMOUNT) | Remark + the Kw/TR table.\n   Same math as the Google-Sheet Summary tab: kW/TR = (EB+DG) ÷ BTU, TR-weighted;\n   Q1=Apr-Jun, Q2=Jul-Sep, Q3=Oct-Dec, Q4=Jan-Mar of FY_START..FY_START+1.\n   SAVINGS + Remark come from the Excel import (admin can read them; the same\n   numbers are written to the sheet's Summary tab). Site logins see ONLY their\n   own row — the admin sees all sites. ---------- */\nconst SUMMARY_ORDER=['PMS','PTS','PSN','Atrium','Summit','PTP-VALDEL','PTP-Platina','PTP-JMV','PTP-COSMOS','PTP-Gravity','UB Plaza','FTP','PTC','PTPP-B1','PTPP-B2','Oblisk','Technopolis','Alkareem','Dynasty','Emerald','Sterling Square','Blue Chip','Towers','Alpha','Cosmopolitan','Cyber Tower','Palladium','Metropolitan','Polygone','Cyber Green','TMS Square','Alphatech','Sky Tech'];\nconst FY_START=2025;   /* the \"2025-2026\" column = Apr 2025 - Mar 2026 */\nfunction qKwW(s,y,m0,m1){   /* TR-weighted kW/TR for months m0..m1 of year y */\n  const yd=DATA[s]&&(DATA[s][y]||DATA[s][String(y)]); if(!yd) return null;\n  let b=0,x=0,had=false;\n  for(let m=m0;m<=m1;m++){\n    const bv=(yd.btu&&yd.btu[m]!=null)?Number(yd.btu[m]):null;\n    const hasE=(yd.eb&&yd.eb[m]!=null)||(yd.dg&&yd.dg[m]!=null);\n    const xv=hasE?((yd.eb&&yd.eb[m]!=null?Number(yd.eb[m]):0)+(yd.dg&&yd.dg[m]!=null?Number(yd.dg[m]):0))\n                 :((yd.ebdg&&yd.ebdg[m]!=null)?Number(yd.ebdg[m]):null);\n    if(bv!=null&&xv!=null){ b+=bv; x+=xv; had=true; }\n  }\n  return (had&&b>0)?Math.round(x/b*1000)/1000:null;\n}\nfunction summaryRows(){\n  const own=(!isAdmin()&&SES&&SES.role==='site')?SES.site:null;\n  let names=SUMMARY_ORDER.filter(n=>DATA[n]);\n  allSiteNames().forEach(n=>{ if(names.indexOf(n)===-1) names.push(n); });\n  if(own) names=names.filter(n=>n===own);\n  return names.map((n,i)=>{\n    const inf=SITE_INFO[n]||{};\n    return {n:n, i:i+1,\n      k23:qKwW(n,2023,0,11), k24:qKwW(n,2024,0,11), k25:qKwW(n,2025,0,11),\n      q1:qKwW(n,FY_START,3,5),   q2:qKwW(n,FY_START,6,8),\n      q3:qKwW(n,FY_START,9,11),  q4:qKwW(n,FY_START+1,0,2),\n      kwh:(inf.savKwh!=null?inf.savKwh:''), inr:(inf.savInr!=null?inf.savInr:''), note:(inf.note||'')};\n  });\n}\nfunction renderSummary(){\n  const rows=summaryRows();\n  const ck=v=>(v==null||v==='')?'–':fmt(v,3);\n  const cn=v=>(v===''||v==null)?'–':fmt(v,0);\n  const left=rows.map(r=>'<tr>'+\n    '<td style=\"text-align:center\">'+r.i+'\u003c/td>'+\n    '<td class=\"ml\"><a href=\"#/site/'+encodeURIComponent(r.n)+'\">'+esc(r.n)+'\u003c/a>\u003c/td>'+\n    '<td style=\"text-align:center;color:#64748b;font-size:12px\">Kw/TR\u003c/td>'+\n    '<td style=\"text-align:right\">'+ck(r.k23)+'\u003c/td><td style=\"text-align:right\">'+ck(r.k24)+'\u003c/td>'+\n    '<td style=\"text-align:right\">'+ck(r.q1)+'\u003c/td><td style=\"text-align:right\">'+ck(r.q2)+'\u003c/td>'+\n    '<td style=\"text-align:right\">'+ck(r.q3)+'\u003c/td><td style=\"text-align:right\">'+ck(r.q4)+'\u003c/td>'+\n    '<td style=\"text-align:right\">'+cn(r.kwh)+'\u003c/td><td style=\"text-align:right\">'+cn(r.inr)+'\u003c/td>'+\n    '<td class=\"ml\" style=\"font-weight:400;white-space:normal;min-width:200px\">'+esc(r.note)+'\u003c/td>\u003c/tr>').join('');\n  const right=rows.map(r=>'<tr><td class=\"ml\"><a href=\"#/site/'+encodeURIComponent(r.n)+'\">'+esc(r.n)+'\u003c/a>\u003c/td>'+\n    '<td style=\"text-align:right\">'+ck(r.k23)+'\u003c/td><td style=\"text-align:right\">'+ck(r.k24)+'\u003c/td>'+\n    '<td style=\"text-align:right\">'+ck(r.k25)+'\u003c/td>'+\n    '<td class=\"ml\" style=\"font-weight:400;white-space:normal\">'+esc(r.note)+'\u003c/td>\u003c/tr>').join('');\n  const sheetBtn=(isAdmin()&&SET.sheetUrl?'<a class=\"noprint\" href=\"'+esc(SET.sheetUrl)+'\" target=\"_blank\"><button class=\"ghost\">↗ Google Sheet\u003c/button>\u003c/a>':'');   /* v5.21: site logins never see the sheet link */\n  const sheetLink=(isAdmin()&&SET.sheetUrl?' — <a href=\"'+esc(SET.sheetUrl)+'\" target=\"_blank\">open the Google Sheet tab here\u003c/a>':'');\n  $('#app').innerHTML=headerHTML('📋 Summary – Chiller plant room consumption', isAdmin()?'#/admin':null,\n    '<button class=\"ghost noprint\" onclick=\"summaryCsv()\">⬇ CSV\u003c/button>'+sheetBtn+\n    '<button class=\"ghost noprint\" onclick=\"window.print()\">🖨 Print\u003c/button>')+\n  '<main>'+\n    (SET.hasSummary===false\n      ?'<div class=\"note noprint\" style=\"margin-bottom:10px\">⚠️ This table is computed LIVE here. The same table as a <b>\"Summary\" tab inside your Google Sheet\u003c/b> is still missing — click the orange chip on top (🔨) to build it there. One click.\u003c/div>'\n      :'<div class=\"note noprint\" style=\"margin-bottom:10px\">📋 This is the same table as the <b>\"Summary\" tab in your Google Sheet\u003c/b>'+sheetLink+'. kW/TR = (EB+DG) ÷ BTU · Q1 = Apr-Jun · Q2 = Jul-Sep · Q3 = Oct-Dec · Q4 = Jan-Mar of '+FY_START+'-'+(FY_START+1)+'.\u003c/div>')+\n    (SET.gasVer && SET.gasVer!==APP_VERSION\n      ?'<div class=\"note noprint\" style=\"margin-bottom:10px\">⚠ Your sheet runs old code v'+esc(SET.gasVer)+' – the <b>Summary tab inside the Google Sheet\u003c/b> appears after the update: press the orange chip on top → 🔧 wizard (2 min).\u003c/div>':'')+\n    (!isAdmin()?'<div class=\"note noprint\" style=\"margin-bottom:10px\">👁 You see only <b>your site\u003c/b>. The admin sees all sites.\u003c/div>':'')+\n    '<div class=\"tblwrap\"><table><thead>'+\n      '<tr><th>SL.No\u003c/th><th class=\"ml\">Site Name\u003c/th><th>Units\u003c/th><th>2023\u003c/th><th>2024\u003c/th><th colspan=\"4\">2025-2026\u003c/th><th colspan=\"2\">SAVINGS\u003c/th><th class=\"ml\">Remark\u003c/th>\u003c/tr>'+\n      '<tr><th>\u003c/th><th class=\"ml\">\u003c/th><th>\u003c/th><th>\u003c/th><th>\u003c/th><th>Q1\u003c/th><th>Q2\u003c/th><th>Q3\u003c/th><th>Q4\u003c/th><th>Units kwh\u003c/th><th>AMOUNT\u003c/th><th class=\"ml\">\u003c/th>\u003c/tr>'+\n    '\u003c/thead><tbody>'+(left||'<tr><td colspan=\"12\" class=\"ml\">No data yet\u003c/td>\u003c/tr>')+'\u003c/tbody>\u003c/table>\u003c/div>'+\n    '<h3 style=\"margin:16px 4px 8px\">HVAC Chiller plant room Kw/TR\u003c/h3>'+\n    '<div class=\"tblwrap\"><table><thead><tr><th class=\"ml\">Sites\u003c/th><th>2023\u003c/th><th>2024\u003c/th><th>2025\u003c/th><th class=\"ml\">Remarks\u003c/th>\u003c/tr>\u003c/thead><tbody>'+right+'\u003c/tbody>\u003c/table>\u003c/div>'+\n  '\u003c/main>';\n  syncStatus(); if(SET.gasUrl) pull(true);\n}\nfunction summaryCsv(){\n  const rows=summaryRows();\n  let c='SL.No,Site Name,Units,2023,2024,Q1 Apr-Jun '+FY_START+',Q2 Jul-Sep '+FY_START+',Q3 Oct-Dec '+FY_START+',Q4 Jan-Mar '+(FY_START+1)+',SAVINGS Units kwh,SAVINGS AMOUNT,Remark,Kw/TR 2025\\n';\n  rows.forEach(r=>{ c+=[r.i,r.n,'Kw/TR',r.k23,r.k24,r.q1,r.q2,r.q3,r.q4,r.kwh,r.inr,r.note,r.k25].map(csvCell).join(',')+'\\n'; });\n  download('HVAC-Summary-'+FY_START+'-'+(FY_START+1)+'.csv', c);\n  toast('Summary CSV downloaded ✓');\n}\n/* ---------- site page (entry form, same format as Excel) ---------- */\nlet UI={year:null, site:null, viewOnly:false, smode:null};   /* v5.23: smode = 'edit' (type numbers) | 'view' (open the sheet) */\n/* v5.8: SITE CONTROL CENTER – one clear card at the top of every site page:\n   🔐 Permission (edit / view-only) + 🗓 Year (add / remove) + 🖥 Monitor & QR + files.\n   Everything the admin needs for THIS ONE site is now in one visible place. */\nfunction renderSite(s){\n  if(!DATA[s]){ $('#app').innerHTML=headerHTML('Not found','#/admin')+ '<main><h2>Site not found\u003c/h2>\u003c/main>'; return; }\n  UI.site=s;\n  const vo=iAmViewOnly(s);          /* v5.5: admin can set a site login to view-only */\n  const wasVo=UI.viewOnly; UI.viewOnly=vo;\n  /* v5.23: the site login works in one of two modes - EDIT (type numbers) or\n     VIEW/OPEN (look at the sheet). A fresh login, or a permission change made\n     by the admin, picks the right mode automatically. Admin is always 'edit'. */\n  if(isAdmin()){ UI.smode='edit'; }\n  else if(!UI.smode||wasVo!==vo){ UI.smode=vo?'view':'edit'; }\n  const years=siteYears(s);\n  const yselYears=years.length?years:[curYear()];\n  UI.year = years.indexOf(curYear())>-1 ? curYear() : (years.length?years[years.length-1]:curYear());\n  const m=lastUpdateOf(s);\n  const permChip = isAdmin()\n    ? '<span class=\"chip '+(siteViewOnly(s)?'orange':'green')+'\">'+(siteViewOnly(s)?'🔒 site login: VIEW-ONLY':'✏ site login: EDIT allowed')+'\u003c/span>'\n    : (vo?'<span class=\"chip orange\">🔒 view-only (set by admin)\u003c/span>':'<span class=\"chip green\">✏ you can edit\u003c/span>');\n  const ySel='<select id=\"ysel\" onchange=\"UI.year=Number(this.value);(UI.smode===\\'view\\'?drawMySheet():drawTable())\">'+yselYears.map(y=>'<option '+(y===UI.year?'selected':'')+'>'+y+'\u003c/option>').join('')+'\u003c/select>';\n  const extra=(isAdmin()?'<a href=\"#/admin\"><button class=\"ghost\">← Dashboard\u003c/button>\u003c/a>':'')+\n    '<button class=\"ghost\" onclick=\"location.hash=\\'#/summary\\'\">📋 Summary\u003c/button>'+\n    ((SES&&SES.link)?'':'<button class=\"ghost\" onclick=\"changePwdModal()\">🔑 Change password\u003c/button>')+   /* v5.20: not for link sessions */\n    (vo?'':'<button onclick=\"saveSite()\">💾 Save\u003c/button>');\n  $('#app').innerHTML=headerHTML(s, isAdmin()?'#/admin':null, extra)+\n  '<main>'+\n    (SES&&SES.role==='site'&&!gasUrlNow()\n      ?'<div id=\"linkbanner\" class=\"note\" style=\"margin:0 0 10px;background:#fff7ed;border-color:#fdba74\"><b>⚠ Google Sheet not connected on this device\u003c/b> – your entries stay ONLY here and do <b>not\u003c/b> reach the Google Sheet yet. Ask the admin for the link, then tap <button class=\"ghost\" style=\"padding:4px 10px\" onclick=\"siteLinkModal()\">🔗 Connect now\u003c/button>\u003c/div>'\n      :'')+\n    '<div class=\"panel\">'+\n      '<div class=\"panel-h\"><span class=\"pt\">🛠 Site control center\u003c/span>'+permChip+\n        '<span class=\"chip gray\">🕒 '+(m?fmtTS(m.ts)+' • '+esc(m.by||''):'no data yet')+'\u003c/span>'+\n        '<span class=\"chip gray\">✍ '+monthsFilled(DATA[s]&&DATA[s][UI.year])+'/12 months filled ('+UI.year+')\u003c/span>'+\n        '<span style=\"flex:1\">\u003c/span><span id=\"savestate\" class=\"mut\">\u003c/span>\u003c/div>'+\n      (isAdmin()?\n        '<div class=\"panel-sec\"><div class=\"psec-t\">🔐 Permission<span class=\"psub\">for the site login\u003c/span>\u003c/div><div class=\"acts\">'+\n          '<button class=\"act'+(siteViewOnly(s)?'':' on green')+'\" onclick=\"setPermTo(\\''+esc(s)+'\\',\\'edit\\')\"><b>✏ Allow edit\u003c/b><span>site login can type\u003c/span>\u003c/button>'+\n          '<button class=\"act'+(siteViewOnly(s)?' on orange':'')+'\" onclick=\"setPermTo(\\''+esc(s)+'\\',\\'view\\')\"><b>🔒 View-only\u003c/b><span>site login can only look\u003c/span>\u003c/button>'+\n          '<span class=\"mut\" style=\"max-width:250px\">Saved to the Google Sheet → every phone and PC gets it automatically.\u003c/span>\u003c/div>\u003c/div>'+\n        '<div class=\"panel-sec\"><div class=\"psec-t\">🗓 Year<span class=\"psub\">add or remove\u003c/span>\u003c/div><div class=\"acts\">'+ySel+\n          '<select id=\"yadd\">'+range(YEAR_MIN,YEAR_MAX).map(y=>'<option '+(y===curYear()?'selected':'')+'>'+y+'\u003c/option>').join('')+'\u003c/select>'+\n          '<button class=\"act\" onclick=\"addYear()\"><b>➕ Add / open year\u003c/b><span>create or open a year\u003c/span>\u003c/button>'+\n          '<button class=\"act\" onclick=\"removeYear()\"><b>➖ Remove year\u003c/b><span>delete the picked year\u003c/span>\u003c/button>'+\n          '<span class=\"mut\">Pick a year → Add opens it, Remove deletes it.\u003c/span>\u003c/div>\u003c/div>'\n      :\n        /* v5.23: THE TWO OPTIONS the site login asked for - EDIT my sheet or OPEN (look at) my sheet */\n        '<div class=\"panel-sec\"><div class=\"psec-t\">📂 My site sheet<span class=\"psub\">edit it here, or just look - your site ONLY\u003c/span>\u003c/div><div class=\"acts\">'+\n          (vo\n            ?(SET.reqs&&SET.reqs[s]\n              ?'<button class=\"act\" onclick=\"editReqModal(\\''+esc(s)+'\\')\"><b>📨 Edit requested\u003c/b><span>waiting for the admin\u003c/span>\u003c/button>'\n              :'<button class=\"act\" onclick=\"editReqModal(\\''+esc(s)+'\\')\"><b>🔒 Edit my sheet\u003c/b><span>OFF - tap to request edit\u003c/span>\u003c/button>')\n            :'<button class=\"act'+(UI.smode==='edit'?' on green':'')+'\" onclick=\"setSiteMode(\\'edit\\')\"><b>✏ Edit my sheet\u003c/b><span>type the monthly numbers\u003c/span>\u003c/button>')+\n          '<button class=\"act'+(UI.smode==='view'?' on green':'')+'\" onclick=\"setSiteMode(\\'view\\')\"><b>👁 Open my sheet\u003c/b><span>see every year, read-only\u003c/span>\u003c/button>'+\n          (vo&&SET.reqs&&SET.reqs[s]?'<span class=\"chip orange\">📨 edit requested - waiting for the admin\u003c/span>':'')+\n          '<span class=\"mut\">Only <b>'+esc(s)+'\u003c/b> - this login never sees any other site.\u003c/span>\u003c/div>\u003c/div>'+\n        '<div class=\"panel-sec\"><div class=\"psec-t\">🗓 Year\u003c/div><div class=\"acts\">'+ySel+\n          (vo?'<span class=\"mut\">Need a year added or removed? Ask the admin.\u003c/span>':(UI.smode==='view'?'<span class=\"mut\">All years are shown below - newest first.\u003c/span>':'<span class=\"mut\">Pick the year, then type your monthly numbers below.\u003c/span>'))+'\u003c/div>\u003c/div>')+\n      '<div class=\"panel-sec\"><div class=\"psec-t\">🖥 Share &amp; files\u003c/div><div class=\"acts\">'+\n        '<button class=\"act\" onclick=\"monitorModal(\\''+esc(s)+'\\')\"><b>🖥 Monitor link\u003c/b><span>this one site, read-only\u003c/span>\u003c/button>'+\n        '<button class=\"act\" onclick=\"shareModal(\\''+esc(s)+'\\')\"><b>🔗 QR / Share\u003c/b><span>print &amp; stick at site\u003c/span>\u003c/button>'+\n        '<button class=\"act\" onclick=\"siteCsv()\"><b>⬇ CSV\u003c/b><span>download for Excel\u003c/span>\u003c/button>'+\n        '<button class=\"act\" onclick=\"copyText(siteTsv())\"><b>📋 Copy\u003c/b><span>paste into Sheets\u003c/span>\u003c/button>'+\n        '<button class=\"act\" onclick=\"window.print()\"><b>🖨 Print\u003c/b><span>paper copy\u003c/span>\u003c/button>\u003c/div>\u003c/div>'+\n    '\u003c/div>'+\n    (SITE_INFO[s]?'<p class=\"mut\" style=\"margin-bottom:8px\">'+[\n      SITE_INFO[s].building?'📍 '+esc(SITE_INFO[s].building):'',\n      SITE_INFO[s].note?'🛠 '+esc(SITE_INFO[s].note):'',\n      SITE_INFO[s].savKwh?'💡 Energy saved: '+fmt(SITE_INFO[s].savKwh,0)+' kWh ≈ ₹'+fmt(SITE_INFO[s].savInr,0):''\n    ].filter(Boolean).join(' &nbsp;•&nbsp; ')+'\u003c/p>':'')+\n    (vo?'<div class=\"note\" style=\"margin-bottom:10px\">👁 <b>View-only mode\u003c/b> – the admin turned editing OFF for this site. You can look, print and download, but not type. The admin switches it back here: Dashboard → your site card → “✏ Allow edit”.\u003c/div>'\n      :(UI.smode==='view'\n        ?'<div class=\"oknote\" style=\"margin-bottom:8px\">👁 <b>My sheet – view\u003c/b> – every year of this site, read-only. Press “✏ Edit my sheet” above to type the numbers.\u003c/div>'\n        :'<div class=\"oknote\" style=\"margin-bottom:8px\">✏ <b>EDIT allowed\u003c/b> – the admin turned editing ON for this login. Type the monthly numbers below — <b>EB+DG\u003c/b> and <b>kW/TR\u003c/b> calculate automatically and every change auto-saves within 2 seconds.\u003c/div>'))+\n    '<div class=\"tblwrap\" id=\"tablebox\">\u003c/div>'+\n    '<div id=\"charts\">\u003c/div>'+\n    (UI.smode==='view'?'':   /* v5.23: OPEN mode already shows every year above - no duplicate block */\n    '<div class=\"topbox\" style=\"margin-top:16px\"><h3 style=\"margin-bottom:2px\">📑 All data – every year of '+esc(s)+'\u003c/h3>'+\n      '<p class=\"mut\">The complete record of this site: every year, every metric, every month – exactly what was saved.\u003c/p>'+\n      '<div id=\"alldatabox\">\u003c/div>\u003c/div>')+\n  '\u003c/main>';\n  if(UI.smode==='view'){ drawMySheet(); } else { drawTable(); drawAllData(); }   /* v5.23: OPEN mode = read-only sheet of every year */\n  syncStatus(); if(gasUrlNow()) pull(true);   /* v5.20: also pulls through a shared link */\n}\n/* v5.11: the site's COMPLETE record - one table per year, all metrics, all months */\nfunction drawAllData(){\n try{\n  const box=$('#alldatabox'); if(!box) return;\n  const s=UI.site, ys=siteYears(s).slice().sort((a,b)=>b-a);\n  if(!ys.length){ box.innerHTML='<p class=\"mut\">No years yet – pick a year above.\u003c/p>'; return; }\n  box.innerHTML=ys.map(y=>{\n    const yd=DATA[s]&&DATA[s][y]; const t=yearTotals(yd);\n    let h='<table style=\"margin-bottom:12px\"><thead><tr class=\"grp\"><th class=\"ml\">'+esc(s)+' – '+y+'\u003c/th>'+MONTHS.map(m=>'<th>'+m+'\u003c/th>').join('')+'<th class=\"tot\">Year total\u003c/th>\u003c/tr>\u003c/thead><tbody>';\n    METRICS.forEach(mt=>{\n      h+='<tr class=\"'+(mt.derived?'derived':'')+'\"><td class=\"ml\">'+mt.label+(mt.k==='billed'?' (₹)':'')+'\u003c/td>';\n      for(let i=0;i<12;i++){ const v=yd&&yd[mt.k]?yd[mt.k][i]:null; h+='<td>'+(v==null?'–':fmt(v, mt.k==='kwtr'?2:2))+'\u003c/td>'; }\n      h+='<td class=\"tot\">'+(t?fmt(t[mt.k], mt.k==='kwtr'?2:0):'–')+'\u003c/td>\u003c/tr>';\n    });\n    return h+'\u003c/tbody>\u003c/table>';\n  }).join('');\n  fixSticky();\n }catch(err){ const b=document.getElementById('alldatabox'); if(b) b.innerHTML='<div class=\"note\">All-data table failed: '+esc(String((err&&err.message)||err))+'\u003c/div>'; }\n}\nfunction range(a,b){ const o=[]; for(let i=a;i<=b;i++) o.push(i); return o; }\nfunction addYear(){\n  const y=Number($('#yadd').value);\n  if(siteYears(UI.site).indexOf(y)===-1){ ensureYear(UI.site,y); commitSite(false); }\n  if($('#ysel').querySelector('option[value=\"'+y+'\"]')===null){\n    const opt=document.createElement('option'); opt.value=y; opt.textContent=y; $('#ysel').appendChild(opt);\n  }\n  $('#ysel').value=y; UI.year=y; drawTable();\n}\n/* v5.5: the \"minus\" option – admin deletes a whole year from a site.\n   The site tab in Google Sheets is rewritten without that year on the next save. */\nfunction removeYear(){\n  const s=UI.site;\n  const ys=siteYears(s);\n  if(!ys.length){ toast('No year to remove'); return; }\n  const y=UI.year;\n  if(ys.indexOf(y)===-1){ toast('Pick a year that has data first'); return; }\n  if(!confirm('Remove year '+y+' from '+s+'?\\nIts monthly numbers for this year will be deleted.')) return;\n  delete DATA[s][y];\n  const left=siteYears(s);\n  UI.year=left.length?left[left.length-1]:curYear();\n  ensureYear(s,UI.year);\n  persistData(); commitSite(false);\n  const sel=$('#ysel');\n  if(sel){ const opt=sel.querySelector('option[value=\"'+y+'\"]'); if(opt) opt.remove(); sel.value=UI.year; }\n  drawTable();\n  toast('Year '+y+' removed – syncing to Google Sheets…');\n}\nfunction drawTable(){\n  const s=UI.site, y=UI.year;\n  ensureYear(s,y);\n  const yd=DATA[s][y];\n  const cm=new Date().getMonth();\n  const t=yearTotals(yd);\n  let html='<table><thead><tr class=\"grp\"><th class=\"ml\">'+s+' – '+y+'\u003c/th>'+MONTHS.map((m,i)=>'<th class=\"'+(i===cm?'curcol':'')+'\">'+m+'\u003c/th>').join('')+'<th class=\"tot\">Total\u003c/th>\u003c/tr>'+\n  '<tr><th class=\"ml\">Metric\u003c/th>'+MONTHS.map(m=>'<th>'+m+'\u003c/th>').join('')+'<th class=\"tot\">Year\u003c/th>\u003c/tr>\u003c/thead><tbody>';\n  METRICS.forEach(mt=>{\n    html+='<tr class=\"'+(mt.derived?'derived':'')+'\"><td class=\"ml\">'+mt.label+(mt.k==='billed'?' (₹)':'')+'\u003c/td>';\n    for(let i=0;i<12;i++){\n      if(mt.derived){ html+='<td class=\"'+(i===cm?'curcol':'')+'\"><span class=\"ro\" id=\"c-'+mt.k+'-'+i+'\">'+fmt(yd[mt.k][i], mt.k==='kwtr'?2:2)+'\u003c/span>\u003c/td>'; }\n      else{ html+='<td class=\"'+(i===cm?'curcol':'')+'\">'+(UI.viewOnly\n        ?'<span class=\"ro\">'+fmt(yd[mt.k][i], mt.k==='kwtr'?2:2)+'\u003c/span>'\n        :'<input type=\"number\" step=\"any\" inputmode=\"decimal\" value=\"'+(yd[mt.k][i]==null?'':yd[mt.k][i])+'\" id=\"in-'+mt.k+'-'+i+'\" oninput=\"onCell(\\''+mt.k+'\\','+i+',this.value)\">')+'\u003c/td>'; }\n    }\n    html+='<td class=\"tot\" id=\"tot-'+mt.k+'\">'+(t?fmt(t[mt.k], mt.k==='kwtr'?2:0):'–')+'\u003c/td>\u003c/tr>';\n  });\n  html+='\u003c/tbody>\u003c/table>';\n  $('#tablebox').innerHTML=html;\n  fixSticky();\n  $('#savestate').textContent='';\n  const ch=$('#charts'); if(ch) ch.innerHTML=chartsHTML(s,y);\n}\nfunction onCell(k,i,v){\n  const yd=DATA[UI.site][UI.year];\n  yd[k][i]=num(v);\n  derive(yd);\n  $('#c-ebdg-'+i).textContent = fmt(yd.ebdg[i]);\n  $('#c-kwtr-'+i).textContent = fmt(yd.kwtr[i]);\n  const t=yearTotals(yd);\n  METRICS.forEach(mt=>{ $('#tot-'+mt.k).textContent = t?fmt(t[mt.k], mt.k==='kwtr'?2:0):'–'; });\n  $('#savestate').textContent='Unsaved…';\n  clearTimeout(window._as); window._as=setTimeout(()=>commitSite(true), 1500);\n}\nfunction commitSite(auto){\n  META[UI.site]={ts:isoNow(), by:SES?SES.name:'app'};\n  persistData();\n  $('#savestate').textContent = auto?'Auto-saved ✓ '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : 'Saved ✓';\n  pushSite(UI.site);\n  syncStatus('syncing');\n}\nfunction saveSite(){ clearTimeout(window._as); commitSite(false); toast('Saved – syncing to Google Sheets…'); }\nfunction siteCsv(){ download('HVAC_'+userKey(UI.site)+'.csv', siteCSV([UI.site])); }\nfunction siteTsv(){ return tsvAll([UI.site]); }\n/* v5.23: the two site-login options - \"✏ Edit my sheet\" (the entry form, only\n   when the admin allowed edit) and \"👁 Open my sheet\" (read-only view of EVERY\n   year of this site, like its Google Sheet tab but ONLY this site's data). */\nfunction setSiteMode(m){ UI.smode=(m==='view')?'view':'edit'; renderSite(UI.site); }\nfunction editLockedMsg(){ toast('🔒 Editing is OFF for your login - the admin turns it ON: Dashboard → your site card → “✏ Allow edit”'); }\nfunction drawMySheet(){\n  try{\n    const box=$('#tablebox'); if(!box) return;\n    const s=UI.site, ys=siteYears(s).slice().sort((a,b)=>b-a);\n    box.innerHTML=(ys.length?ys.map(y=>yearTableRO(s,y)).join(''):'<p class=\"mut\">No years yet - ask the admin to add a year.\u003c/p>')+\n      '<p class=\"mut\" style=\"margin-top:6px\">👁 Read-only view of YOUR site sheet ('+esc(s)+') - exactly what is saved in Google Sheets.\u003c/p>';\n    const ch=$('#charts'); if(ch) ch.innerHTML=chartsHTML(s,UI.year);\n    fixSticky();\n  }catch(err){ const b=document.getElementById('tablebox'); if(b) b.innerHTML='<div class=\"note\">My-sheet view failed: '+esc(String((err&&err.message)||err))+'\u003c/div>'; }\n}\n/* ---------- v5.24: EDIT REQUEST - the site login asks, the admin decides ----------\n   Site side: the locked \"🔒 Edit my sheet\" button opens this modal. The request\n   is stored in the Google Sheet (META column 5) so EVERY admin device sees it.\n   Admin side: a popup at the next admin login - \"✏ Allow edit\" / \"🔒 Keep view-only\". */\nfunction editReqModal(s){\n  const asked=!!(SET.reqs&&SET.reqs[s]);\n  openModal('<h3>📨 Edit permission - '+esc(s)+'\u003c/h3>'+\n    (asked\n      ?'<div class=\"oknote\">📨 <b>Request already sent.\u003c/b> The admin sees it at the next admin login and can allow editing with one click.\u003c/div>'\n      :'<div class=\"note\">Editing is OFF for your login (set by the admin). You can <b>request edit permission\u003c/b>: the admin gets a popup at the next admin login and can allow it with one click. Until then you can look at everything in 👁 Open my sheet.\u003c/div>')+\n    '<div class=\"row\" style=\"margin-top:14px\">'+\n    (asked?'':'<button onclick=\"sendEditReq(\\''+esc(s)+'\\')\">📨 Send request to the admin\u003c/button>')+\n    '<button class=\"ghost\" onclick=\"closeModal()\">Close\u003c/button>\u003c/div>');\n}\nfunction sendEditReq(s){\n  if(!SET.reqs) SET.reqs={};\n  SET.reqs[s]=true;\n  if(!SET.pendingReqs) SET.pendingReqs={};\n  SET.pendingReqs[s]=true; saveLS(LS.set,SET);\n  closeModal(); render();\n  toast('📨 Request sent - the admin sees it at the next admin login');\n  if(gasUrlNow()){ jsonp('action=requestEdit&site='+encodeURIComponent(s), function(d){\n    if(d&&d.ok&&SET.pendingReqs){ delete SET.pendingReqs[s]; saveLS(LS.set,SET); }\n  }); }\n}\n/* v5.24: the ADMIN popup - opens at admin login and whenever a new request arrives */\nfunction editReqPopup(forceClose){\n  if(!SES||SES.role!=='admin'||!SET.reqs){ if(forceClose) closeModal(); return; }\n  const list=Object.keys(SET.reqs).filter(s=>SET.reqs[s]&&DATA[s]);\n  if(!list.length){ if(forceClose) closeModal(); return; }\n  if(!SET.reqsSeen) SET.reqsSeen={};\n  list.forEach(s=>{ SET.reqsSeen[s]=true; }); saveLS(LS.set,SET);\n  const rows=list.map(s=>'<div class=\"note\" style=\"margin:6px 0\"><b>📄 '+esc(s)+'\u003c/b> asks to type its monthly numbers.<br>'+\n    '<span class=\"mut\">Allow = the site login can edit its own sheet. Keep view-only = it can only look.\u003c/span><br>'+\n    '<button onclick=\"reqAllow(\\''+esc(s)+'\\')\" style=\"margin-top:6px\">✏ Allow edit\u003c/button> '+\n    '<button class=\"ghost\" onclick=\"reqDeny(\\''+esc(s)+'\\')\">🔒 Keep view-only\u003c/button>\u003c/div>').join('');\n  openModal('<h3>📨 Sites asking for EDIT permission\u003c/h3>'+rows+\n    '<div class=\"row\" style=\"margin-top:12px\"><button class=\"ghost\" onclick=\"closeModal()\">Later\u003c/button>\u003c/div>');\n}\nfunction reqAllow(s){\n  if(SET.reqs){ delete SET.reqs[s]; saveLS(LS.set,SET); }\n  setPermTo(s,'edit');\n  editReqPopup(true);   /* redraw with the remaining requests, or close when none left */\n  toast('✏ '+s+': editing allowed - the site login can type now');\n}\nfunction reqDeny(s){\n  if(SET.reqs){ delete SET.reqs[s]; saveLS(LS.set,SET); }\n  if(SET.reqsSeen){ delete SET.reqsSeen[s]; saveLS(LS.set,SET); }\n  if(gasUrlNow()) jsonp('action=clearReq&site='+encodeURIComponent(s), function(){});\n  editReqPopup(true);\n  toast('🔒 '+s+' stays view-only - request removed');\n}\n\n/* ---------- read-only shared view ---------- */\nlet VIEW_URL='';\nlet VIEW_PURPOSE='view';                       /* v5.20: 'view' | 'edit' – from the shared link (&p=) */\n/* v5.20: one read-only year table - used for the latest year AND every previous year */\nfunction yearTableRO(s,y){\n  const yd=DATA[s]&&DATA[s][y]; const t=yearTotals(yd);\n  let h='<table style=\"margin-bottom:12px\"><thead><tr class=\"grp\"><th class=\"ml\">'+esc(s)+' – '+y+'\u003c/th>'+MONTHS.map(mo=>'<th>'+mo+'\u003c/th>').join('')+'<th class=\"tot\">Total\u003c/th>\u003c/tr>\u003c/thead><tbody>';\n  METRICS.forEach(mt=>{\n    h+='<tr'+(mt.derived?' class=\"derived\"':'')+'><td class=\"ml\">'+mt.label+(mt.k==='billed'?' (₹)':'')+'\u003c/td>';\n    for(let i=0;i<12;i++){ const v=yd&&yd[mt.k]?yd[mt.k][i]:null; h+='<td>'+(v==null?'–':fmt(v, mt.k==='kwtr'?2:2))+'\u003c/td>'; }\n    h+='<td class=\"tot\">'+(t?fmt(t[mt.k], mt.k==='kwtr'?2:0):'–')+'\u003c/td>\u003c/tr>';\n  });\n  return h+'\u003c/tbody>\u003c/table>';\n}\n/* v5.20: the ✏ button on a shared page opens the full editor.\n   An EDIT link works WITHOUT any login - the admin allowed it when sharing. */\nfunction linkEditorOpen(s){\n  if(!SES){ SES={name:'link • '+s, role:'site', site:s, link:true, at:isoNow()}; }\n  location.hash='#/site/'+encodeURIComponent(s); render();\n}\nfunction renderView(s,tok,url,purpose){\n  VIEW_URL = url||'';\n  VIEW_PURPOSE=(purpose==='edit')?'edit':'view';\n  const ok=(tok&&tok===genToken(s))||(SET.tokens&&SET.tokens[s]&&SET.tokens[s]===tok);\n  if(!ok){ $('#app').innerHTML='<div class=\"login-wrap\"><div class=\"login\"><h1>🔒 Link not valid\u003c/h1><div class=\"fl\">This share link is old or was regenerated. Ask admin for the new QR/link.\u003c/div>\u003c/div>\u003c/div>'; return; }\n  if(!DATA[s]||!siteYears(s).length){ $('#app').innerHTML='<div class=\"login-wrap\"><div class=\"login\"><h1>'+esc(s)+'\u003c/h1><div class=\"fl\">No data yet for this site.\u003c/div>\u003c/div>\u003c/div>'; return; }\n  const canEdit=isAdmin()||VIEW_PURPOSE==='edit';\n  const ys=siteYears(s).slice().sort((a,b)=>a-b);\n  const y=ys[ys.length-1];\n  const yd=DATA[s][y]; const t=yearTotals(yd); const m=lastUpdateOf(s);\n  let html='<header><span class=\"brand\">❄ '+esc(s)+'\u003c/span>'+\n    '<span class=\"chip\">'+(VIEW_PURPOSE==='edit'?'✏ monitor • EDIT link':'🖥 monitor • read-only')+'\u003c/span><span class=\"spacer\">\u003c/span>'+\n  '<span class=\"lastupd\">Last update: '+(m?fmtTS(m.ts)+' • '+esc(m.by||''):'–')+'\u003c/span>'+\n  (canEdit?'<button class=\"noprint\" onclick=\"linkEditorOpen(\\''+esc(s)+'\\')\">✏ Edit this site\u003c/button>':'')+\n  '<button class=\"ghost noprint\" onclick=\"window.print()\">🖨 Print\u003c/button>\u003c/header><main>'+\n  (isAdmin()?'<div class=\"oknote\" style=\"margin-bottom:10px\">✏ <b>Admin:\u003c/b> press “✏ Edit this site” to type numbers or add a missing year (opens the full entry form).\u003c/div>':\n   (VIEW_PURPOSE==='edit'?'<div class=\"oknote\" style=\"margin-bottom:10px\">✏ <b>EDIT link\u003c/b> – the admin allowed editing. Press “✏ Edit this site” to type the monthly numbers.\u003c/div>':''))+\n  '<div class=\"row\" style=\"margin-bottom:12px\">'+\n    '<div class=\"stat\" style=\"flex:1;min-width:150px\"><div class=\"n\">'+fmt(t?t.btu:null)+'\u003c/div><div class=\"l\">BTU TR – '+y+'\u003c/div>\u003c/div>'+\n    '<div class=\"stat\" style=\"flex:1;min-width:150px\"><div class=\"n\">'+fmt(t?t.ebdg:null,0)+'\u003c/div><div class=\"l\">EB+DG kWh – '+y+'\u003c/div>\u003c/div>'+\n    '<div class=\"stat\" style=\"flex:1;min-width:150px\"><div class=\"n\">'+fmt(t?t.kwtr:null)+'\u003c/div><div class=\"l\">kW/TR – '+y+'\u003c/div>\u003c/div>'+\n    '<div class=\"stat\" style=\"flex:1;min-width:150px\"><div class=\"n\">'+fmt(t?t.billed:null,0)+'\u003c/div><div class=\"l\">Billed ₹ – '+y+'\u003c/div>\u003c/div>'+\n  '\u003c/div>'+\n  '<div class=\"tblwrap\">'+yearTableRO(s,y)+'\u003c/div>'+\n  (ys.length>1?\n    '<div class=\"topbox\" style=\"margin-top:16px\"><h3 style=\"margin-bottom:2px\">📑 Previous years – '+esc(s)+'\u003c/h3>'+\n    '<p class=\"mut\">Every earlier year of this site, newest first – read-only, exactly as saved.\u003c/p>'+\n    ys.slice(0,-1).reverse().map(y2=>yearTableRO(s,y2)).join('')+'\u003c/div>':'')+\n  chartsHTML(s,y)+'\u003c/main>';\n  $('#app').innerHTML=html;\n  if(VIEW_URL&&navigator.onLine) pull(true);\n}\n\n/* ---------- boot ---------- */\nfunction route(){ render(); }\nwindow.addEventListener('hashchange', render);\nwindow.addEventListener('resize', fixSticky);\nsetInterval(()=>{ if(SET.gasUrl&&navigator.onLine) pull(true); }, 120000);\nrender();\ntry{ window.__HVAC_BOOT=2; }catch(e){}   /* v5.15 start-up doctor: app is ready */\n\n\u003c/script>\n\u003c/body>\n\u003c/html>"; /* v5.16: whole app embedded here by the build; doGet serves it as a web page */

/* ---------- ONE-COLOR PALETTE (a single blue family + neutrals) ---------- */

/* ---------- one-time setup ---------- */
function setup() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(META);
  if (!sh) sh = ss.insertSheet(META);
  if (sh.getLastRow() === 0) {
    sh.getRange(1, 1, 1, 4).setValues([['Site', 'LastUpdated', 'UpdatedBy', 'Perm']]).setFontWeight('bold');
    sh.setFrozenRows(1);
  }
  /* v5.5: books created with v5.1-5.4 have a 3-column META - add the Perm header */
  if (String(sh.getRange(1, 4).getValue()) !== 'Perm') sh.getRange(1, 4).setValue('Perm');
  var has = false, trigs = ScriptApp.getProjectTriggers();
  for (var i = 0; i < trigs.length; i++) if (trigs[i].getHandlerFunction() === 'onEditHandler') has = true;
  if (!has) ScriptApp.newTrigger('onEditHandler').forSpreadsheet(ss).onEdit().create();
  var d = designAll_();
  refreshSummary_();
  Logger.log('Setup OK v' + VERSION + ' - designed ' + d.done + ' tab(s)' +
    (d.skipped.length ? ', skipped: ' + d.skipped.join(', ') : '') +
    (d.failed.length ? ', FAILED: ' + d.failed.join(', ') : '') + '. Now deploy as Web app.');
}
