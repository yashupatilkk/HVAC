<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb;--acc2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eff6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:7px 14px;background:var(--acc);color:#fff}
button:hover{background:var(--acc2)}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--acc);color:var(--acc)}
button.danger{background:#fee2e2;color:var(--bad)}
button.small{padding:4px 10px;font-size:12px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #bfdbfe;border-color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;color:var(--acc)}
header .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--acc2);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.gray{background:#f1f5f9;color:var(--mut)}
.chip.green{background:#dcfce7;color:var(--ok)}
.chip.orange{background:#fef3c7;color:var(--warn)}
.lastupd{font-size:12px;color:var(--mut);white-space:nowrap}
main{max-width:1800px;margin:0 auto;padding:20px 26px 60px}
h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-size:22px;font-weight:700;color:var(--acc)}
.stat .l{font-size:12px;color:var(--mut)}
.stat .s{font-size:10.5px;color:var(--acc2);font-weight:600;margin-top:3px}
.stat.click{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.stat.click:hover{border-color:var(--acc);box-shadow:0 3px 12px rgba(37,99,235,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:16px;color:var(--ink)}
.card .lu{font-size:12px;color:var(--mut)}
.card .nums{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.card .nums b{display:block;font-size:14px;color:var(--ink)}
.card .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.card.click{cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .12s}
.card.click:hover{border-color:var(--acc);box-shadow:0 6px 18px rgba(37,99,235,.16);transform:translateY(-2px)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;max-width:340px}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tblwrap.fit{overflow:visible}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:center}
thead th{background:#f8fafc;position:sticky;top:var(--hh,48px);z-index:5}
.modal thead th{position:sticky;top:0;z-index:5}
main .tblwrap:not(.fit):not(.tall) thead th{position:static;top:auto}
.tblwrap.tall{overflow:auto}
.tblwrap.tall thead th{top:0}
.tblwrap.tall thead tr + tr th{top:var(--hh2,0px)}
thead tr.grp th{top:var(--hh,48px);background:#eef2ff;color:var(--acc2);font-size:14px}
thead tr + tr th{top:calc(var(--hh,48px) + var(--hh2,0px))}
td.ml,th.ml{text-align:left;position:sticky;left:0;background:#f8fafc;z-index:4;font-weight:600;min-width:150px}
thead th.ml{z-index:6}
tr.derived td{background:#f8fafc;color:var(--mut)}
tr.derived td.ml{color:#475569}
td input{width:76px;padding:5px 6px;text-align:right;border:1px solid transparent;border-radius:6px;background:transparent}
td input:hover{border-color:var(--line);background:#fff}
td input:focus{outline:2px solid #bfdbfe;background:#fff;border-color:var(--acc)}
td.curcol{background:#fffbeb}
td.curcol input{background:#fffbeb}
td .ro{display:inline-block;min-width:76px}
td.tot,th.tot{background:#eef2ff;font-weight:700;color:var(--acc2)}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px;position:relative}
.modal h3{margin-bottom:12px;font-size:17px}
.modal .close{position:absolute;top:12px;right:12px;background:#f1f5f9;color:var(--mut);width:32px;height:32px;padding:0;border-radius:99px}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;margin:10px 0;padding-left:34px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
pre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;font-size:11px;overflow:auto;max-height:320px;white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace}
.note{background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:10px 12px;font-size:12px;margin:10px 0}
.oknote{background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:10px 12px;font-size:12px;margin:10px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#38bdf8);padding:16px}
.login{background:#fff;border-radius:16px;padding:34px 30px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login h1{font-size:20px;margin:6px 0 2px}
.login .fl{font-size:12px;color:var(--mut);margin-bottom:20px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.login input{width:100%}
.login button{width:100%;margin-top:18px;padding:10px}
.login .hint{margin-top:14px;font-size:11px;color:var(--mut);background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
/* v5.25: login animation - falling snow + cool-air ripple (replaces the old hint text) */
.snow-panel{position:relative;margin-top:16px;height:130px;border-radius:12px;overflow:hidden;background:linear-gradient(165deg,#eff6ff,#dbeafe 55%,#e0f2fe);border:1px solid var(--line)}
.snow-core{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%)}
.snow-core .r{position:absolute;inset:0;border:2px solid rgba(37,99,235,.28);border-radius:50%;animation:snowRipple 3.2s ease-out infinite}
.snow-core .r:nth-child(2){animation-delay:1.05s}
.snow-core .r:nth-child(3){animation-delay:2.1s}
.snow-core .f{position:absolute;left:50%;top:50%;font-size:36px;line-height:1;color:#2563eb;transform:translate(-50%,-50%);text-shadow:0 0 16px rgba(37,99,235,.35);animation:snowSpin 12s linear infinite}
.snow-fall i{position:absolute;top:-26px;animation:snowFall linear infinite}
.snow-fall b{display:block;font-weight:400;color:#60a5fa;animation:snowSway ease-in-out infinite alternate}
@keyframes snowSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes snowRipple{0%{transform:scale(.45);opacity:.95}70%{opacity:.35}100%{transform:scale(2.15);opacity:0}}
@keyframes snowFall{to{transform:translate3d(0,170px,0)}}
@keyframes snowSway{from{transform:translateX(-9px) rotate(-70deg)}to{transform:translateX(9px) rotate(70deg)}}
@media (prefers-reduced-motion:reduce){.snow-panel .r,.snow-panel .f,.snow-panel i,.snow-panel b{animation:none!important}}
.err{background:#fee2e2;color:var(--bad);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:12px;display:none}

<body>
<div id="app"><div class="login-wrap"><div class="login"><h1>❄ HVAC Consumption Manager</h1><div class="fl">Loading…</div></div></div></div>
<div id="toast"></div>
<noscript><div style="background:#fee2e2;color:#991b1b;padding:14px;font-family:sans-serif;text-align:center"><b>JavaScript is switched off in this browser.</b> Open this file with Google Chrome or Edge.</div></noscript>
<script>
/* v5.15 START-UP DOCTOR (was v5.5 safety net): the app must NEVER die silently
   on "Loading…". If the app script cannot run, this block finds out WHY and
   paints clear numbered steps: old browser (with Chrome link) vs incomplete
   file vs crashed start. ES5 only - it must run on the oldest browsers. */
(function(){
  var painted = false;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function paint(html){
    painted = true;
    try{
      var box=document.querySelector('#app .login .fl')||document.querySelector('#app .login')||document.getElementById('app');
      if(box) box.innerHTML=html;
    }catch(e){}
  }
  function errBox(msg){
    return '<div style="background:#fef2f2;border:2px solid #dc2626;color:#991b1b;border-radius:12px;padding:14px;text-align:left;font-size:13px;line-height:1.6"><b>&#9888; The app could not start.</b><br>'+msg+'</div>';
  }
  /* does THIS browser understand the code the app is written in? (ES6 level) */
  function jsOk(){
    if(window.__HVAC_FORCE_OLD===true) return false;   /* test hook */
    try{ new Function('let a=(x,...r)=>[x,...r];const {b=2}=a(1);return b===2&&[...[1,2]].length===2')(); return true; }
    catch(e){ return false; }
  }
  function steps(){
    return '<ol style="margin:8px 0 4px 18px;padding:0;text-align:left">'+
      '<li style="margin:6px 0">Put this file on the computer or phone. The file name must end with <b>.html</b>.</li>'+
      '<li style="margin:6px 0">Use <b>Google Chrome</b> (free) \u2013 install it from <a href="https://www.google.com/chrome/" style="color:#1d4ed8">google.com/chrome</a>.</li>'+
      '<li style="margin:6px 0">Open the file <b>with Chrome</b>: double-click it, or Chrome \u2192 \u22ee menu \u2192 <b>Open file</b>. Do not open it inside the chat.</li>'+
      '</ol>Usually this fixes it in 2 minutes. If it still fails, send me a photo of this screen.';
  }
  function showErr(msg){ try{ paint(errBox(esc(msg))); }catch(e){} }
  window.onerror=function(m,s,l,c){ showErr((m||'error')+' (line '+(l||'?')+')'); };
  window.addEventListener('unhandledrejection',function(ev){ try{ showErr((ev&&ev.reason&&ev.reason.message)||'promise error'); }catch(e){} });
  /* boot markers: 0 = app script never ran, 1 = app script running, 2 = app ready */
  window.__HVAC_BOOT=0;
  window.__HVAC_DIAG={jsOk:jsOk,steps:steps,showErr:showErr};   /* for tests + admin support */
  setTimeout(function(){
    if(painted) return;
    var t=document.querySelector('#app .fl');
    if(!(t && /Loading/.test(t.textContent))) return;
    if(window.__HVAC_BOOT===2) return;
    if(window.__HVAC_BOOT===0 && !jsOk()){
      paint(errBox('<b>Your browser is too old for this app \u2013 the code cannot run here.</b><br>Please do this (2 minutes):'+steps()));
      return;
    }
    if(window.__HVAC_BOOT===0){
      paint(errBox('The file may not have downloaded completely (the full file is a few hundred KB), or this screen cannot run apps.<br>Please do this:'+steps()));
      return;
    }
    paint(errBox('The app stopped while starting. Please send a photo of this screen to the admin.<br>You can also try:'+steps()));
  },6000);
})();
</script>

<script type="text/plain" id="gas-code">
/*************************************************************
 * HVAC CONSUMPTION - GOOGLE SHEETS  <->  APP  TWO-WAY SYNC
 * Version 5.25 -  login screen: the old help text becomes a COOL SNOW ANIMATION

 *    not linked" and its entries NEVER reached the sheet. The app now shows

 *  - Sheet side: no data-format change, VERSION bump only.

 *  - No behaviour change: login, sheet sync and permissions all unchanged.
 * WHAT IS NEW IN v5.24 (EDIT REQUESTS - the site login asks, the admin decides):

 *  - EDIT LINKS: a monitor link with &p=edit opens the page with an

 *    inside the QR/Share window, and a Summary button in the toolbar.
 *
 * WHAT IS NEW IN v5.5 (admin control + per-site permissions + working QR):
 *  - SUMMARY TAB = THE USER'S EXCEL SUMMARY, SAME LAYOUT:
 *    "Chiller plant room consumption" - SL.No | Site Name | Units | 2023 |
 *    2024 | 2025-2026 (Q1 Apr-Jun, Q2 Jul-Sep, Q3 Oct-Dec, Q4 Jan-Mar) |
 *    SAVINGS (Units kwh, AMOUNT) | Remark - plus the right-hand table
 *    "HVAC Chiller plant room Kw/TR" (Sites | 2023 | 2024 | 2025 | Remarks).
 *    kW/TR is filled from the site tabs; SAVINGS + Remark columns keep
 *    whatever is typed in the tab (the Excel numbers ship as defaults).
 *  - System tabs (Users / Sites / Entries / Log / Sheet1) are never treated
 *    as sites any more (the user's v5.1 log listed them as "skipped").
 *  - META tab gets a 4th column "Perm": empty = site can edit,
 *    "view" = site login is VIEW-ONLY (set by the admin in the app).
 *  - New command action=setPerm (GET/JSONP): the admin app saves the
 *    permission to the sheet, every device gets it via getAll_.
 *  - getAll_ now also returns "perms" so every phone/PC knows which
 *    sites are view-only.
 *  - LIVE PHONE VIEW:  /exec?view=SiteName&t=token  serves a small
 *    READ-ONLY page straight from the sheet -> the app's QR finally
 *    works on ANY phone (no hosting, no app install). Token is the
 *    same deterministic hash the app uses.
 *  - Design fix: freeze rows/cols BEFORE the title merge + whole-sheet
 *    stale-merge sweep -> no more "can't freeze columns which contain
 *    only part of a merged cell" / "You must select all cells in a
 *    merged range" errors on books made by v5.1.
 *
 * WHAT IS NEW IN v5.4 (Summary you can ALWAYS build):
 *  - New command  action=buildSummary  (GET/JSONP): the app can
 *    order the sheet "build the Summary tab NOW" and READ the
 *    answer (ok / hasSummary / summaryError). One click in the
 *    app creates the Summary tab - no full re-push needed.
 *  - refreshSummary_ never dies silently any more: the real
 *    error text travels back to the app and is shown as a toast.
 *  - getAll_ also reports hasSummary, so the app always knows
 *    whether the Summary tab exists.
 *
 * WHAT IS NEW IN v5.3 (batches + self-diagnosis):
 *  - The app pushes data in SMALL BATCHES (4 sites each) so the
 *    ~30-second Google Apps Script limit is never hit - ALL tabs
 *    get the design and the Summary is always built.
 *  - ping reports: code version, tab count, hasSummary -> the app
 *    shows a "Fix my Google Sheet" wizard when something is old.
 *
 * WHAT IS NEW IN v5:
 *  - Every site tab gets the SAME clean single-color design
 *    (one blue family only): dark blue title band, light blue
 *    header, white cells you type in, gray rows that are
 *    calculated for you (EB+DG, kW/TR), blue "Year Total"
 *    column. Easy to read, easy to understand.
 *  - A "Summary" tab: one row per site + ALL SITES TOTAL.
 *  - A menu in the sheet:  "HVAC Sync"
 *       -> "Apply design to ALL tabs"  (upgrades EVERY tab,
 *          even old ones made by earlier versions)
 *       -> "Refresh Summary"
 *  - setup() now designs ALL existing tabs automatically.
 *
 * SETUP (5 minutes, one time):
 *  1. sheets.google.com -> create a BLANK new sheet
 *  2. Menu: Extensions -> Apps Script
 *  3. Delete the sample code, PASTE this whole file, Save
 *  4. In the toolbar run the function  setup  (once).
 *     Allow all permissions it asks for.
 *  5. Click  Deploy -> New deployment -> type: Web app
 *       Execute as : Me
 *       Who has access: Anyone
 *     Click Deploy, then COPY the "Web app" URL
 *  6. Open the HTML app -> login as admin ->
 *     "Sheets Setup" -> paste the URL -> Save -> Test ->
 *     "Push all data to Google Sheet" (first import).
 *
 * AFTER THAT EVERYTHING STAYS IN SYNC:
 *  - App saves are pushed to the site tab (designed) in seconds.
 *  - Edits typed directly in the sheet are stamped by the
 *    onEdit trigger; the app pulls on open / every 2 min /
 *    when you press "Sync now".
 *  - Each site has its own tab, same format as the Excel:
 *    Metric | Year | Jan..Dec (+ Year Total), 6 rows per year.
 *************************************************************/

hed after connecting */\nif(typeof SET.hostBase!=='string') SET.hostBase = '';   /* v5.5: hosted https address for working QRs */\nsaveLS(LS.data, DATA); saveLS(LS.users, USERS); saveLS(LS.meta, META); saveLS(LS.set, SET);\nconst APP_VERSION='5.27';   /* shown on the login page + header so you always know which file you opened */\nfunction allSiteNames(){ return Object.keys(DATA).sort((a,b)=>a.localeCompare(b)); }\nfunction userKey(n){ return String(n).toLowerCase().replace(/[^a-z0-9]/g,''); }\nfunction initials(s){ const p=String(s).split(/[\\s\\-–_]+/).filter(Boolean); return (p.length?p.map(w=>w[0]).join(''):String(s)).slice(0,3).toUpperCase()||'?'; }\nfunction persistData(){ saveLS(LS.data, DATA); saveLS(LS.meta, META); }\nfunction persistUsers(){ saveLS(LS.users, USERS); }\n\n/* ---------- helpers ---------- */\nconst $ = s=>document.querySelector(s);\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }\nfunction hsh(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'h'+h.toString(16); }\nfunction num(v){ const n=parseFloat(v); return isNaN(n)?null:n; }\nfunction fmt(n, dec){ if(n==null||n==='') return '–'; if(!isFinite(n)) return '–'; const d=(dec==null?2:dec); return Number(n).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0}); }\nfunction fmtTS(ts){ if(!ts) return '–'; const d=new Date(ts); if(isNaN(d)) return '–'; return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }\nfunction isoNow(){ return new Date(Math.floor(Date.now()/1000)*1000).toISOString(); }\nfunction curYear(){ return new Date().getFullYear(); }\nfunction toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }\nfunction derive(yd){\n  if(!yd) return;\n  /* recompute EB+DG / kW/TR but PRESERVE stored values when the base metric\n     is absent (some Excel months record only EB+DG, or kW/TR without BTU) */\n  const oldE=(yd.ebdg||[]).slice(), oldK=(yd.kwtr||[]).slice();\n  yd.ebdg=[]; yd.kwtr=[];\n  for(let i=0;i<12;i++){\n    const eb=yd.eb?yd.eb[i]:null, dg=yd.dg?yd.dg[i]:null;\n    yd.ebdg.push((eb!=null||dg!=null)?(Number(eb||0)+Number(dg||0)):(oldE[i]!=null?oldE[i]:null));\n  }\n  for(let i=0;i<12;i++){\n    const b=yd.btu?yd.btu[i]:null, e=yd.ebdg[i];\n    if(b&&e!=null) yd.kwtr.push(Math.round(e/b*100)/100);\n    else yd.kwtr.push(oldK[i]!=null?oldK[i]:null);\n  }\n}\nfunction yearTotals(yd){\n  if(!yd) return null;\n  const t={btu:0,billed:0,eb:0,dg:0,ebdg:0}; let any=false;\n  METRICS.filter(m=>!m.derived).forEach(m=>{ (yd[m.k]||[]).forEach(v=>{ if(v!=null){ t[m.k]+=v; any=true; } }); });\n  (yd.ebdg||[]).forEach(v=>{ if(v!=null) t.ebdg+=v; });\n  t.kwtr = t.btu>0 ? t.ebdg/t.btu : null;\n  return any||t.ebdg>0 ? t : null;\n}\nfunction monthsFilled(yd){ if(!yd) return 0; let c=0; const used=Object.keys(yd); for(let i=0;i<12;i++){ for(const k of used){ const a=yd[k]; if(a&&a[i]!=null&&a[i]!==''){ c++; break; } } } return c; }\nfunction siteYears(s){ return Object.keys(DATA[s]||{}).map(Number).filter(y=>y>0).sort((a,b)=>a-b); }\nfunction ensureYear(s,y){ if(!DATA[s][y]){ DATA[s][y]=emptyYear(); } derive(DATA[s][y]); }\nfunction lastUpdateOf(s){ return (META[s]&&META[s].ts)?META[s]:null; }\nfunction globalLastUpdate(){ let best=null; for(const s of allSiteNames()){ const m=lastUpdateOf(s); if(m&&(!best||m.ts>best.ts)) best={ts:m.ts,by:m.by,site:s}; } return best; }\nfunction fmtL(n){ if(!n||!isFinite(n)) return '0.00 L'; return (Math.round(n/1e5*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' L'; }\nfunction groupOf(s){ return /^ptp/i.test(s) ? 'PTP' : String(s).split(/[\\s\\-–]/)[0]; }\nconst GROUP_COLORS=['#2563eb','#f59e0b','#16a34a','#7c3aed','#0d9488','#e11d48','#0ea5e9','#d97706','#65a30d','#4f46e5','#0891b2','#be185d'];\nfunction groupColor(g){ let h=0; for(let i=0;i<String(g).length;i++) h=(h*31+String(g).charCodeAt(i))>>>0; return GROUP_COLORS[h%GROUP_COLORS.length]; }\n/* aggregate all sites of one name family for a year (Groups view) */\nfunction groupsList(y, metric){\n  const gs={};\n  allSiteNames().forEach(s=>{\n    const g=groupOf(s), t=yearTotals(DATA[s]&&DATA[s][y]);\n    if(!gs[g]) gs[g]={g:g, sites:[], btu:0, ebdg:0, billed:0, eb:0, dg:0, lu:''};\n    const r=gs[g]; r.sites.push(s);\n    if(t){ r.btu+=t.btu; r.ebdg+=t.ebdg; r.billed+=t.billed; r.eb+=t.eb; r.dg+=t.dg; }\n    const lu=META[s]&&META[s].ts; if(lu&&lu>r.lu) r.lu=lu;\n  });\n  return Object.keys(gs).map(k=>{ const r=gs[k]; r.kwtr=r.btu>0?r.ebdg/r.btu:null; r.v=metric?r[metric]:r.btu; return r; });\n}\n/* month-by-month totals for one name family (group modal charts) */\nfunction groupMonthAgg(g, y){\n  const keys=['btu','eb','dg','ebdg','billed'];\n  const sums={}, any={}; keys.forEach(k=>sums[k]=Array(12).fill(0));\n  allSiteNames().filter(s=>groupOf(s)===g).forEach(s=>{\n    const yd=DATA[s]&&DATA[s][y]; if(!yd) return;\n    keys.forEach(k=>{ (yd[k]||[]).forEach((v,i)=>{ if(v!=null){ sums[k][i]+=v; any[k]=1; } }); });\n  });\n  const out={}; keys.forEach(k=>out[k]=any[k]?sums[k].map(v=>v>0?v:null):Array(12).fill(null));\n  return out;\n}\nfunction gcardHTML(r,i,y,m,maxV,tot){\n  const isL=m==='billed';\n  const c=groupColor(r.g);\n  const unit=isL?'':(m==='btu'?' TR':(m==='kwtr'?'':' kWh'));\n  const f=v=>isL?('₹ '+fmtL(v)):(fmt(v,v>=1000?0:2)+unit);\n  const share=tot>0?(Math.round(r.v/tot*1000)/10):0;\n  return '<div class=\"gcard\" style=\"border-top-color:'+c+'\" onclick=\"groupModal(\\''+esc(r.g)+'\\','+y+')\">'+\n    '<div class=\"gc-top\"><span class=\"gc-rank\" style=\"background:'+c+'\">'+(i+1)+'\u003c/span>'+\n    '<span class=\"gc-name\">'+esc(r.g)+'\u003c/span>'+\n    '<span class=\"gc-n\">'+r.sites.length+' site'+(r.sites.length!==1?'s':'')+'\u003c/span>\u003c/div>'+\n    '<div class=\"gc-val\">'+f(r.v)+'\u003c/div>'+\n    '<div class=\"gc-bar\"><span style=\"width:'+(r.v>0?Math.max(4,r.v/maxV*100):0)+'%;background:'+c+'\">\u003c/span>\u003c/div>'+\n    '<div class=\"gc-metrics\">'+\n      '<span><b>'+fmt(r.btu,0)+'\u003c/b>BTU TR\u003c/span>'+\n      '<span><b>'+shortNum(r.ebdg)+'\u003c/b>EB+DG kWh\u003c/span>'+\n      '<span><b>₹ '+fmtL(r.billed)+'\u003c/b>Billed\u003c/span>'+\n      '<span><b>'+(r.kwtr!=null?r.kwtr.toFixed(2):'–')+'\u003c/b>kW/TR\u003c/span>'+\n    '\u003c/div>'+\n    '<div class=\"gc-lu\">share '+share+'% • last update '+(r.lu?fmtTS(r.lu):'–')+' • tap for readings ▸\u003c/div>'+\n  '\u003c/div>'; \n}\nfunction vdonut(items, centerTop, centerSub, y){\n  const total=items.reduce((a,r)=>a+r.value,0);\n  if(!total||!items.length) return '<div class=\"topempty\">No data yet for this year.\u003c/div>';\n  const R=62,CX=90,CY=90,SW=28,C=2*Math.PI*R;\n  let off=0,g='';\n  items.forEach(r=>{\n    const len=r.value/total*C, seg=Math.max(len-2,0.6);\n    g+='<circle cx=\"'+CX+'\" cy=\"'+CY+'\" r=\"'+R+'\" fill=\"none\" stroke=\"'+r.color+'\" stroke-width=\"'+SW+'\" stroke-dasharray=\"'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'\" stroke-dashoffset=\"'+(-off).toFixed(2)+'\" transform=\"rotate(-90 '+CX+' '+CY+')\"><title>'+esc(r.name)+': '+esc(r.label)+' ('+(Math.round(r.value/total*1000)/10)+'%)\u003c/title>\u003c/circle>';\n    off+=len;\n  });\n  g+='<text x=\"'+CX+'\" y=\"'+(CY)+'\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#0f172a\">'+centerTop+'\u003c/text>';\n  g+='<text x=\"'+CX+'\" y=\"'+(CY+17)+'\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">'+centerSub+'\u003c/text>';\n  return '<div class=\"donutwrap\"><svg viewBox=\"0 0 180 180\" style=\"width:180px;max-width:45%;flex:none\" role=\"img\">'+g+'\u003c/svg><div class=\"dleg\">'+\n    items.map(r=>'<a href=\"javascript:void(0)\"'+(r.g?' onclick=\"groupModal(\\''+esc(r.g)+'\\','+y+')\"':'')+'><span class=\"sw\" style=\"background:'+r.color+'\">\u003c/span><span class=\"dn\">'+esc(r.name)+'\u003c/span><span class=\"dv\">'+esc(r.label)+' • '+(Math.round(r.value/total*1000)/10)+'%\u003c/span>\u003c/a>').join('')+\n    '\u003c/div>\u003c/div>'; \n}\n\n/* ---------- aggregation across sites (dashboard cards & graphs) ---------- */\nfunction monthAgg(y, m){\n  const agg={btu:0,billed:0,eb:0,dg:0,ebdg:0};\n  allSiteNames().forEach(s=>{\n    const yd=DATA[s]&&DATA[s][y]; if(!yd) return;\n    METRICS.forEach(x=>{ const v=yd[x.k]?yd[x.k][m]:null; if(v!=null) agg[x.k]+=Number(v)||0; });\n  });\n  return agg;\n}\nfunction sitesWithData(y, m){\n  return allSiteNames().filter(s=>{\n    const yd=DATA[s]&&DATA[s][y]; if(!yd) return false;\n    return METRICS.some(x=>yd[x.k]&&yd[x.k][m]!=null);\n  });\n}\nfunction latestMonthWithData(y){\n  const start=(y===curYear())?new Date().getMonth():11;\n  for(let m=start;m>=0;m--){ if(sitesWithData(y,m).length) return m; }\n  return -1;\n}\n\n/* ---------- CSV / export ---------- */\nfunction csvCell(v){ return '\"' + String(v==null?'':v).replace(/\"/g,'\"\"') + '\"'; }\nfunction siteCSV(sites){\n  const head=['Site','Metric','Year'].concat(MONTHS);\n  const rows=[head];\n  sites.forEach(s=>{\n    siteYears(s).forEach(y=>{\n      const yd=DATA[s][y];\n      METRICS.forEach(m=>{ rows.push([s, m.label, y].concat((yd[m.k]||[]).map(v=>v==null?'':v))); });\n    });\n  });\n  return rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n');\n}\nfunction download(name, text){\n  const b=new Blob(['\\ufeff'+text],{type:'text/csv;charset=utf-8'});\n  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();\n  setTimeout(()=>URL.revokeObjectURL(a.href),3000);\n}\n/* v5.13: backup file save / load - works even when browser storage is blocked */\nfunction backupDownload(){\n  try{\n    download('HVAC-backup-'+new Date().toISOString().slice(0,10)+'.json',\n      JSON.stringify({v:APP_VERSION, data:DATA, users:USERS, meta:META, set:SET}));\n    toast('\\u2705 Backup file saved \\u2013 keep it safe (Downloads folder).');\n  }catch(e){ toast('Backup failed: '+String((e&&e.message)||e)); }\n}\nfunction backupLoad(){\n  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';\n  inp.onchange=()=>{\n    const f=inp.files&&inp.files[0]; if(!f) return;\n    const r=new FileReader();\n    r.onload=()=>{\n      try{\n        const j=JSON.parse(r.result);\n        if(!j.data||typeof j.data!=='object') throw new Error('not a HVAC backup file');\n        DATA=(()=>{ const o={}; for(const k in j.data) o[k]=normalizeSite(j.data[k]); return o; })();\n        USERS=j.users||USERS; META=j.meta||META; SET=Object.assign({gasUrl:'',tokens:{},lastPull:null,sheetUrl:'',perms:{},hostBase:''}, j.set||{});\n        if(!SET.perms) SET.perms={};\n        if(!SET.reqs) SET.reqs={}; if(!SET.pendingReqs) SET.pendingReqs={}; if(!SET.reqsSeen) SET.reqsSeen={};   /* v5.24 */\n        if(!SET.pendingPush) SET.pendingPush={};   /* v5.26 */\n        persistData(); persistUsers(); saveLS(LS.set, SET);\n        render(); toast('\\u2705 Backup loaded \\u2013 all sites and users are back.');\n      }catch(e){ toast('\\u26a0 Could not load backup: '+String((e&&e.message)||e)); }\n    };\n    r.readAsText(f);\n  };\n  inp.click();\n}\nfunction fixStorageModal(){\n  const quota=STORAGE_ERR==='QuotaExceededError';\n  openModal('<h3>\\u26a0 Fix \"storage\" problem\u003c/h3>'+\n  (quota\n    ?'<div class=\"oknote\"><b>Storage is FULL.\u003c/b> Fix inside the app: Logout \\u2192 log in again \\u2192 \\u2699 Sheets Setup \\u2192 <b>🧹 Clean start\u003c/b>, then push your data to Google Sheets again. Or remove very old years (site page \\u2192 \\u2796 Remove year).\u003c/div>'\n    :'<div class=\"oknote\"><b>Storage is blocked.\u003c/b> The app works, but saves nothing. Do this ONE time:\\n'+\n     '<ol style=\"margin:8px 0 4px 18px;text-align:left\">'+\n     '<li><b>Save this file\u003c/b> (index.html) to the computer \\u2013 do not open it from inside the chat.\u003c/li>'+\n     '<li><b>Close\u003c/b> the chat / preview window.\u003c/li>'+\n     '<li>Open <b>Chrome\u003c/b> (normal window, not private) \\u2192 <b>File \\u2192 Open\u003c/b> (or double-click the file).\u003c/li>'+\n     '<li>Still blocked? Chrome \\u2192 \\u22ee menu \\u2192 <b>Settings\u003c/b> \\u2192 <b>Privacy and security\u003c/b> \\u2192 <b>Third-party cookies\u003c/b> \\u2192 allow. Or try the <b>Edge\u003c/b> or <b>Firefox\u003c/b> browser.\u003c/li>'+\n     '\u003c/ol>After that the yellow warning disappears and everything saves again.\u003c/div>')+\n  '<div class=\"row\" style=\"margin-top:12px\"><button onclick=\"backupDownload()\">💾 Save backup file now\u003c/button>'+\n  '<button class=\"ghost\" onclick=\"backupLoad()\">📂 Load backup file\u003c/button>'+\n  '<button class=\"ghost\" onclick=\"closeModal()\">Close\u003c/button>\u003c/div>');\n}\n/* v5.14: yellow strip can be CLEARED with the X button; a tiny chip stays in the header */\nfunction storHide(){ STOR_HIDE=true; try{ render(); }catch(e){ const b=document.getElementById('storban'); if(b) b.style.display='none'; } }\nfunction storShow(){ STOR_HIDE=false; try{ render(); }catch(e){} }\nfunction storageBanner(){\n  if(STORAGE_OK||STOR_HIDE) return '';\n  const quota=STORAGE_ERR==='QuotaExceededError';\n  return '<div id=\"storban\" style=\"background:#fef3c7;color:#92400e;border-bottom:1px solid #fde68a;padding:7px 16px;font-size:12.5px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap\">'+\n    '\\u26a0 '+(quota?'Browser storage is FULL \\u2013 nothing more will be saved.':'Browser storage is BLOCKED on this screen \\u2013 the app WORKS and your data is safe in Google Sheets (press \\u27F3 Sync now).')+\n    '<button class=\"small\" onclick=\"backupDownload()\">💾 Save backup\u003c/button>'+\n    '<button class=\"small ghost\" onclick=\"backupLoad()\">📂 Load backup\u003c/button>'+\n    '<button class=\"small ghost\" onclick=\"fixStorageModal()\">How to fix?\u003c/button>'+\n    '<button class=\"small ghost\" style=\"margin-left:auto;min-width:34px\" onclick=\"storHide()\" title=\"Hide this message\">\\u2715\u003c/button>\u003c/div>';\n}\nfunction tsvAll(sites){\n  const head=['Site','Metric','Year'].concat(MONTHS);\n  const rows=[head];\n  sites.forEach(s=>{ siteYears(s).forEach(y=>{ const yd=DATA[s][y]; METRICS.forEach(m=>{ rows.push([s,m.label,y].concat((yd[m.k]||[]).map(v=>v==null?'':v))); }); }); });\n  return rows.map(r=>r.join('\\t')).join('\\n');\n}\n\n/* ---------- SVG charts (self-contained, no external library) ---------- */\nfunction shortNum(v){\n  if(v==null||!isFinite(v)) return '–';\n  const a=Math.abs(v);\n  if(a>=1e7) return (Math.round(v/1e7*100)/100)+'Cr';\n  if(a>=1e5) return (Math.round(v/1e5*100)/100)+'L';\n  if(a>=1e3) return (Math.round(v/1e3*10)/10)+'k';\n  return String(Math.round(v*100)/100);\n}\nfunction chartCard(title, sub, legend, inner){\n  return '<div class=\"card chartcard\"><h3>'+title+'\u003c/h3><div class=\"csub\">'+sub+'\u003c/div>'+\n    (legend?'<div class=\"leg\">'+legend+'\u003c/div>':'')+inner+'\u003c/div>';\n}\nfunction vbars(values, labels, color, unit){\n  const W=620,H=200,P={l:52,r:10,t:12,b:24};\n  const has=values.some(v=>v!=null);\n  if(!has) return '<div class=\"topempty\">No data yet for this year.\u003c/div>';\n  const max=Math.max.apply(null,values.map(v=>v||0).concat([1e-9]));\n  const n=values.length, bw=(W-P.l-P.r)/n, ph=H-P.t-P.b;\n  let g='';\n  for(let i=0;i<=4;i++){\n    const y=P.t+ph*i/4, val=max*(1-i/4);\n    g+='<line x1=\"'+P.l+'\" y1=\"'+y+'\" x2=\"'+(W-P.r)+'\" y2=\"'+y+'\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>';\n    g+='<text x=\"'+(P.l-6)+'\" y=\"'+(y+4)+'\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"end\">'+shortNum(val)+'\u003c/text>';\n  }\n  values.forEach((v,i)=>{\n    const h=v?ph*v/max:0, x=P.l+i*bw+bw*0.18, w=bw*0.64, y=H-P.b-Math.max(h,0);\n    g+='<rect x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" width=\"'+w.toFixed(1)+'\" height=\"'+Math.max(h,0.5).toFixed(1)+'\" rx=\"3\" fill=\"'+(v?color:'#e2e8f0')+'\">'+\n       '<title>'+labels[i]+': '+(v==null?'–':fmt(v)+' '+unit)+'\u003c/title>\u003c/rect>';\n    g+='<text x=\"'+(x+w/2).toFixed(1)+'\" y=\"'+(H-8)+'\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">'+labels[i]+'\u003c/text>';\n  });\n  return '<svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\">'+g+'\u003c/svg>';\n}\nfunction vlines(seriesArr, labels){\n  const W=620,H=200,P={l:52,r:12,t:12,b:24};\n  const has=seriesArr.some(sr=>sr.values.some(v=>v!=null));\n  if(!has) return '<div class=\"topempty\">No data yet for this year.\u003c/div>';\n  let mx=1e-9;\n  seriesArr.forEach(sr=>sr.values.forEach(v=>{ if(v!=null&&v>mx) mx=v; }));\n  const ph=H-P.t-P.b, n=labels.length, step=(W-P.l-P.r)/(n-1||1);\n  let g='';\n  for(let i=0;i<=4;i++){\n    const y=P.t+ph*i/4;\n    g+='<line x1=\"'+P.l+'\" y1=\"'+y+'\" x2=\"'+(W-P.r)+'\" y2=\"'+y+'\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>';\n    g+='<text x=\"'+(P.l-6)+'\" y=\"'+(y+4)+'\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"end\">'+shortNum(mx*(1-i/4))+'\u003c/text>';\n  }\n  labels.forEach((lb,i)=>{\n    const x=P.l+i*step;\n    g+='<text x=\"'+x.toFixed(1)+'\" y=\"'+(H-8)+'\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">'+lb+'\u003c/text>';\n  });\n  seriesArr.forEach(sr=>{\n    let d='', open=false;\n    sr.values.forEach((v,i)=>{\n      if(v==null){ open=false; return; }\n      const x=P.l+i*step, y=P.t+ph*(1-v/mx);\n      d+=(open?' L':' M')+x.toFixed(1)+' '+y.toFixed(1); open=true;\n    });\n    if(d) g+='<path d=\"'+d+'\" fill=\"none\" stroke=\"'+sr.color+'\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>';\n    sr.values.forEach((v,i)=>{\n      if(v==null) return;\n      const x=P.l+i*step, y=P.t+ph*(1-v/mx);\n      g+='<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"3\" fill=\"'+sr.color+'\"><title>'+labels[i]+' • '+sr.name+': '+fmt(v)+'\u003c/title>\u003c/circle>';\n    });\n  });\n  return '<svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\">'+g+'\u003c/svg>';\n}\nfunction chartsHTML(s, y){\n  const yd=DATA[s]&&DATA[s][y]; if(!yd) return '';\n  const C1='#2563eb', C2='#f59e0b', C3='#16a34a';\n  const btuCard=chartCard('📊 Monthly BTU Cons. in TR – '+y, esc(s)+' • cooling load month by month','',\n    vbars(yd.btu, MONTHS, C1, 'TR'));\n  const ebdgCard=chartCard('⚡ EB vs DG (kWh) – '+y, 'grid (EB) vs generator (DG) units','<span><i style=\"background:'+C1+'\">\u003c/i>EB (kWh)\u003c/span><span><i style=\"background:'+C2+'\">\u003c/i>DG (kWh)\u003c/span>',\n    vlines([{name:'EB',color:C1,values:yd.eb},{name:'DG',color:C2,values:yd.dg}], MONTHS));\n  const kwCard=chartCard('📈 kW/TR – '+y, 'plant efficiency (lower is better)','<span><i style=\"background:'+C3+'\">\u003c/i>kW/TR\u003c/span>',\n    vlines([{name:'kW/TR',color:C3,values:yd.kwtr}], MONTHS));\n  const years=siteYears(s);\n  let yrCard='';\n  if(years.length>1){\n    const yvals=years.map(yy=>{ const t=yearTotals(DATA[s][yy]); return t?t.btu:0; });\n    yrCard=chartCard('🗓 Year-wise BTU TR total', 'all years on record: '+years.join(', '),'',\n      vbars(yvals, years.map(String), '#7c3aed', 'TR'));\n  }\n  const billedCard=chartCard('💰 Billed Amount (₹) – '+y, 'monthly HVAC billing','',\n    vbars(yd.billed, MONTHS, '#0d9488', '₹'));\n  return '<div class=\"chartgrid\">'+btuCard+ebdgCard+kwCard+billedCard+yrCard+'\u003c/div>';\n}\n\n/* ---------- auth ---------- */\n/* v5.19: the login is kept on the device TWO ways - localStorage (normal) AND\n   a cookie fallback (survives on the https web link even when \"site data\" is\n   blocked). Plus one-click links (#/key/USER/TOKEN) below that log in with NO\n   storage at all - the real fix for \"password asked every time\". */\nfunction sesCookieWrite(){ try{ document.cookie='hvac_ses='+encodeURIComponent(JSON.stringify(SES))+';max-age='+(60*60*24*90)+';path=/'; }catch(e){} }\nfunction sesCookieClear(){ try{ document.cookie='hvac_ses=;max-age=0;path=/'; }catch(e){} }\nfunction sesCookieRead(){ try{ const m=document.cookie.match(/(?:^|;\\s*)hvac_ses=([^;]+)/); return m?JSON.parse(decodeURIComponent(m[1])):null; }catch(e){ return null; } }\nfunction login(u,p){\n  const rec=USERS[u];\n  if(!rec||rec.pass!==hsh(p)) return null;\n  SES={name:u, role:rec.role, site:rec.site||null, at:isoNow()};\n  saveLS(LS.ses, SES);\n  sesCookieWrite();\n  return SES;\n}\nfunction logout(){ SES=null; localStorage.removeItem(LS.ses); sesCookieClear(); location.hash='#/login'; render(); }\nfunction isAdmin(){ return SES&&SES.role==='admin'; }\nfunction canSeeSite(name){ return isAdmin()||(SES&&SES.role==='site'&&SES.site===name); }\n/* v5.5: per-site permission - admin can set a site login to VIEW-ONLY */\nfunction siteViewOnly(s){ return !!(SET.perms&&SET.perms[s]==='view'); }\nfunction iAmViewOnly(s){ return !!(SES&&SES.role==='site'&&!SES.link&&siteViewOnly(s)); }   /* v5.20: an EDIT link from the admin overrides view-only */\n/* v5.19: one-click login links - open the link and the app is ALREADY logged\n   in. No password, no storage (works even when browser storage is blocked or\n   in private mode). The key comes from the same hash the app already uses.\n   Keep the links private - a link works like a password. */\nfunction quickKey(u){ return hsh('key|'+String(u)+'|hvac2026'); }\nfunction quickLink(u){\n  const base=(SET.gasUrl&&/^https:/i.test(SET.gasUrl))?SET.gasUrl:location.href.split('#')[0];\n  return base+'#/key/'+encodeURIComponent(u)+'/'+quickKey(u);\n}\nfunction quickLinksModal(){\n  const base=(SET.gasUrl&&/^https:/i.test(SET.gasUrl))?SET.gasUrl:location.href.split('#')[0];\n  let rows='';\n  Object.keys(USERS).sort().forEach((u,i)=>{\n    const r=USERS[u];\n    rows+='<div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\">'+\n      '<span class=\"chip gray\" style=\"min-width:130px;text-align:left\">'+esc(u)+(r.role==='admin'?' ★admin':'')+'\u003c/span>'+\n      '<input id=\"ql'+i+'\" readonly value=\"'+esc(quickLink(u))+'\" style=\"flex:1;font-size:11px;padding:4px 6px;border:1px solid #c9d6ea;border-radius:6px\" onclick=\"this.select()\">'+\n      '<button class=\"ghost small\" onclick=\"copyText(document.getElementById(\\'ql'+i+'\\').value)\">📋\u003c/button>\u003c/div>';\n  });\n  openModal('<h3>⚡ One-click login links\u003c/h3>'+\n    '<div class=\"oknote\" style=\"margin-bottom:10px\">Open one of these links (or bookmark it \\u2b50) \\u2192 the app opens <b>already logged in\u003c/b>. <b>No password asked \\u2013 ever.\u003c/b> Works on every device, even when browser storage is blocked or in private mode.<br>Send each site user their own link (WhatsApp / email). Keep the links private \\u2013 a link works like a password.\u003c/div>'+\n    rows+\n    '<div class=\"hint\" style=\"margin-top:10px\">Link base: '+esc(base)+'<br>Phone: open the link once \\u2192 bookmark it (\\u2b50) \\u2192 from tomorrow, one tap opens the app logged in.\u003c/div>'+\n    '<button style=\"width:100%;margin-top:10px\" onclick=\"closeModal()\">Close\u003c/button>');\n}\n\n/* ---------- Google Sheets sync (JSONP + no-cors POST) ---------- */\nlet SYNC={busy:false};\nfunction gasUrlNow(){ return VIEW_URL||SET.gasUrl||''; }\nfunction jsonp(params, cb){\n  const cbn='cb'+Date.now()+Math.floor(Math.random()*1e4);\n  const s=document.createElement('script');\n  const base=gasUrlNow();\n  const url=base+(base.indexOf('?')>-1?'&':'?')+'callback='+cbn+'&'+params;\n  let done=false;\n  const to=setTimeout(()=>{ if(!done){ done=true; cb(null,new Error('timeout')); cleanup(); } },20000);\n  function cleanup(){ clearTimeout(to); try{delete window[cbn];}catch(e){} s.remove(); }\n  window[cbn]=function(data){ if(!done){ done=true; cb(data,null); cleanup(); } };\n  s.onerror=()=>{ if(!done){ done=true; cb(null,new Error('network')); cleanup(); } };\n  s.src=url; document.body.appendChild(s);\n}\nfunction pushSite(s){\n  const gu=gasUrlNow();                      /* v5.20: a shared EDIT link (VIEW_URL) can push too */\n  if(!gu){ rememberPendingPush(s); return; }   /* v5.26: not linked yet - queue it, pushed automatically after connecting */\n  const m=META[s]||{ts:isoNow(),by:'app'};\n  const body={action:'save', site:s, data:DATA[s], ts:m.ts, by:m.by||'app'};\n  try{\n    fetch(gu,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})\n      .then(()=>{ setTimeout(pull, 4000); })\n      .catch(()=>{ syncStatus(); });\n  }catch(e){ syncStatus(); }\n}\nfunction pull(silent, cb){\n  if(!gasUrlNow()||SYNC.busy){ syncStatus(); if(cb)cb(false); return; }\n  SYNC.busy=true; syncStatus('syncing');\n  jsonp('action=get', function(data,err){\n    SYNC.busy=false;\n    if(err||!data||!data.sites){ if(!silent) toast('Sync failed – check Web App URL / internet'); syncStatus('error'); if(cb)cb(false); return; }\n    let pulled=[], pushed=[], added=[];\n    for(const s in data.sites){\n      const sv=data.meta&&data.meta[s]?data.meta[s].ts:'';\n      const lv=META[s]&&META[s].ts?META[s].ts:'';\n      const serverHas=Object.keys(data.sites[s]||{}).length>0;\n      if(!lv||(sv&&sv>lv)||(serverHas&&!sv&&!Object.keys(DATA[s]||{}).length)){\n        if(serverHas){\n          DATA[s]=normalizeSite(data.sites[s]);\n          META[s]={ts:sv||isoNow(), by:(data.meta&&data.meta[s]&&data.meta[s].by)||'Google Sheet'};\n          pulled.push(s);\n        }\n        if(!USERS[userKey(s)]){ USERS[userKey(s)]={pass:hsh(userKey(s)+'123'), plain:userKey(s)+'123', role:'site', site:s}; added.push(s); }\n      } else if(lv&&sv&&lv>sv){ pushSite(s); pushed.push(s); }\n    }\n    if(data.sheetUrl) SET.sheetUrl=data.sheetUrl;\n    if(data.perms&&typeof data.perms==='object'){          /* v5.5: per-site edit/view permissions from the sheet */\n      const pv=JSON.stringify(SET.perms||{});\n      SET.perms=data.perms;\n      /* v5.23: an OFFLINE admin decision wins over the old Sheet value until the auto-retry confirms it */\n      if(SET.pendingPerms){ for(const ps in SET.pendingPerms){ if(SET.pendingPerms[ps]==='view') SET.perms[ps]='view'; else delete SET.perms[ps]; } }\n      if(JSON.stringify(SET.perms)!==pv&&SES&&SES.role==='site'&&location.hash.indexOf('#/site/')===0){ route(); }\n    }\n    if(data.reqs&&typeof data.reqs==='object'){            /* v5.24: sites asking the admin for edit permission */\n      SET.reqs=data.reqs;\n      if(SET.pendingReqs){ for(const pr in SET.pendingReqs){ SET.reqs[pr]=true; } }   /* an OFFLINE request stays visible until the Sheet confirms */\n      if(SES&&SES.role==='admin'&&Object.keys(SET.reqs).some(s2=>SET.reqs[s2]&&!(SET.reqsSeen&&SET.reqsSeen[s2]))){ setTimeout(editReqPopup, 300); }\n    }\n    if(data.users&&typeof data.users==='object'){        /* v5.9: two-way passwords - the sheet \"Users\" tab wins on pull */\n      const pwChanged=[];\n      for(const uk in data.users){\n        const sp=String(data.users[uk].pass||''); if(!sp) continue;\n        const cur=USERS[uk];\n        if(!cur){ USERS[uk]={pass:hsh(sp), plain:sp, role:'site', site:data.users[uk].site||''}; pwChanged.push(uk); }\n        else if(cur.plain!==sp){ cur.pass=hsh(sp); cur.plain=sp; pwChanged.push(uk); }\n      }\n      if(pwChanged.length){ persistUsers(); if(!silent) toast('🔑 Passwords updated from Google Sheet: '+pwChanged.join(', ')); }\n    }\n    SET.gasVer = data.version ? String(data.version) : 'old';   /* Apps Script code version; 'old' = pre-5.1 code */\n    SET.lastPull=isoNow();\n    persistData(); if(added.length) persistUsers(); saveLS(LS.set, SET);\n    flushPendingPerms();                                  /* v5.23: retry permission sets that failed offline */\n    flushPendingReqs();                                   /* v5.24: retry edit requests that failed offline */\n    flushPendingPush();                                   /* v5.26: push the saves that waited for a connection */\n    syncStatus(); if(cb)cb(true);\n    if(pulled.length||added.length){ toast('Updated from Google Sheets: '+pulled.concat(added).join(', ')); route(); }\n    else if(!silent&&pushed.length) toast('Local changes pushed to Google Sheets');\n    else if(!silent) toast('Already up to date ✓');\n  });\n}\nfunction pushAll(){\n  if(!SET.gasUrl){ toast('Save the Web App URL first'); return; }\n  const names=allSiteNames();\n  names.forEach(s=>{ if(!META[s]||!META[s].ts) META[s]={ts:isoNow(),by:'first import'}; });\n  persistData();\n  /* Google Apps Script kills any run longer than ~30s, so pushing all 33 sites in ONE\n     request times out (= only 1-2 tabs designed, no Summary). Small batches never hit it. */\n  const B=4, total=Math.max(1,Math.ceil(names.length/B));\n  let i=0;\n  toast('Pushing '+names.length+' sites in '+total+' small batches…');\n  function next(){\n    if(i>=total){\n      /* v5.4: after the last batch, ORDER the sheet to build the Summary tab via JSONP\n         (readable reply!) - this no longer depends on the final POST succeeding blind. */\n      toast('All '+total+' batches pushed ✓ – building Summary tab…');\n      setTimeout(function(){\n        buildSummaryNow(function(built){\n          pull(false, function(okc){\n            if(SET.gasVer && SET.gasVer!==APP_VERSION){ toast('⚠ Your sheet runs OLD code – opening the fix wizard'); fixModal(); }\n            else if(built){ toast('✓ Verified: site data + Summary tab are NOW in your Google Sheet'); }\n            else if(okc){ toast('Data pushed, but Summary failed – press the orange chip on top'); }\n          });\n        });\n      },2500);\n      return;\n    }\n    const batch={}; names.slice(i*B,(i+1)*B).forEach(s=>{ batch[s]=DATA[s]; });\n    i++;\n    syncStatus('syncing');\n    try{\n      fetch(SET.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},\n        body:JSON.stringify({action:'saveAll', sites:batch, ts:isoNow(), by:SES?SES.name:'admin', final:(i===total)})})\n        .then(()=>{ toast('Pushed batch '+i+'/'+total+' ✓'); setTimeout(next,1200); })\n        .catch(()=>{ toast('Push failed at batch '+i+' – check internet / URL'); syncStatus('error'); });\n    }catch(e){ toast('Push failed – check internet / URL'); syncStatus('error'); }\n  }\n  next();\n}\nfunction testConn(){\n  if(!SET.gasUrl){ toast('Enter the Web App URL first'); return; }\n  const res=$('#pingres');\n  jsonp('action=ping', function(d,err){\n    if(err||!d||!d.ok){\n      if(res) res.innerHTML='<div class=\"note\">❌ Test failed – check the URL / redeploy with access \"Anyone\".\u003c/div>';\n      toast('Test failed – redeploy with access \"Anyone\"'); return;\n    }\n    SET.sheetUrl=d.sheetUrl||''; SET.gasVer=String(d.version||'old');\n    SET.hasSummary=(d.hasSummary===true)?true:((d.hasSummary===false)?false:null); saveLS(LS.set,SET);\n    const a=$('#sheetlink'); if(a&&d.sheetUrl){ a.href=d.sheetUrl; a.textContent='Open the Google Sheet'; a.style.display='inline-block'; }\n    if(SET.gasVer!==APP_VERSION){\n      if(res) res.innerHTML='<div class=\"note\">⚠️ <b>Connected, but your Google Sheet runs OLD code (v'+esc(SET.gasVer)+').\u003c/b><br>Fix: Extensions → Apps Script → delete ALL code → paste the code from below → Save 💾 → <b>Deploy → Manage deployments → ✏ → Version: New version → Deploy\u003c/b> → press Test again.<br><a href=\"#\" onclick=\"fixModal();return false\" style=\"font-weight:700;color:#b45309\">→ or click here to open the 🔧 Fix wizard\u003c/a>\u003c/div>';\n      toast('Sheet code is OLD (v'+SET.gasVer+') – see the fix in this window');\n    } else if(SET.hasSummary===false){\n      if(res) res.innerHTML='<div class=\"oknote\">✅ Connected – code v'+esc(SET.gasVer)+' matches ✓\u003c/div>'+\n        '<div class=\"note\">⚠️ The <b>Summary\u003c/b> tab is missing in your Google Sheet. One click fixes it:<br><button onclick=\"buildSummaryNow(function(){testConn();})\">🔨 Build the Summary tab now\u003c/button>\u003c/div>';\n      toast('Connected ✓ – but Summary tab is missing. One click below builds it.');\n    } else {\n      if(res) res.innerHTML='<div class=\"oknote\">✅ Connected – Google Sheet code v'+esc(SET.gasVer)+' matches ✓'+(SET.hasSummary===true?' · Summary tab exists ✓':'')+'<br>Now press \"⬆ Push all data to Sheet\".\u003c/div>';\n      toast('Connected to Google Sheet ✓');\n    }\n    syncStatus();\n  });\n}\n/* ---------- v5.4: build the Summary tab in the SHEET on demand (JSONP = readable answer) ---------- */\nfunction buildSummaryNow(cb){\n  if(!gasUrlNow()){ toast('Save the Web App URL first'); if(cb)cb(null); return; }\n  toast('Building the Summary tab in your Google Sheet…');\n  syncStatus('syncing');\n  jsonp('action=buildSummary', function(d,err){\n    if(err){ toast('Could not reach the sheet – check internet / URL'); syncStatus('error'); if(cb)cb(null); return; }\n    if(!d||!d.ok||typeof d.hasSummary!=='boolean'){        /* action unknown = pre-5.4 code in the sheet */\n      SET.gasVer='old'; saveLS(LS.set,SET); syncStatus();\n      toast('⚠ Your sheet runs OLD code (no buildSummary) – opening the fix wizard');\n      fixModal(); if(cb)cb(false); return;\n    }\n    SET.gasVer=String(d.version||'old'); SET.hasSummary=d.hasSummary; saveLS(LS.set,SET); syncStatus();\n    if(d.hasSummary){ toast('✓ Done – the Summary tab is NOW in your Google Sheet (check tab list at the bottom)'); if(cb)cb(true); }\n    else { toast('⚠ Summary build failed: '+(d.summaryError||'unknown error')); fixModal(); if(cb)cb(false); }\n  });\n}\nfunction syncStatus(state){\n  const el=$('#syncchip'); if(!el) return;\n  if(!SET.gasUrl){ el.className='chip gray'; el.textContent='Google Sheets: not linked'; return; }\n  if(state==='syncing'){ el.className='chip orange'; el.textContent='⟳ Syncing…'; return; }\n  if(state==='error'){ el.className='chip orange'; el.textContent='Google Sheets: retry pending'; return; }\n  if(SET.gasVer && SET.gasVer!==APP_VERSION){   /* the sheet deployment runs older Apps Script code */\n    el.className='chip orange';\n    el.textContent = SET.gasVer==='old' ? 'Sheets: OLD code — CLICK HERE for fix' : 'Sheets: OLD code v'+SET.gasVer+' — CLICK HERE for fix';\n    el.style.fontWeight='700';\n    return;\n  }\n  if(SET.hasSummary===false){                   /* v5.4: code is current but the Summary tab never appeared */\n    el.className='chip orange'; el.style.fontWeight='700';\n    el.textContent='Summary tab MISSING in Sheet — CLICK to build it';\n    return;\n  }\n  el.className='chip green';\n  el.textContent='Google Sheets: synced'+(SET.gasVer?' · v'+SET.gasVer:'')+(SET.lastPull?' '+new Date(SET.lastPull).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'');\n}\n\n/* ---------- v5.7: SITE MONITOR ----------\n   One separate link PER SITE. Opening it shows ONLY that site's entry data\n   (numbers + charts, read-only). A site can NEVER see another site's data:\n   the link is locked to one site by name + token, and there is no way to\n   navigate from a monitor page to any other site. The admin also keeps the\n   per-site View-only / Allow-edit control for the site LOGIN. */\nfunction monitorLink(s){\n  const base=location.href.split('#')[0];        /* works offline: same index.html file, just another link */\n  return base+'#/view/'+encodeURIComponent(s)+'?t='+genToken(s);\n}\nfunction monitorModal(s){\n  SHARE_SITE=s;\n  const here=monitorLink(s);\n  const phone=gasViewLink(s)||((SET.hostBase||'')?shareLink(s):'');\n  let html='<h3>🖥 Site Monitor – '+esc(s)+'\u003c/h3>'+\n    '<div class=\"oknote\"><b>What this is:\u003c/b> a separate link for THIS ONE SITE. It opens a read-only monitor page with <b>only '+esc(s)+'\u003c/b> entry data (monthly numbers + charts + totals). <b>'+esc(s)+' can never see any other site.\u003c/b> No password needed.\u003c/div>'+\n    '<p style=\"margin:10px 0 2px\"><b>① Monitor on THIS computer\u003c/b> – bookmark/save it on the site PC (opens this same index.html file, shows only '+esc(s)+'):\u003c/p>'+\n    '<div class=\"qrbox\"><div id=\"qrm1\">\u003c/div><div class=\"link\">'+\n    '<input readonly value=\"'+esc(here)+'\" onclick=\"this.select()\">'+\n    '<div class=\"row\"><button onclick=\"copyText(\\''+esc(here).replace(/'/g,\"\\\\'\")+'\\')\">📋 Copy monitor link\u003c/button>'+\n    '<a href=\"'+esc(here)+'\" target=\"_blank\"><button class=\"ghost\">↗ Open monitor page\u003c/button>\u003c/a>'+\n    '<button class=\"ghost\" onclick=\"makeQR(document.getElementById(\\'qrm1\\'),monitorLink(\\''+esc(s)+'\\'))\">🔄 Refresh QR\u003c/button>\u003c/div>\u003c/div>\u003c/div>';\n  if(phone){\n    html+='<p style=\"margin:12px 0 2px\"><b>② Monitor on ANY phone\u003c/b> – live from your Google Sheet (print the QR, stick it at the site):\u003c/p>'+\n      '<div class=\"qrbox\"><div id=\"qrm2\">\u003c/div><div class=\"link\">'+\n      '<input readonly value=\"'+esc(phone)+'\" onclick=\"this.select()\">'+\n      '<div class=\"row\"><button onclick=\"copyText(\\''+esc(phone).replace(/'/g,\"\\\\'\")+'\\')\">📋 Copy phone link\u003c/button>'+\n      '<a href=\"'+esc(phone)+'\" target=\"_blank\"><button class=\"ghost\">↗ Open phone page\u003c/button>\u003c/a>\u003c/div>\u003c/div>\u003c/div>';\n  } else {\n    html+='<div class=\"note\" style=\"margin-top:12px\">📱 <b>Phone link comes automatically\u003c/b> once Google Sheets is connected (⚙ Sheets Setup) – the orange chip on top runs that fix. QR ① works on the site PC right now.\u003c/div>';\n  }\n  html+='<p class=\"mut\" style=\"margin-top:10px\">Want the site staff to LOG IN instead? That is the 👥 Users login – it also sees only this site, and YOU choose <b>View-only or Allow edit\u003c/b> for it (🔒 button on the site card).\u003c/p>';\n  openModal(html);\n  makeQR($('#qrm1'), here);\n  if(phone) makeQR($('#qrm2'), phone);\n}\nfunction monitorAllModal(){\n  const rows=allSiteNames().map(s=>'<tr><td class=\"ml\">'+esc(s)+'\u003c/td>'+\n    '<td><button class=\"small ghost\" onclick=\"monitorModal(\\''+esc(s)+'\\')\">🖥 Link / QR\u003c/button>\u003c/td>'+\n    '<td><a href=\"'+esc(monitorLink(s))+'\" target=\"_blank\"><button class=\"small ghost\">↗ Open here\u003c/button>\u003c/a>\u003c/td>'+\n    '<td>'+(gasViewLink(s)?'<a href=\"'+esc(gasViewLink(s))+'\" target=\"_blank\"><button class=\"small ghost\">📱 Phone\u003c/button>\u003c/a>':'<span class=\"mut\">–\u003c/span>')+'\u003c/td>\u003c/tr>').join('');\n  openModal('<h3>🖥 Site Monitor – '+allSiteNames().length+' sites\u003c/h3>'+\n    '<div class=\"oknote\">Every link shows <b>ONLY that one site\u003c/b> – read-only entry data + charts. One site can never see another site\\'s data. Admin password is never on a monitor page.\u003c/div>'+\n    '<div class=\"tblwrap\" style=\"max-height:400px;overflow:auto\"><table><thead><tr><th class=\"ml\" style=\"position:static\">Site\u003c/th><th>Link + QR\u003c/th><th>Open here\u003c/th><th>Phone\u003c/th>\u003c/tr>\u003c/thead><tbody>'+rows+'\u003c/tbody>\u003c/table>\u003c/div>'+\n    '<p class=\"mut\" style=\"margin-top:8px\">Tip: press 🖥 Link / QR → print the QR → stick it at that site. The monitor page always shows the newest numbers after you press ⟳ Sync now.\u003c/p>');\n}\n\n/* ---------- QR / share ---------- */\n/* Token is deterministic (same on every device) so QR links work anywhere.\n   If Google Sheets is linked, the share link also carries the Web App URL\n   (?u=...) so ANY phone scanning the QR pulls the LIVE sheet data. */\nfunction genToken(s){ return 'tk'+hsh('share|'+s+'|hvac2026').slice(1,9); }\nlet SHARE_SITE='';\nfunction shareBase(){\n  /* a QR scanned by a PHONE needs an internet address - a local file path never works */\n  const cur=location.href.split('#')[0];\n  if(/^https?:/i.test(cur)) return cur;\n  return (SET.hostBase||'').replace(/\\/+$/,'');\n}\nfunction shareLink(s,purpose){\n  const base=shareBase();\n  if(!base) return '';\n  const u=SET.gasUrl?('&u='+encodeURIComponent(SET.gasUrl)):'', tok=genToken(s);\n  return base+'#/view/'+encodeURIComponent(s)+'?t='+tok+(purpose==='edit'?'&p=edit':'')+u;   /* v5.20: p=edit = link opens ready for typing */\n}\n/* v5.5: Google itself serves the read-only page (/exec?view=SITE&t=token).\n   The QR can point there - it works on ANY phone: no hosting, no app install. */\nfunction gasViewLink(s){\n  if(!SET.gasUrl) return '';\n  const a=shareBase();   /* v5.21: carry the app base so the phone page can build its Edit link */\n  return SET.gasUrl + (SET.gasUrl.indexOf('?')>-1?'&':'?') + 'view=' + encodeURIComponent(s) + '&t=' + genToken(s) + (/^https?:/i.test(a)?('&a='+encodeURIComponent(a)):'');\n}\nfunction saveHostBase(){\n  const v=(($('#hb')&&$('#hb').value)||'').trim().replace(/\\/+$/,'');\n  if(!/^https?:\\/\\//i.test(v)){ toast('Paste the https:// link you got after hosting'); return; }\n  SET.hostBase=v; saveLS(LS.set,SET);\n  toast('Hosted address saved ✓ – QR + link now work on every phone');\n  shareModal(SHARE_SITE);\n}\nfunction makeQR(el, text){\n  el.innerHTML='';\n  if(window.QRCode){\n    try{\n      new QRCode(el,{text:text,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});\n      /* safety net: some builds fill the <img> a tick later - if it stays empty, show the canvas */\n      setTimeout(function(){\n        const cv=el.querySelector('canvas'), im=el.querySelector('img');\n        if(cv&&im&&!(im.getAttribute('src')||'')){ im.style.display='none'; cv.style.display='block'; }\n      },200);\n      return;\n    }catch(e){}\n  }\n  el.innerHTML='<div class=\"mut\" style=\"width:180px;height:180px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px\">QR needs internet.<br>Use the link below.\u003c/div>';\n}\n/* v5.20: the share dialog shows ONLY TWO QR codes - ① 📱 PHONE (read-only\n   live page served by Google, works on any phone) and ② 🖥 MONITOR (this app,\n   only that one site). The ADMIN picks the purpose of the monitor link -\n   👁 VIEW (read-only) or ✏ EDIT (opens ready for typing, no password needed) -\n   and shares it. The site-login edit/view switch lives on the site cards. */\n/* v5.20: the share dialog shows ONLY TWO QR codes - ① 📱 PHONE (read-only\n   live page served by Google, works on any phone) and ② 🖥 MONITOR (this app,\n   only that one site). The ADMIN picks the purpose of the monitor link -\n   👁 VIEW (read-only) or ✏ EDIT (opens ready for typing, no password needed) -\n   and shares it. The site-login edit/view switch lives on the site cards. */\nlet SHARE_PURPOSE='view';\nfunction setSharePurpose(p){\n  SHARE_PURPOSE=(p==='edit')?'edit':'view';\n  shareModal(SHARE_SITE);\n}\nfunction shareModal(s){\n  SHARE_SITE=s;\n  if(!isAdmin()) SHARE_PURPOSE='view';   /* v5.20: the EDIT purpose is an admin privilege */\n  const hosted=/^https?:/i.test(location.href.split('#')[0]);\n  const glink=gasViewLink(s);\n  const mlink=shareLink(s,SHARE_PURPOSE);\n  const editing=SHARE_PURPOSE==='edit';\n  let html='<h3>🔗 Share: '+esc(s)+'\u003c/h3><div class=\"qrbox\">';\n  if(isAdmin()){\n    html+='<p style=\"margin:2px 0 6px\"><b>📌 Link purpose\u003c/b> – pick, then share the 🖥 MONITOR link below: '+\n      '<span class=\"chip '+(editing?'green':'gray')+'\">'+(editing?'✏ EDIT – opens ready for typing':'👁 VIEW – opens read-only')+'\u003c/span>\u003c/p>'+\n      '<div class=\"row\" style=\"margin-bottom:6px\">'+\n      '<button class=\"'+(editing?'ghost':'')+'\" onclick=\"setSharePurpose(\\'view\\')\">👁 View purpose\u003c/button>'+\n      '<button class=\"'+(editing?'':'ghost')+'\" onclick=\"setSharePurpose(\\'edit\\')\">✏ Edit purpose\u003c/button>\u003c/div>';\n  }\n  html+='<p class=\"mut\" style=\"margin:4px 0 2px\"><b>① 📱 PHONE QR\u003c/b> – live read-only page, works on ANY phone. <span class=\"chip green\" style=\"font-size:10px;vertical-align:middle\">scan &amp; look\u003c/span>\u003c/p>';\n  if(glink){\n    if(SET.gasVer && SET.gasVer!==APP_VERSION){\n      html+='<div class=\"note\" style=\"margin:6px 0\">⚠ <b>QR test will fail until the sheet is updated:\u003c/b> your Google Sheet runs code <b>v'+esc(SET.gasVer)+'\u003c/b>, this app is <b>v'+APP_VERSION+'\u003c/b>. Fix (2 min, one time): press the <b>orange chip on top\u003c/b> → 🔧 wizard.\u003c/div>';\n    }\n    html+='<div id=\"qrimg0\">\u003c/div><div class=\"link\">'+\n      '<input readonly value=\"'+esc(glink)+'\" onclick=\"this.select()\">'+\n      '<div class=\"row\"><button onclick=\"copyText(\\''+esc(glink).replace(/'/g,\"\\\\'\")+'\\')\">📋 Copy link\u003c/button>'+\n      '<a href=\"'+esc(glink)+'\" target=\"_blank\"><button class=\"ghost\">🔍 Open QR page (test)\u003c/button>\u003c/a>'+\n      '<button class=\"ghost\" onclick=\"makeQR(document.getElementById(\\'qrimg0\\'),gasViewLink(\\''+esc(s)+'\\'))\">🔄 Refresh QR\u003c/button>\u003c/div>'+\n      '\u003c/div>';\n  } else {\n    html+='<div class=\"note\" style=\"margin:6px 0\">This QR needs the Web App URL – open <b>⚙ Sheets Setup\u003c/b>, save your URL once, then it works on every phone.\u003c/div>';\n  }\n  html+='<p class=\"mut\" style=\"margin:12px 0 2px\"><b>② 🖥 MONITOR link\u003c/b> – this app showing only '+esc(s)+\n    (editing?' – <b>EDIT purpose: opens ready for typing, no password needed\u003c/b>':' – read-only with charts')+\n    (isAdmin()?'':' (the admin shares it)')+'\u003c/p>';\n  if(mlink){\n    html+='<div id=\"qrimg\">\u003c/div><div class=\"link\">'+\n      '<input readonly value=\"'+esc(mlink)+'\" onclick=\"this.select()\">'+\n      '<div class=\"row\"><button onclick=\"copyText(\\''+esc(mlink).replace(/'/g,\"\\\\'\")+'\\')\">📋 Copy link\u003c/button>'+\n      '<a href=\"'+esc(mlink)+'\" target=\"_blank\"><button class=\"ghost\">↗ Open\u003c/button>\u003c/a>'+\n      '<button class=\"ghost\" onclick=\"makeQR(document.getElementById(\\'qrimg\\'),shareLink(\\''+esc(s)+'\\',SHARE_PURPOSE))\">🔄 Refresh QR\u003c/button>\u003c/div>'+\n      (!hosted?'<p class=\"mut\" style=\"margin-top:6px\">✓ QR uses your hosted address <b>'+esc(shareBase())+'\u003c/b> – works on any phone.\u003c/p>':'')+\n      '\u003c/div>';\n  } else {\n    html+='<div class=\"note\" style=\"margin:6px 0\"><b>This app is a LOCAL file, so the monitor-link QR needs one-time hosting (2 minutes):\u003c/b><br><b>1.\u003c/b> Open <b>netlify.com/drop\u003c/b> (free, no account).<br><b>2.\u003c/b> Drag <b>HVAC-Manager-v5.html\u003c/b> onto that page → you get a link like <i>https://something.netlify.app\u003c/i><br><b>3.\u003c/b> Paste that link below → QR + link work on ANY phone. <i>(Or just use the PHONE QR – it works without this.)\u003c/i>\u003c/div>'+\n      '<div class=\"row\"><input id=\"hb\" style=\"flex:1\" placeholder=\"https://your-app.netlify.app\" value=\"'+esc(SET.hostBase||'')+'\"><button onclick=\"saveHostBase()\">💾 Save &amp; show QR\u003c/button>\u003c/div>';\n  }\n  html+='<p class=\"mut\" style=\"margin-top:10px\">Only these two. 📱 PHONE QR → print &amp; stick at the site (anyone can look). 🖥 MONITOR link → send to the PC'+(isAdmin()?' with the purpose you picked above.':'.')+'\u003c/p>';\n  html+='\u003c/div>';\n  openModal(html);\n  if(glink) makeQR($('#qrimg0'), glink);\n  if(mlink) makeQR($('#qrimg'), mlink);\n}\n\n/* ---------- modal / toast ---------- */\nfunction openModal(html){\n  closeModal();\n  const w=document.createElement('div'); w.className='modalbg'; w.id='modalbg';\n  w.innerHTML='<div class=\"modal\"><button class=\"close\" onclick=\"closeModal()\">✕\u003c/button>'+html+'\u003c/div>';\n  w.addEventListener('click',e=>{ if(e.target===w) closeModal(); });\n  document.body.appendChild(w);\n}\nfunction closeModal(){ const m=$('#modalbg'); if(m) m.remove(); }\nfunction copyText(t){\n  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('Copied ✓'),()=>fallbackCopy(t)); }\n  else fallbackCopy(t);\n}\nfunction fallbackCopy(t){\n  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();\n  try{ document.execCommand('copy'); toast('Copied ✓'); }catch(e){ toast('Copy failed'); }\n  ta.remove();\n}\n\n/* ---------- views ---------- */\nfunction fixSticky(){\n  const hd=document.querySelector('header');\n  if(hd) document.documentElement.style.setProperty('--hh', hd.offsetHeight+'px');\n  const g=document.querySelector('#tablebox thead tr.grp');\n  if(g) document.documentElement.style.setProperty('--hh2', g.offsetHeight+'px');\n  /* sticky page-level headers only work when the table needs no horizontal scroll;\n     wide tables get their own capped scroll area with in-container sticky headers */\n  const hh=(hd?hd.offsetHeight:48);\n  document.querySelectorAll('main .tblwrap').forEach(w=>{\n    const t=w.querySelector('table'); if(!t) return;\n    w.classList.remove('fit','tall'); w.style.maxHeight='';\n    if(t.scrollWidth<=w.clientWidth+2){ w.classList.add('fit'); return; }\n    const maxH=Math.max(260, window.innerHeight-hh-60);\n    if(t.offsetHeight>maxH){ w.classList.add('tall'); w.style.maxHeight=maxH+'px'; }\n  });\n}\nfunction render(){\n  try{ renderInner(); }\n  catch(err){ renderError(err); }\n  requestAnimationFrame(fixSticky);\n}\n/* v5.6: NOTHING may break silently any more. If any drawing step fails, the\n   admin sees the reason on screen + a one-click clean start. The usual cause\n   of \"no graphs / half dashboard\" is OLD SAVED BROWSER DATA from v5.2-v5.4. */\nfunction renderError(err){\n  const msg=String((err&&err.message)||err||'unknown error');\n  try{ closeModal(); }catch(e){}\n  $('#app').innerHTML='<div class=\"login-wrap\"><div class=\"login\"><h1>⚠ Page problem\u003c/h1>'+\n    '<div class=\"fl\">A part of the page failed to draw. This is almost always OLD SAVED BROWSER DATA from an earlier version of this file.\u003c/div>'+\n    '<div class=\"note\" style=\"text-align:left;word-break:break-all\"><b>Error:\u003c/b> '+esc(msg)+'\u003c/div>'+\n    '<button style=\"width:100%;margin-top:14px\" onclick=\"resetAppData()\">🧹 Clean start (clears old saved data)\u003c/button>'+\n    '<div class=\"hint\" style=\"margin-top:12px\">Your Google Sheet keeps ALL data – after the clean start just log in again and press ⟳ Sync now to pull everything back.\u003c/div>\u003c/div>\u003c/div>';\n}\nfunction resetAppData(){\n  if(!confirm('Clean start?\\n\\nThis clears the data saved in THIS browser only. Your Google Sheet keeps everything.\\nAfter the clean start: log in again → press ⟳ Sync now.')) return;\n  try{ localStorage.clear(); sessionStorage.clear(); }catch(e){}\n  location.reload();\n}\nfunction renderInner(){\n  closeModal();\n  const app=$('#app');\n  const h=location.hash||'#/home';\n  /* v5.19: one-click login link (#/key/USER/TOKEN) - logs in with no password\n     and no storage (works even when browser storage is blocked / private mode) */\n  const km=h.match(/^#\\/key\\/([^/]+)\\/(h[0-9a-f]+)$/);\n  if(km){\n    const ku=decodeURIComponent(km[1]);\n    if(USERS[ku]&&quickKey(ku)===km[2]){\n      SES={name:ku, role:USERS[ku].role, site:USERS[ku].site||null, at:isoNow()};\n      saveLS(LS.ses, SES);\n      sesCookieWrite();\n      toast('\\u2705 Logged in as '+ku+' - no password needed');\n      location.hash = SES.role==='admin' ? '#/admin' : '#/site/'+encodeURIComponent(SES.site);\n      render();\n      if(SES.role==='admin') setTimeout(editReqPopup, 800);   /* v5.24: show edit requests at admin login */\n      return;\n    }\n  }\n  const vm=h.match(/^#\\/view\\/([^?]+)(?:\\?(.*))?$/);\n  if(vm){\n    const q={}; (vm[2]||'').split('&').forEach(kv=>{ const i=kv.indexOf('='); if(i>0){ try{ q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); }catch(e){} } });\n    return renderView(decodeURIComponent(vm[1]), q.t||'', q.u||'', q.p||'');   /* v5.20: p=edit */\n  }\n  if(!SES){ return renderLogin(); }\n  const sm=h.match(/^#\\/site\\/(.+)$/);\n  if(sm&&canSeeSite(decodeURIComponent(sm[1]))){ return renderSite(decodeURIComponent(sm[1])); }\n  if(h==='#/summary'&&SES){ return renderSummary(); }   /* v5.5: the Summary sheet page */\n  if(h==='#/analysis'&&isAdmin()){ return renderAnalysis(); }   /* v5.9: full analysis dashboard (graphs page) */\n  if(h==='#/passwords'&&isAdmin()){ return renderPasswords(); }\n  if(isAdmin()){ return renderAdmin(); }\n  return renderSite(SES.site||'');\n}\nfunction headerHTML(title, backHash, extra){\n  const g = isAdmin() ? globalLastUpdate() : lastUpdateOf(SES?SES.site:'');\n  return storageBanner()+'<header><span class=\"brand\">❄ '+esc(title)+'\u003c/span><span class=\"chip gray\">v'+APP_VERSION+'\u003c/span>'+\n    (backHash?'<a href=\"'+backHash+'\"><button class=\"ghost small\">← Back\u003c/button>\u003c/a>':'')+\n    (STORAGE_OK?'':(STOR_HIDE?'<span class=\"chip orange\" onclick=\"storShow()\" style=\"cursor:pointer\" title=\"Show the storage warning again\">\\u26a0 no save\u003c/span>':''))+\n    '<span class=\"spacer\">\u003c/span>'+\n    '<span class=\"lastupd\">Last update: '+(g?fmtTS(g.ts)+(g.site?' • '+esc(g.site):'')+' • '+esc(g.by||''):'–')+'\u003c/span>'+\n    '<span id=\"syncchip\" class=\"chip gray\" onclick=\"chipClick()\" style=\"cursor:pointer\">Google Sheets: …\u003c/span>'+\n    (extra||'')+\n    '<button class=\"ghost\" onclick=\"logout()\">Logout ('+esc(SES?SES.name:'')+')\u003c/button>\u003c/header>';\n}\nfunction renderLogin(){\n  $('#app').innerHTML='<div class=\"login-wrap\"><div class=\"login\">'+\n    '<div style=\"font-size:34px\">❄\u003c/div><h1>HVAC Consumption\u003c/h1><div class=\"fl\">Manager – sites &amp; energy records &nbsp;<span class=\"chip\">v'+APP_VERSION+'\u003c/span>\u003c/div>'+\n    (STORAGE_OK||STOR_HIDE?'':'<div class=\"hint\" style=\"margin-bottom:10px\">ℹ Data is saved in Google Sheets – not on this device.<br>💡 Tired of typing the password? Use your <b>one-click login link\u003c/b> (ask the admin – Admin page → ⚡ Quick links) – open it and you are logged in, no password.\u003c/div>')+\n    '<label>Username\u003c/label><input id=\"lu\" autocomplete=\"username\" placeholder=\"admin or site id\">'+\n    '<label>Password\u003c/label><input id=\"lp\" type=\"password\" autocomplete=\"current-password\" placeholder=\"••••••••\">'+\n    '<button onclick=\"doLogin()\">Login\u003c/button>'+\n    '<div class=\"err\" id=\"lerr\">Wrong username or password\u003c/div>'+\n    '<div class=\"mut\" style=\"margin-top:10px\">🔒 Safety: the password is asked again on every open and every refresh.\u003c/div>'+\n    '<div class=\"snow-panel\" aria-hidden=\"true\"><div class=\"snow-fall\">'+\n      '<i style=\"left:6%;animation-duration:10.5s;animation-delay:-1.2s\"><b style=\"font-size:14px;opacity:0.8;animation-duration:2.6s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:14%;animation-duration:8.2s;animation-delay:-4s\"><b style=\"font-size:10px;opacity:0.55;animation-duration:2.1s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:22%;animation-duration:12.5s;animation-delay:-7.5s\"><b style=\"font-size:16px;opacity:0.9;animation-duration:3s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:31%;animation-duration:9s;animation-delay:-2.6s\"><b style=\"font-size:11px;opacity:0.6;animation-duration:2.3s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:39%;animation-duration:11s;animation-delay:-8.8s\"><b style=\"font-size:13px;opacity:0.75;animation-duration:2.8s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:47%;animation-duration:8s;animation-delay:-5.5s\"><b style=\"font-size:9px;opacity:0.5;animation-duration:1.9s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:55%;animation-duration:12s;animation-delay:-0.8s\"><b style=\"font-size:15px;opacity:0.85;animation-duration:2.9s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:64%;animation-duration:9.6s;animation-delay:-6.2s\"><b style=\"font-size:11px;opacity:0.6;animation-duration:2.2s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:72%;animation-duration:10.8s;animation-delay:-3.4s\"><b style=\"font-size:14px;opacity:0.8;animation-duration:2.7s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:81%;animation-duration:8.6s;animation-delay:-9.6s\"><b style=\"font-size:10px;opacity:0.55;animation-duration:2s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:89%;animation-duration:11.8s;animation-delay:-4.7s\"><b style=\"font-size:13px;opacity:0.7;animation-duration:3.1s\">❄\u003c/b>\u003c/i>'+\n      '<i style=\"left:95%;animation-duration:9.9s;animation-delay:-1.9s\"><b style=\"font-size:12px;opacity:0.65;animation-duration:2.4s\">❄\u003c/b>\u003c/i>'+\n      '\u003c/div><div class=\"snow-core\"><span class=\"r\">\u003c/span><span class=\"r\">\u003c/span><span class=\"r\">\u003c/span><span class=\"f\">❄\u003c/span>\u003c/div>\u003c/div>'+\n    '\u003c/div>\u003c/div>';\n  $('#lp').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });\n  $('#lu').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#lp').focus(); });\n  syncStatus();\n}\nfunction doLogin(){\n  const u=$('#lu').value.trim(), p=$('#lp').value;\n  const s=login(u,p);\n  if(!s){ $('#lerr').style.display='block'; return; }\n  location.hash = s.role==='admin' ? '#/admin' : '#/site/'+encodeURIComponent(s.site);\n  render();\n  if(s.role==='admin') setTimeout(editReqPopup, 800);   /* v5.24: show edit requests at admin login */\n}\nfunction statCard(n,l,onclick,sub){ return '<div class=\"stat'+(onclick?' click':'')+'\"'+(onclick?' onclick=\"'+onclick+'\"':'')+'><div class=\"n\">'+n+'\u003c/div><div class=\"l\">'+l+'\u003c/div>'+(sub?'<div class=\"s\">'+sub+'\u003c/div>':'')+'\u003c/div>'; }\n\n/* ---------- admin dashboard ---------- */\nfunction renderAdmin(){\n  const y=curYear();\n  const cm=new Date().getMonth();\n  let tBtu=0,tEbdg=0,tBilled=0;\n  const entered=sitesWithData(y,cm);\n  const pend=allSiteNames().length-entered.length;\n  const lm=latestMonthWithData(y);\n  let avg='–', avgLab=MONTHS[cm]+' '+y+' (TR-weighted)';\n  if(lm>=0){ const a=monthAgg(y,lm); if(a.btu>0){ avg=(a.ebdg/a.btu).toFixed(2); avgLab=MONTHS[lm]+' '+y+' (TR-weighted)'; } }\n  allSiteNames().forEach(s=>{\n    const t=yearTotals(DATA[s]&&DATA[s][y]);\n    if(t){ tBtu+=t.btu; tEbdg+=t.ebdg; tBilled+=t.billed; }\n  });\n  const extra='<button class=\"ghost\" onclick=\"location.hash=\\'#/analysis\\'\">📊 Analysis\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"location.hash=\\'#/summary\\'\">📋 Summary\u003c/button>'+\n    '<a href=\"#/passwords\"><button class=\"ghost\">🔑 Passwords\u003c/button>\u003c/a>'+\n    '<button class=\"ghost\" onclick=\"usersModal()\">👥 Users\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"setupModal()\">⚙ Sheets Setup\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"quickLinksModal()\">⚡ Quick links\u003c/button>'+\n    '<button onclick=\"siteModal()\">＋ Add site\u003c/button>';\n  $('#app').innerHTML=headerHTML('HVAC Manager – Admin','#/admin',extra)+\n  '<main>'+\n    '<div class=\"hero\"><div><h2>❄ HVAC Dashboard\u003c/h2>'+\n    '<div class=\"hsub\">'+allSiteNames().length+' sites • year '+y+' • '+entered.length+'/'+allSiteNames().length+' entered this month • every save also goes to your Google Sheet\u003c/div>\u003c/div>'+\n    '<div class=\"hbtns\">'+\n      '<button onclick=\"monitorAllModal()\">🖥 Site Monitor\u003c/button>'+\n      '<button class=\"solid\" onclick=\"location.hash=\\'#\\/analysis\\'\">📊 Analysis\u003c/button>'+\n      '<button class=\"solid\" onclick=\"location.hash=\\'#\\/summary\\'\">📋 Summary\u003c/button>'+\n      '<button class=\"solid\" onclick=\"pull()\">⟳ Sync now\u003c/button>\u003c/div>\u003c/div>'+\n    '<div class=\"toolbar\">'+\n    '<input class=\"search\" id=\"q\" placeholder=\"🔍 Search site…\" oninput=\"drawCards()\">'+\n    '<button class=\"ghost\" onclick=\"download(\\'HVAC_AllSites_'+y+'.csv\\', siteCSV(allSiteNames()))\">⬇ Export all CSV\u003c/button>'+\n    '<button class=\"ghost\" onclick=\"copyText(tsvAll(allSiteNames()))\">📋 Copy for Sheets\u003c/button>\u003c/div>'+\n    '<div class=\"stats\">'+\n      statCard(allSiteNames().length,'🏭 Sites – active locations','sitesModal()','click to view all')+\n      statCard(entered.length+' / '+allSiteNames().length,'🗓 Entries – '+MONTHS[cm]+' '+y,'entriesMonthModal()',pend+' site(s) pending')+\n      statCard(avg,'📈 Avg kW/TR','kwtrModal()',avgLab)+\n      statCard(fmt(tBtu),'❄ BTU TR – '+y,\"metricModal('btu')\",'click for site-wise')+\n      statCard(fmt(tEbdg,0),'⚡ EB+DG kWh – '+y,\"metricModal('ebdg')\",'click for site-wise')+\n      statCard('₹ '+fmtL(tBilled),'💰 Billed – '+y,\"metricModal('billed')\",'click for site-wise (Lakh)')+\n    '\u003c/div>'+\n    '<div class=\"topbox\"><h3 style=\"margin-bottom:2px\">🏆 Site rankings – highest reading\u003c/h3>'+\n      '<div class=\"row\" style=\"margin:6px 0 10px\">'+\n        '<label class=\"mut\">Metric\u003c/label>'+\n        '<select id=\"tm\" onchange=\"drawTop()\">'+\n          '<option value=\"btu\">BTU Cons. in TR\u003c/option>'+\n          '<option value=\"ebdg\">EB+DG (kWh)\u003c/option>'+\n          '<option value=\"billed\">Billed Amount (₹)\u003c/option>'+\n          '<option value=\"eb\">EB (kWh)\u003c/option>'+\n          '<option value=\"dg\">DG (kWh)\u003c/option>'+\n        '\u003c/select>'+\n        '<label class=\"mut\">Year\u003c/label>'+\n        '<select id=\"ty\" onchange=\"drawTop()\">\u003c/select>'+\n        '<label class=\"mut\">View\u003c/label>'+\n        '<select id=\"tview\" onchange=\"drawTop()\"><option value=\"top\">Top 10 sites\u003c/option><option value=\"all\">All sites\u003c/option><option value=\"groups\">Groups – name families\u003c/option>\u003c/select>'+\n        '<span class=\"mut\" id=\"tnote\">\u003c/span>'+\n      '\u003c/div>'+\n      '<div id=\"toplist\">\u003c/div>'+\n    '\u003c/div>'+\n    '<div class=\"topbox\"><h3 style=\"margin-bottom:2px\">📈 Full graphs – all sites combined\u003c/h3>'+\n      '<div class=\"row\" style=\"margin:6px 0 4px\">'+\n        '<label class=\"mut\">Year\u003c/label>'+\n        '<select id=\"gy\" onchange=\"drawDashCharts()\">\u003c/select>'+\n        '<span class=\"mut\">every site summed together\u003c/span>'+\n      '
